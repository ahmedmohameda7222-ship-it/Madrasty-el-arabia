/* V6.1 — Refined graphite / jade appearance. Scoped to dark theme only. */
.app[data-theme="dark"] {
  --bg: #0e151b;
  --surface: #1b272e;
  --paper: #162128;
  --ink: #f4f7f7;
  --ink2: #d7e0e2;
  --muted: #afbec5;
  --forest: #244e40;
  --forest2: #93dfbd;
  --sage: #263e35;
  --brass: #d5bb8f;
  --brass-soft: #302f2a;
  --divider: #35444c;
  --shade: 0 12px 28px rgba(0, 0, 0, .16);
  background: var(--bg);
  color: var(--ink);
}

/* Clear hierarchy between the canvas, content groups, and controls. */
.app[data-theme="dark"] :is(.app-scroll,.screen,.screen-header,.statusbar){
  background:var(--bg)!important;color:var(--ink);
}
.app[data-theme="dark"] :is(.mini-stats,.quick-link,.card-flat,.v5-list,.v5-record,
  .v5-analytics>div,.v5-bars,.v5-email-paper,.v5-att-list,.list-surface,
  .v6-scoreline,.v6-check-group,.v5-desc-card,.v5-message-group,
  .v5-homework-card,.v5-profile-card,.v5-email-card,.v5-grade-card,
  .v6-priority-link,.v6-report-card,.more-group,.msg-item,.v5-section-card){
  background:var(--surface)!important;
  color:var(--ink)!important;
  border-color:var(--divider)!important;
  box-shadow:none!important;
}
.app[data-theme="dark"] :is(.mini-val,.mini-stats strong,.v5-record strong,
  .v5-analytics strong,.v5-profile h1,.v5-student-head h1,.v5-email-brand,
  .v6-scoreline b,.v6-report-metrics strong){color:var(--ink)!important}
.app[data-theme="dark"] :is(.mini-label,.v5-record small,.v5-profile p,
  .v5-student-head p,.msg-preview,.msg-meta,.v5-email-meta>span,
  .v5-help,.page-sub,.lead,.list-desc,.group-caption,.v6-scoreline span,
  .v5-grade-caption,.v5-row-sub,.v5-desc-card p){color:var(--muted)!important}
.app[data-theme="dark"] :is(.mini-stat+.mini-stat:before,
  .list-row+.list-row:before,.more-item+.more-item:before){background:var(--divider)!important}
.app[data-theme="dark"] :is(.more-item,.list-row,.v5-record,.msg-item){border-color:var(--divider)!important}

/* The home action remains the one intentionally prominent surface. */
.app[data-theme="dark"] .hero,
.app[data-theme="dark"] :is(.v5-finance-summary,.v5-grade-feature,.v5-att-summary){
  background:linear-gradient(142deg,#22483e 0%,#193830 58%,#152e2b 100%)!important;
  color:#f8fbf9!important;
  border:1px solid rgba(157,219,179,.16)!important;
  box-shadow:0 12px 28px rgba(0,0,0,.14)!important;
}
.app[data-theme="dark"] .hero-title{color:#f8fbf9!important}
.app[data-theme="dark"] .hero-kicker{color:#dfca9e!important}
.app[data-theme="dark"] .hero-desc{color:#d1dfd8!important}
.app[data-theme="dark"] .hero-button{
  background:#e4f3e9!important;color:#173e32!important;
  border:1px solid rgba(255,255,255,.1)!important;
}

/* Subtle, truly dark bottom tab bar. No white halo / neon selected pill. */
.app[data-theme="dark"] .footer-tabs{
  background:rgba(27,39,47,.95)!important;
  border:1px solid rgba(167,190,197,.20)!important;
  box-shadow:0 12px 34px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.045)!important;

}
.app[data-theme="dark"] .nav-item{color:#afbec5!important}

}

.app[data-theme="dark"][data-platform="android"] .nav-item.active .icon{

/* Brand and shortcuts use jade only as an accent, never as a large fill. */

function calendarPage(){
 const first=new Date(UI.year,UI.month,1), n=new Date(UI.year,UI.month+1,0).getDate();
 const dateISO=(day)=>`${UI.year}-${String(UI.month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

 const selectedEvents=data.events.filter(e=>canSeeEvent(e)&&e.date>=UI.day).sort((a,b)=>a.date.localeCompare(b.date));

 return `<div class="screen">${mainHeader(l('التقويم','Calendar'))}<div class="page-intro"><h1 class="page-title">${l('لحظات تستحق التذكّر.','Every day counts.')}</h1><p class="page-sub">${l('كل مواعيد المدرسة وفعالياتها في مكان واحد.','School events, thoughtfully in one place.')}</p></div><div class="month-heading"><h2>${esc(month)}</h2><div class="month-btns"><button class="month-btn" data-action="calendar-next">${I('back','sm')}</button><button class="month-btn" data-action="calendar-prev">${I('chevron','sm')}</button></div></div>
 <div class="calendar"><div class="cal-grid">${[l('الأحد','Sun'),l('الإثنين','Mon'),l('الثلاثاء','Tue'),l('الأربعاء','Wed'),l('الخميس','Thu'),l('الجمعة','Fri'),l('السبت','Sat')].map(x=>`<span class="cal-weekday">${x}</span>`).join('')}${days.join('')}</div></div>
 <div class="event-list"><div class="section-row"><div class="section-heading">${l('الأحداث القادمة','Upcoming events')}</div>${UI.role==='admin'?`<button class="text-action" data-action="event-create">${I('plus','sm')} ${l('إضافة','Add')}</button>`:''}</div>${selectedEvents.map(e=>`<button class="event-row" style="width:100%;text-align:right" data-action="event-detail" data-id="${e.id}"><span class="event-date"><strong>${Number(e.date.slice(-2))}</strong><small>${l('نوف','Nov')}</small></span><span class="event-main"><span class="event-title">${esc(t(e.title))}</span><span class="event-note" style="display:block">${fmt(e.date)} · ${esc(e.time)}</span></span><span class="event-tag">${e.type==='exam'?l('اختبار','Exam'):e.type==='meeting'?l('اجتماع','Meeting'):l('فعالية','Event')}</span></button>`).join('')||`<div class="empty">${l('لا توجد أحداث قادمة في هذه الفترة','No upcoming events in this period')}</div>`}</div>${UI.role==='admin'?`<button class="floating-action" data-action="event-create">${I('plus')} ${l('حدث جديد','New event')}</button>`:''}</div>`;

function renderSheet(){
 if(!UI.sheet)return '';
 const r=UI.sheet;
 const option=(ico,title,subtitle,action,ok=false)=>`<button class="sheet-option" data-action="${action}" data-testid="${action}"><span class="list-leading">${I(ico)}</span><span class="copy"><div class="title">${title}</div><div class="subtitle">${subtitle||''}</div></span>${ok?I('check','sm ok'):I('back','sm row-arrow')}</button>`;
 const body=r==='roles'?`<h2 class="sheet-title">${l('تجربة كل دور','Explore each role')}</h2><p class="sheet-sub">${l('اختيار الدور هنا للمعاينة فقط وليس تسجيل دخول حقيقيًا.','Role switch is for design preview only, not real login.')}</p>${[['admin',l('إدارة المدرسة','Administration'),'shield'],['teacher',l('المعلمون','Teachers'),'book'],['parent',l('أولياء الأمور','Parents'),'people']].map(([id,n,ico])=>`<div data-testid="role-option">${option(ico,n,'',`select-role-${id}`,UI.role===id)}</div>`).join('')}`:
 r==='platform'?`<h2 class="sheet-title">${l('مظهر التطبيق','App appearance')}</h2><p class="sheet-sub">${l('تفاصيل التنقل تتكيّف مع النظام المختار.','Navigation follows the chosen platform.')}</p>${option('smartphone','iPhone / iOS',l('Floating translucent tab bar','Floating translucent tab bar'),'select-platform-ios',UI.platform==='ios')}${option('smartphone','Android / Material 3',l('Adaptive bottom navigation','Adaptive bottom navigation'),'select-platform-android',UI.platform==='android')}`:
 r==='language'?`<h2 class="sheet-title">${l('لغة التطبيق','App language')}</h2><p class="sheet-sub">${l('اختار اللغة المفضلة لديك.','Choose your preferred language.')}</p>${option('globe','العربية','Arabic','select-language-ar',UI.lang==='ar')}${option('globe','Deutsch','German','select-language-de',UI.lang==='de')}`:
 r==='delete-event'?`<h2 class="sheet-title">${l('حذف هذا الحدث؟','Delete this event?')}</h2><p class="sheet-sub">${l('سيُحذف الحدث من التقويم.','The event will be removed from the calendar.')}</p><button class="action-primary wide" data-action="confirm-delete-event">${I('check')} ${l('تأكيد الحذف','Confirm delete')}</button>`:
 `<h2 class="sheet-title">${l('إعادة البيانات التجريبية؟','Reset demo data?')}</h2><p class="sheet-sub">${l('سيتم استعادة بيانات العرض الأصلية وحذف تغييراتك المحلية.','Restore the original sample data and discard local changes.')}</p><button class="action-primary wide" data-action="reset-demo">${I('check')} ${l('إعادة الضبط','Reset demo')}</button>`;
 return `<div class="overlay" data-testid="bottom-sheet"><button class="close-overlay" data-action="close-sheet" aria-label="Close"></button><div class="sheet"><div class="sheet-handle"></div>${body}</div></div>`;
}
function renderContent(){
 switch(UI.screen||UI.tab){
 case 'home':return home(); case 'students':return studentsTab();case 'children':return childrenTab();case 'attendance':return attendanceTab();case 'messages':return messagesTab();case 'more':return moreTab();
 case 'notifications':return notifications();case 'broadcast-compose':return broadcastCompose();case 'broadcast-detail':return broadcastDetail();case 'email-preview':return emailPreview();case 'calendar':return calendarPage();case 'event-create':return eventCreate();case 'event-detail':return eventDetail();case 'parents':return parentsPage();case 'parent-create':return parentCreate();case 'parent-detail':return parentDetail();case 'parent-edit-links':return parentEditLinks();case 'student-detail':return studentDetail();case 'homework':return homeworkPage();case 'homework-detail':return homeworkDetail();case 'child-attendance':return childAttendance();case 'grades':return gradesPage();case 'fees':return feesPage();case 'reports':return reportsPage();case 'classes':return classesPage();case 'about':return aboutPage();case 'chat':return chatPage();default:return home();}
}
function render(){
 const app=$('#app');if(!app)return;
 const deep=!!UI.screen,chat=UI.screen==='chat';
 document.documentElement.lang=UI.lang==='de'?'de':'ar';document.documentElement.dir=UI.lang==='de'?'ltr':'rtl';
 app.dataset.platform=UI.platform;app.dataset.lang=UI.lang;app.dataset.role=UI.role;app.setAttribute('dir',UI.lang==='de'?'ltr':'rtl');
 app.innerHTML=`<div class="statusbar" aria-hidden="true"><span>${new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit'}).format(new Date())}</span><span class="status-right"><svg width="17" height="12" viewBox="0 0 17 12" fill="#263a34"><path d="M1 9.7h2.6V12H1zM5.1 7.5h2.6V12H5.1zM9.2 4.7h2.6V12H9.2zM13.3 2h2.6v10h-2.6z"/></svg><svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#263a34" stroke-width="1.7"><path d="M1 4Q8 -2 15 4M4 7q4-4 8 0M7 10h2"/></svg><span class="status-pill"></span></span></div>${UI.platform==='ios'?`<span class="status-notch" aria-hidden="true"></span>`:''}<main class="app-scroll ${deep?'no-nav':''} ${chat?'chat-scroll':''}" role="main">${renderContent()}</main>${!deep?nav():''}${(UI.screen==='attendance'||(!UI.screen&&UI.tab==='attendance'))&&UI.role==='teacher'?attendanceSticky():''}${chat?chatComposer():''}<div class="home-indicator ${chat?'chat-indicator':''}" aria-hidden="true"></div>${renderSheet()}${UI.toast?`<div class="toast" data-testid="toast">${I('checkCircle','sm')} ${esc(UI.toast)}</div>`:''}`;
 if(chat){const scroll=$('.app-scroll',app);if(scroll)scroll.scrollTop=scroll.scrollHeight;}
}
function navigate(screen){UI.stack.push({screen:UI.screen,tab:UI.tab});UI.screen=screen;UI.sheet=null;render();}
function tab(tab){UI.tab=tab;UI.screen=null;UI.sheet=null;UI.stack=[];UI.formSearch='';UI.msgFilter=UI.role==='parent'?'parent':'staff';render();}
function back(){if(UI.sheet){UI.sheet=null;render();return;}const old=UI.stack.pop();if(old){UI.screen=old.screen;UI.tab=old.tab}else{UI.screen=null;UI.tab='home'}render();}
let toastTimer;
function toast(text){UI.toast=text;render();clearTimeout(toastTimer);toastTimer=setTimeout(()=>{UI.toast=null;render()},2800)}
function changeMonth(diff){const x=new Date(UI.year,UI.month+diff,1);UI.month=x.getMonth();UI.year=x.getFullYear();UI.day=`${UI.year}-${String(UI.month+1).padStart(2,'0')}-01`;render()}
function act(action,el){
 if(!action||action==='none')return;
 const id=el?.dataset?.id, val=el?.dataset?.val;
 if(action==='back'){back();return}
 if(action==='sheet-roles'){UI.sheet='roles';render();return}
 if(action==='sheet-language'){UI.sheet='language';render();return}
 if(action==='sheet-platform'){UI.sheet='platform';render();return}
 if(action==='sheet-reset'){UI.sheet='reset';render();return}
 if(action==='close-sheet'){UI.sheet=null;render();return}
 if(action.startsWith('select-role-')){const r=action.slice(12);if(!['admin','teacher','parent'].includes(r))return;UI.role=r;UI.tab='home';UI.screen=null;UI.stack=[];UI.sheet=null;UI.msgFilter=r==='parent'?'parent':'staff';UI.formSearch='';render();return}
 if(action.startsWith('select-platform-')){UI.platform=action.slice(16);UI.sheet=null;prefs();render();return}
 if(action.startsWith('select-language-')){UI.lang=action.slice(16);UI.sheet=null;prefs();render();return}
 if(action==='reset-demo'){localStorage.removeItem(storageKey);location.reload();return}
 if(action==='messages-tab'){tab('messages');return}
 if(action==='attendance-tab'){if(UI.role==='teacher'){tab('attendance')}else{navigate('classes')}return}
 if(action==='notifications'){navigate('notifications');return}
 if(action==='broadcast-compose'){if(UI.role==='parent')return;UI.broadcastDraft={audience:UI.role==='admin'?'parents':'class',cls:'A1',title:'',body:''};navigate('broadcast-compose');return}
 if(action==='broadcast-audience'){UI.broadcastDraft.audience=val;render();return}
 if(action==='broadcast-detail'){UI.notifIndex=id||'N01';navigate('broadcast-detail');return}
 if(action==='email-preview'){navigate('email-preview');return}
 if(action==='msg-filter'){UI.msgFilter=val;render();return}
 if(action==='open-chat'){UI.chatId=id||'C01';navigate('chat');return}
 if(action==='calendar'){navigate('calendar');return}
 if(action==='calendar-next'){changeMonth(1);return}
 if(action==='calendar-prev'){changeMonth(-1);return}
 if(action==='calendar-day'){UI.day=id;render();return}
 if(action==='event-create'){if(UI.role!=='admin')return;UI.eventEditing=null;navigate('event-create');return}
 if(action==='event-edit'){if(UI.role!=='admin')return;UI.eventEditing=UI.eventId;navigate('event-create');return}
 if(action==='event-delete'){if(UI.role!=='admin')return;UI.sheet='delete-event';render();return}
 if(action==='confirm-delete-event'){if(UI.role!=='admin')return;data.events=data.events.filter(x=>x.id!==UI.eventId);persist();UI.sheet=null;UI.screen='calendar';toast(l('تم حذف الحدث','Event deleted'));return}
 if(action==='event-detail'){UI.eventId=id;navigate('event-detail');return}
 if(action==='parents'){if(UI.role!=='admin')return;navigate('parents');return}
 if(action==='parent-create'){if(UI.role!=='admin')return;UI.parentDraft={studentIds:[],name:'',email:''};navigate('parent-create');return}
 if(action==='parent-detail'){UI.parentId=id;navigate('parent-detail');return}
 if(action==='parent-edit-links'){const p=data.parents.find(x=>x.id===UI.parentId);if(!p)return;UI.parentEditing=p.id;UI.parentDraft={studentIds:[...p.studentIds]};navigate('parent-edit-links');return}
 if(action==='parent-save-links'){const p=data.parents.find(x=>x.id===UI.parentEditing);if(!p)return;p.studentIds=[...UI.parentDraft.studentIds];persist();UI.screen='parent-detail';toast(l('تم تحديث روابط الأبناء','Child links updated'));return}
 if(action==='parent-toggle-student'){const a=UI.parentDraft.studentIds;if(a.includes(id))UI.parentDraft.studentIds=a.filter(x=>x!==id);else a.push(id);render();return}
 if(action==='student-detail'){UI.studentId=id;navigate('student-detail');return}
 if(action==='select-student'){UI.studentId=id;render();return}
 if(action==='homework'){navigate('homework');return}
 if(action==='homework-detail'){UI.homeworkId=id;navigate('homework-detail');return}
 if(action==='child-attendance'){navigate('child-attendance');return}
 if(action==='grades'){navigate('grades');return}
 if(action==='fees'){navigate('fees');return}
 if(action==='reports'){navigate('reports');return}
 if(action==='classes'){navigate('classes');return}
 if(action==='about'){navigate('about');return}
 if(action==='attendance-status'){if(UI.role!=='teacher')return;data.attendance[id]=val;persist();render();return}
 if(action==='save-attendance'){persist();toast(l('تم حفظ حضور الفصل في المعاينة','Attendance saved '));return}
}
document.addEventListener('click',e=>{
 const tabTarget=e.target.closest('[data-tab]');if(tabTarget){tab(tabTarget.dataset.tab);return}
 const target=e.target.closest('[data-action]');if(target){e.preventDefault();act(target.dataset.action,target);return}
});
document.addEventListener('input',e=>{
 const f=e.target.dataset.field;
 if(f==='parent-name')UI.parentDraft.name=e.target.value;
 if(f==='parent-email')UI.parentDraft.email=e.target.value;
 if(f==='broadcast-title')UI.broadcastDraft.title=e.target.value;
 if(f==='broadcast-body')UI.broadcastDraft.body=e.target.value;
 if(e.target.hasAttribute('data-search')){UI.formSearch=e.target.value;const pos=e.target.selectionStart;render();const inp=$('[data-search]');if(inp){inp.focus();inp.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',e=>{if(e.target.dataset.field==='broadcast-cls')UI.broadcastDraft.cls=e.target.value});
document.addEventListener('submit',e=>{
 if(e.target.id==='broadcast-form'){
  e.preventDefault();if(UI.role==='parent')return;
  const d=UI.broadcastDraft;
  if(!d.title.trim()||!d.body.trim()){toast(l('اكتب العنوان والرسالة أولًا','Enter a title and message first'));return}
  const entry={id:'N'+Date.now(),title:E(d.title.trim(),d.title.trim()),body:E(d.body.trim(),d.body.trim()),audience:d.audience,cls:d.audience==='class'?(UI.role==='teacher'?'A1':d.cls):null,date:'2026-11-18',email:d.audience!=='teachers'};
  data.announcements.unshift(entry);
  audienceParents(entry).forEach(p=>data.emails.push({to:p.email,announcementId:entry.id,previewOnly:true}));
  persist();UI.notifIndex=entry.id;UI.stack.push({screen:'broadcast-compose',tab:UI.tab});UI.screen='broadcast-detail';toast(l('تم إرسال الإشعار','Announcement sent'));return;
 }
 if(e.target.id==='event-form'){
  e.preventDefault();if(UI.role!=='admin')return;
  const v=Object.fromEntries(new FormData(e.target));if(!v.title||!v.date)return;
  const entry={id:UI.eventEditing||'E'+Date.now(),date:v.date,title:E(v.title,v.title),time:v.time||'10:00',type:v.type||'event',cls:v.cls||null};data.events=data.events.filter(x=>x.id!==entry.id);data.events.push(entry);UI.eventEditing=null;persist();
  UI.day=v.date;const [y,m]=v.date.split('-').map(Number);UI.year=y;UI.month=m-1;UI.screen='calendar';UI.stack=[{screen:null,tab:'more'}];toast(l('تم حفظ الحدث','Event saved'));return;
 }
 if(e.target.id==='parent-form'){
  e.preventDefault();if(UI.role!=='admin')return;
  const v=Object.fromEntries(new FormData(e.target));const name=String(v.name||'').trim(),email=String(v.email||'').trim().toLowerCase();

profileMenu=function(){const role=UI.role;const school=[['subjects','المواد الدراسية','Subjects','book'],['curriculum','المناهج والدروس','Curriculum & lessons','layers'],['homework','الواجبات','Homework','document'],...(role!=='parent'?[['grading-center','تصحيح الواجبات','Grading inbox','clipboard']]:[]),['evaluations','تقييمات الطلاب','Student evaluations','star'],['exams','الاختبارات والنتائج','Exams & results','award'],['timetable','جدول الحصص','Timetable','calendar'],['academic-reports','التقارير الأكاديمية','Academic reports','chart']];

 return `${v6FormHead(l('المزيد','More'),l('الخدمات والإعدادات','Services & settings'),who)}${v6Group(l('التعليم والمتابعة','LEARNING & PROGRESS'),school,true)}${v6Group(role==='admin'?l('إدارة المدرسة','SCHOOL OPERATIONS'):role==='teacher'?l('فصولي','MY CLASSES'):l('متابعة الأبناء','FAMILY'),filteredOffice,false)}${v6Group(l('التواصل والمواعيد','COMMUNICATION & DATES'),communication,false)}${v6Group(l('حسابي','ACCOUNT'),[['profile','الملف الشخصي','My profile','user'],['sheet-roles','تغيير الحساب','Switch account','people'],['sheet-language','اللغة','Language','globe'],['theme-toggle',UI.theme==='dark'?'الوضع الفاتح':'الوضع الداكن',UI.theme==='dark'?'Light mode':'Dark mode',UI.theme==='dark'?'sun':'moon'],['sheet-platform','نمط الأيقونات','Platform appearance','smartphone'],['about','عن المدرسة','About the school','school']],false)}${v6Bottom}`;

function v6Curriculum(){const lessons=data.curriculum.filter(v6CurriculumVisible);return `${v6FormHead(l('المناهج والدروس','Curriculum'),l('خطة المناهج والدروس','Curriculum & lessons'),l('الوحدات والدروس وسجل الشرح','Teaching plan and lesson log'))}${UI.role!=='parent'?v6Button(UI.role==='admin'?l('إضافة درس','Add lesson'):l('تسجيل شرح درس','Record lesson'),UI.role==='admin'?'curriculum-form':'lessonlog-select'):''}<div class="v5-list">${lessons.map(c=>vrow(t(c.title),`${v6SubjectName(c.subjectId)} · ${className(c.cls)} · ${c.status==='draft'?l('مسودة','Draft'):l('منشور','Published')}`,'curriculum-detail',c.id,'layers')).join('')||emptyState(l('لا توجد دروس','No lessons'),'')}</div>${v6Bottom}`}
function v6CurriculumDetail(){const c=data.curriculum.find(x=>x.id===UI.v6CurriculumId);if(!c||!v6CurriculumVisible(c))return '';return `${v6FormHead(l('تفاصيل الدرس','Lesson details'),t(c.title),`${v6SubjectName(c.subjectId)} · ${className(c.cls)}`)}<div class="card-flat v5-desc-card"><h3>${l('محتوى الدرس','Lesson contents')}</h3><p>${esc(t(c.description))}</p></div><div class="card-flat v5-desc-card"><h3>${l('سجل شرح الدرس','Teaching log')}</h3><p>${esc(t(c.log)||l('لم يتم تسجيل الشرح بعد','Not recorded yet'))}</p></div>${UI.role==='teacher'?v6Button(l('تسجيل شرح الدرس','Record teaching'),'curriculum-log','edit'):''}${v6Bottom}`}
function v6CurriculumForm(logOnly=false){const entry=data.curriculum.find(x=>x.id===UI.v6CurriculumId),classes=UI.role==='admin'?data.classes:data.classes.filter(x=>myClasses().includes(x.id));if(logOnly)return `${v6FormHead(l('سجل الشرح','Teaching log'),l('تسجيل شرح الدرس','Record lesson teaching'))}<form class="form-section" id="curriculum-log-v6-form"><div class="field-group"><label class="field-label">${l('ما تم شرحه','Lesson delivered')}</label><textarea class="field textarea-field" name="log" required>${esc(t(entry?.log)||'')}</textarea></div>${submitButton(l('حفظ الشرح','Save log'))}</form>${v6Bottom}`;

function v6LessonLogSelect(){const items=data.curriculum.filter(c=>myClasses().includes(c.cls));return `${v6FormHead(l('سجل الشرح','Teaching log'),l('اختر الدرس','Choose lesson'))}<div class="v5-list">${items.map(c=>vrow(t(c.title),`${v6SubjectName(c.subjectId)} · ${className(c.cls)}`,'lessonlog-open',c.id,'book')).join('')||emptyState(l('لا توجد دروس','No lessons'),'')}</div>${v6Bottom}`}
const v6GradingList=()=>homeworkGradeRows().filter(s=>{const h=data.homework.find(x=>x.id===s.homeworkId);return !!h&&teacherCanClass(h.cls)});
function v6Grading(){if(UI.role==='parent')return '';const all=v6GradingList(),pending=all.filter(x=>x.score===null),graded=all.filter(x=>x.score!==null);const items=(arr)=>arr.map(s=>{const st=data.students.find(x=>x.id===s.studentId),h=data.homework.find(x=>x.id===s.homeworkId);return vrow(`${t(st?.name)} — ${t(h?.title)}`,`${className(h?.cls)} · ${fmt(s.date)}${s.score!==null?' · '+s.score+'/20':''}`,'submission-detail',s.id,s.score!==null?'checkCircle':'document')}).join('')||emptyState(l('لا توجد عناصر','Nothing here'),'');return `${v6FormHead(l('تصحيح الواجبات','Grading'),l('تصحيح الواجبات','Grading inbox'),l('كل التسليمات والدرجات في مكان واحد','Student responses and grades in one place'))}${v6Button(l('تسجيل واجب شفهي','Record oral homework'),'oral-grade','plus')}${sectionHeading(l('بانتظار التصحيح','Awaiting correction')+' · '+pending.length)}<div class="v5-list">${items(pending)}</div>${sectionHeading(l('تم التصحيح','Corrected')+' · '+graded.length)}<div class="v5-list">${items(graded)}</div>${v6Bottom}`}
function v6OralGrade(){const hws=data.homework.filter(x=>teacherCanClass(x.cls));return `${v6FormHead(l('تقييم شفهي','Oral assessment'),l('رصد درجة واجب شفهي','Record oral homework'))}<form id="oral-v6-form" class="form-section">${choose('homeworkId',l('الواجب','Homework'),hws.map(h=>[h.id,`${t(h.title)} · ${className(h.cls)}`]))}${choose('studentId',l('الطالب','Student'),allowedStudents().map(s=>[s.id,`${t(s.name)} · ${className(s.cls)}`]))}${field('score',l('الدرجة من 20','Score out of 20'),'','number','min="0" max="20" step="0.5"')}${field('feedback',l('ملاحظات المدرس','Teacher feedback'))}${submitButton(l('حفظ التقييم','Save grade'))}</form>${v6Bottom}`}
function v6Evaluations(){const rows=data.evaluations.filter(e=>v6StudentOK(e.studentId)&&(UI.role!=='parent'||e.published));return `${v6FormHead(l('تقييم الطلاب','Evaluations'),l('التقييم الدوري للطلاب','Student evaluations'),l('متابعة المشاركة والفهم والتحضير','Participation, understanding and preparation'))}${UI.role!=='parent'?v6Button(l('إضافة تقييم','Add evaluation'),'evaluation-form'):''}<div class="v5-list">${rows.map(e=>{const s=data.students.find(x=>x.id===e.studentId);return vrow(`${t(s?.name)} · ${v6SubjectName(e.subjectId)}`,`${e.period} · ${e.participation+e.understanding+e.preparation}/15 · ${t(e.strengths)}`,'evaluation-detail',e.id,'star',pill(e.published?l('منشور','Published'):l('مسودة','Draft'),e.published?'green':''))}).join('')||emptyState(l('لا توجد تقييمات','No evaluations yet'),'')}</div>${v6Bottom}`}
function v6EvaluationDetail(){const e=data.evaluations.find(x=>x.id===UI.v6EvaluationId);if(!e||!v6StudentOK(e.studentId)||UI.role==='parent'&&!e.published)return '';const s=data.students.find(x=>x.id===e.studentId);return `${v6FormHead(l('التقييم','Evaluation'),t(s.name),`${v6SubjectName(e.subjectId)} · ${e.period}`)}<div class="v6-scoreline"><span>${l('المشاركة','Participation')}</span><b>${e.participation}/5</b></div><div class="v6-scoreline"><span>${l('الفهم','Understanding')}</span><b>${e.understanding}/5</b></div><div class="v6-scoreline"><span>${l('التحضير','Preparation')}</span><b>${e.preparation}/5</b></div><div class="card-flat v5-desc-card"><h3>${l('نقاط القوة','Strengths')}</h3><p>${esc(t(e.strengths))}</p></div><div class="card-flat v5-desc-card"><h3>${l('خطة التحسين','Improvement plan')}</h3><p>${esc(t(e.improvement))}</p></div>${v6Bottom}`}

function v6ExamDetail(){const x=data.exams.find(e=>e.id===UI.v6ExamId);if(!x||!v6ExamVisible(x))return '';const scores=data.examScores.filter(s=>s.examId===x.id&&(UI.role!=='parent'||belongsToParent(s.studentId)));return `${v6FormHead(l('تفاصيل الاختبار','Exam details'),t(x.title),`${v6SubjectName(x.subjectId)} · ${className(x.cls)} · ${fmt(x.date)}`)}<div class="v6-scoreline"><span>${l('نوع الاختبار','Exam type')}</span><b>${x.type==='oral'?l('شفهي','Oral'):l('تحريري','Written')}</b></div><div class="v6-scoreline"><span>${l('الدرجة النهائية','Maximum score')}</span><b>${x.max}</b></div>${UI.role!=='parent'?v6Button(l('رصد درجة اختبار','Record an exam grade'),'exam-score-form'):''}${sectionHeading(l('النتائج','Results'))}<div class="v5-list">${scores.map(s=>vrow(t(data.students.find(k=>k.id===s.studentId)?.name),`${s.score}/${x.max} · ${t(s.feedback)}`,'none','','award')).join('')||emptyState(l('لم تُرصد نتائج','No scores yet'),'')}</div>${v6Bottom}`}
function v6ExamForm(){const classes=UI.role==='admin'?data.classes:data.classes.filter(c=>myClasses().includes(c.id));return `${v6FormHead(l('اختبار جديد','New exam'),l('إعداد اختبار','Create exam'))}<form id="exam-v6-form" class="form-section">${field('title',l('عنوان الاختبار','Exam title'))}${choose('subjectId',l('المادة','Subject'),data.subjects.map(x=>[x.id,t(x.name)]))}${choose('cls',l('الفصل','Class'),classes.map(x=>[x.id,t(x.name)]))}${field('date',l('تاريخ الاختبار','Exam date'),yearDay(),'date')}${field('max',l('الدرجة النهائية','Maximum score'),'20','number','min="1" max="100"')}${choose('type',l('نوع الاختبار','Type'),[['oral',l('شفهي','Oral')],['written',l('تحريري','Written')]],'oral')}${choose('status',l('حالة النتائج','Visibility'),[['draft',l('مسودة','Draft')],['published',l('منشور','Published')]],'draft')}${submitButton(l('حفظ الاختبار','Save exam'))}</form>${v6Bottom}`}
function v6ExamScoreForm(){const x=data.exams.find(e=>e.id===UI.v6ExamId);if(!x||!teacherCanClass(x.cls))return '';return `${v6FormHead(l('رصد نتيجة','Record score'),t(x.title))}<form id="exam-score-v6-form" class="form-section">${choose('studentId',l('الطالب','Student'),data.students.filter(s=>s.cls===x.cls).map(s=>[s.id,t(s.name)]))}${field('score',l('الدرجة','Score'),'','number',`min="0" max="${x.max}" step="0.5"`)}${field('feedback',l('ملاحظات','Feedback'),'')}${submitButton(l('حفظ الدرجة','Save score'))}</form>${v6Bottom}`}
function v6AcademicReports(){const students=allowedStudents();const body=students.map(s=>{const g=data.grades.filter(x=>x.studentId===s.id).map(x=>Math.round(100*x.score/x.outOf));const submissions=data.submissions.filter(x=>x.studentId===s.id&&x.score!==null).map(x=>Math.round(100*x.score/20));const exams=data.examScores.filter(x=>x.studentId===s.id&&data.exams.some(ex=>ex.id===x.examId&&ex.status==='published')).map(x=>Math.round(100*x.score/(data.exams.find(ex=>ex.id===x.examId)?.max||20)));const vals=[...g,...submissions,...exams],avg=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null;const evaluations=data.evaluations.filter(x=>x.studentId===s.id&&x.published).length;return `<div class="v6-report-row"><div class="v6-report-title"><span>${esc(t(s.name))}</span><small>${className(s.cls)}</small></div><div class="v6-report-metrics"><span>${l('متوسط النتائج','Average')}</span><strong>${avg===null?'—':avg+'%'}</strong><span>${l('تقييمات منشورة','Evaluations')} ${evaluations}</span></div><div class="v6-progress"><i style="width:${avg||0}%"></i></div></div>`}).join('');return `${v6FormHead(l('التقارير الأكاديمية','Academic reports'),l('مستوى الطلاب','Student progress'),l('الواجبات والاختبارات والتقييمات','Homework, exams and evaluations'))}<div class="v5-list">${body||emptyState(l('لا توجد بيانات','No data'),'')}</div>${v6Bottom}`}

const v6PrevAct=act;

 if(id==='evaluation-v6-form'&&UI.role!=='parent'&&v6StudentOK(val.studentId)){
  if(![val.participation,val.understanding,val.preparation].every(x=>n(x)>=1&&n(x)<=5))return;

 if(id==='exam-score-v6-form'&&UI.role!=='parent'){const x=data.exams.find(x=>x.id===UI.v6ExamId),s=data.students.find(s=>s.id===val.studentId);if(!x||!teacherCanClass(x.cls)||s?.cls!==x.cls||!Number.isFinite(n(val.score))||n(val.score)<0||n(val.score)>x.max)return;let score=data.examScores.find(r=>r.examId===x.id&&r.studentId===s.id);if(!score){score={id:v6Id('XS'),examId:x.id,studentId:s.id};data.examScores.push(score)}score.score=n(val.score);score.feedback=txt(val.feedback);v6Audit('رصد درجة اختبار '+t(x.title));ok();UI.screen='exam-detail';return}
 if(id==='news-v6-form'&&UI.role==='admin'){data.news.unshift({id:v6Id('NW'),title:txt(val.title),body:txt(val.body),audience:val.audience,cls:null,status:val.status,date:yearDay()});v6Audit('نشر خبر '+val.title);ok();UI.screen='news';return}
 if(id==='school-settings-v6-form'&&UI.role==='admin'){data.settings={name:val.name,academicYear:val.academicYear,timezone:val.timezone,currency:val.currency,dueDay:val.dueDay};v6Audit('تحديث إعدادات المدرسة');ok();UI.screen='school-settings';return}
 if(id==='oral-v6-form'&&UI.role!=='parent'&&v6TeacherAllowed('homework.grade')){const h=data.homework.find(x=>x.id===val.homeworkId),s=data.students.find(x=>x.id===val.studentId);if(!h||!s||s.cls!==h.cls||!teacherCanClass(h.cls)||n(val.score)<0||n(val.score)>20)return;let submission=data.submissions.find(x=>x.homeworkId===h.id&&x.studentId===s.id);if(!submission){submission={id:v6Id('SUB'),homeworkId:h.id,studentId:s.id,text:l('تقييم شفهي داخل الفصل','Oral in-class evaluation'),fileName:null,fileData:null,date:yearDay()};data.submissions.push(submission)}submission.score=n(val.score);submission.feedback=val.feedback;v6Audit('تصحيح واجب شفهي '+t(s.name));ok();UI.screen='grading-center';return}

/* Classroom homework grading: one grade record per enrolled student, not an upload inbox. */
function ensureHomeworkGradeRoster(){
  let changed=false;
  if(!data.homeworkRosterMigrated){
    // Preserve historic preview submissions without showing them or requiring uploads.
    const historical=Array.isArray(data.submissions)?data.submissions:[];
    if(historical.length&&!data.legacyHomeworkSubmissions)data.legacyHomeworkSubmissions=structuredClone(historical);
    const byPair=new Map();
    historical.forEach(item=>{
      const key=item.homeworkId+'|'+item.studentId;
      const existing=byPair.get(key);
      if(!existing || (existing.score==null && item.score!=null))byPair.set(key,item);
    });
    data.submissions=Array.from(byPair.values()).map(item=>({
      id:'HG-'+item.homeworkId+'-'+item.studentId,
      homeworkId:item.homeworkId,studentId:item.studentId,
      date:item.date||yearDay(),score:Number.isFinite(item.score)?item.score:null,
      feedback:item.feedback||''
    }));
    data.homeworkRosterMigrated=true;
    changed=true;
  }
  const keys=new Set(data.submissions.map(item=>item.homeworkId+'|'+item.studentId));
  for(const hw of data.homework){
    for(const student of data.students){
      if(student.cls!==hw.cls)continue;
      const key=hw.id+'|'+student.id;
      if(keys.has(key))continue;
      data.submissions.push({id:'HG-'+hw.id+'-'+student.id,
        homeworkId:hw.id,studentId:student.id, date:yearDay(),score:null,feedback:''});
      keys.add(key);changed=true;
    }
  }
  if(changed)persist();
}
function homeworkGradeRows(){
  ensureHomeworkGradeRoster();
  return data.submissions.filter(item=>{
    const hw=data.homework.find(x=>x.id===item.homeworkId);
    const s=data.students.find(x=>x.id===item.studentId);
    return !!hw && !!s && s.cls===hw.cls;
  });
}
function hwGrades(hw){return homeworkGradeRows().filter(entry=>entry.homeworkId===hw.id)}

document.addEventListener('submit',e=>{
  if(e.target?.id!=='homework-bulk-grade-form')return;
  e.preventDefault();e.stopImmediatePropagation();
  const hw=data.homework.find(x=>x.id===e.target.dataset.homeworkId);
  if(!hw||!teacherCanClass(hw.cls)||!v6TeacherAllowed('homework.grade'))return;
  const edits=Array.from(document.querySelectorAll('.hw-bulk-grade-input')).map(input=>{
    const value=input.value.trim();
    return {studentId:input.name.replace(/^score_/,''),
            score:value===''?null:Number(value)};
  });
  if(edits.some(x=>x.score!==null&&(!Number.isFinite(x.score)||x.score<0||x.score>20)))return;
  for(const edit of edits){
    if(!data.students.some(s=>s.id===edit.studentId&&s.cls===hw.cls))return;
    const grade=data.submissions.find(x=>x.homeworkId===hw.id&&x.studentId===edit.studentId);
    if(!grade)return;
  }
  for(const edit of edits){
    const grade=data.submissions.find(x=>x.homeworkId===hw.id&&x.studentId===edit.studentId);
    grade.score=edit.score;
    grade.date=yearDay();
  }
  persist();toast(l('تم حفظ درجات الطلاب','Class grades saved'));
},true);

function directoryChatSubtitle(c){if(c.type==='staff-peer')return t(data.staffDirectory.find(x=>x.id===c.staffId)?.title||E('الإدارة','Verwaltung'));if(c.type==='parent-admin'&&UI.role==='admin')return t(data.staffDirectory.find(x=>x.id===c.staffId)?.title||E('إدارة المدرسة','Schulverwaltung'));if(c.type==='staff-direct'&&UI.role==='admin')return t(data.staffDirectory.find(x=>x.id===c.staffId)?.name||E('إدارة المدرسة','Schulverwaltung'));if(c.type==='parent-admin'&&UI.role==='parent')return t(data.staffDirectory.find(x=>x.id===c.staffId)?.title||'');return c.type==='parent'?l('محادثة مدرسية','Schulgespräch'):l('محادثة داخل المدرسة','Schulinterne Nachricht')}
function directoryMessagesPage(){const groups=directoryPeople();const messages=data.conversations.filter(directoryChatAllowed);const directory=UI.directoryTab==='directory';const count=groups.admin.length+groups.teachers.length+groups.parents.length;const q=(UI.directoryQuery||'').trim().toLocaleLowerCase();const matches=[...groups.admin,...groups.teachers,...groups.parents].filter(x=>!q||[t(x.name),x.subtitle,x.email,x.phone].join(' ').toLocaleLowerCase().includes(q)).length;
 const tabs=`<div class="directory-tabs" role="tablist" aria-label="${l('عرض الرسائل','Nachrichtenansicht')}"><button type="button" role="tab" aria-selected="${!directory}" class="${!directory?'active':''}" data-testid="conversations-tab" data-action="directory-mode" data-val="threads">${l('المحادثات','Chats')}</button><button type="button" role="tab" aria-selected="${directory}" class="${directory?'active':''}" data-testid="directory-tab" data-action="directory-mode" data-val="directory">${l('دليل التواصل','Kontakte')}</button></div>`;
 return `<div class="screen">${mainHeader(l('الرسائل','Nachrichten'))}<div class="page-intro"><h1 class="page-title">${directory?l('دليل التواصل','Schulkontakte'):l('رسائلك','Nachrichten')}</h1><p class="page-sub">${directory?l('ابحث عن الشخص المناسب وتواصل معه مباشرة.','Die richtigen Ansprechpersonen direkt erreichen.'):l('محادثاتك مع المدرسة في مكان واحد.','Alle Gespräche mit der Schule an einem Ort.')}</p></div>${tabs}
 ${directory?`<label class="directory-search">${I('search')}<input type="search" data-directory-search aria-label="${l('البحث في الدليل','Kontakte durchsuchen')}" placeholder="${l('بحث بالاسم أو الوظيفة أو المادة','Name, Funktion oder Fach suchen')}" value="${esc(UI.directoryQuery)}"></label>
 ${directoryList(groups.admin,l('إدارة المدرسة','Schulverwaltung'))}${directoryList(groups.teachers,UI.role==='parent'?l('مدرسو أبنائك','Lehrkräfte Ihrer Kinder'):l('المعلمون','Lehrkräfte'))}${directoryList(groups.parents,l('أولياء الأمور','Eltern'))}${matches===0?`<div class="directory-empty">${l('لا توجد جهات اتصال مطابقة','Keine passenden Kontakte')}</div>`:''}
 ${UI.role==='admin'?`<div class="v5-toolbar"><button class="v5-top-button" data-action="directory-add-staff">${I('plus')} ${l('إضافة موظف إدارة','Mitarbeiter hinzufügen')}</button></div>`:''}`:
 `<div class="directory-section"><div class="directory-list">${messages.map(c=>{const title=directoryChatTitle(c),last=c.msgs[c.msgs.length-1];return `<button type="button" class="directory-message-row" data-action="open-chat" data-id="${esc(c.id)}" data-testid="conversation-row">${avatar(title,c.type==='staff'||c.type==='staff-direct'?'staff':'')}<span class="directory-message-main"><strong>${esc(title)}</strong><small>${esc(UI.role==='admin'&&['parent-admin','staff-direct'].includes(c.type)?directoryChatSubtitle(c)+' · ':'')}${esc(t(last?.text||E('ابدأ المحادثة','Nachricht schreiben')))}</small></span><span class="directory-message-time">${esc(last?.time||'')}</span></button>`}).join('')||`<div class="directory-empty">${l('لا توجد محادثات بعد، افتح دليل التواصل لبدء محادثة.','Noch keine Chats. Wählen Sie einen Kontakt.')}</div>`}</div></div>${UI.role!=='parent'?`<div class="v5-toolbar"><button class="v5-top-button" data-action="broadcast-compose">${I('megaphone')} ${l('إرسال إشعار','Mitteilung senden')}</button></div>`:''}`}
 </div>`;
}
function directoryContactProfile(){const x=directoryPerson(UI.contactId);if(!x)return `${mainHeader(l('جهة الاتصال','Kontakt'))}<div class="directory-empty">${l('جهة الاتصال غير متاحة','Kontakt nicht verfügbar')}</div>`;
 const info=(ico,label,value,href='',testid='')=>`<${href?'a':'div'} ${href?`href="${esc(href)}"`:''} class="directory-info-row" ${testid?`data-testid="${testid}"`:''}>${I(ico)}<span class="directory-info-copy"><small>${label}</small><strong>${esc(value)}</strong></span></${href?'a':'div'}>`;
 let subjectBlock='';if(x.kind==='teacher')subjectBlock=info('book',l('المواد والفصول','Fächer und Klassen'),x.subtitle);
 if(x.kind==='parent')subjectBlock=info('people',l('الأبناء','Kinder'),x.subtitle||l('ولي أمر','Elternteil'));
 return `<div class="screen">${mainHeader(l('الملف الشخصي','Kontaktprofil'))}<div class="directory-profile"><div class="directory-identity">${directoryAvatar(x)}<h1>${esc(t(x.name))}</h1><p data-testid="contact-role">${esc(x.kind==='admin'?t(x.title):x.kind==='teacher'?l('هيئة التدريس','Lehrkraft'):l('ولي الأمر','Elternteil'))}</p></div>
 <div class="directory-contact-action">${UI.role==='admin'&&x.kind==='admin'&&x.id==='D01'?'':`<button type="button" data-action="contact-message">${I('messages')}${l('إرسال رسالة','Nachricht senden')}</button>`}${UI.role==='admin'?`<button class="secondary" type="button" data-action="directory-edit-contact">${I('edit')}${l('تعديل البيانات','Bearbeiten')}</button>`:''}</div>
 <div class="directory-detail-card">${info('user',l('الوظيفة','Funktion'),x.kind==='admin'?t(x.title):x.kind==='teacher'?l('معلم','Lehrkraft'):l('ولي أمر','Elternteil'))}${subjectBlock}${x.email?info('mail',l('البريد الإلكتروني المهني','Kontakt-E-Mail'),x.email,'mailto:'+x.email,'contact-email'):''}${x.phone?info('smartphone',l('رقم الهاتف','Telefonnummer'),x.phone,'tel:'+x.phone.replace(/[^+0-9]/g,''),'contact-phone'):''}</div></div></div>`;
}
function directoryEditor(){if(UI.role!=='admin')return '';const x=UI.contactId?directoryPerson(UI.contactId):null;if(UI.contactId&&!x)return '';
 return `<div class="screen">${mainHeader(x?l('تعديل بيانات التواصل','Kontaktdaten bearbeiten'):l('إضافة موظف','Mitarbeiter hinzufügen'))}<div class="page-intro"><h1 class="page-title">${esc(x?t(x.name):l('موظف جديد','Neuer Kontakt'))}</h1></div><form id="directory-contact-form" class="form-section">
 ${field('name',l('الاسم الكامل','Vollständiger Name'),x?t(x.name):'')}
 ${!x||x.kind==='admin'?field('title',l('المسمى الوظيفي','Funktion'),x?t(x.title):''):''}
 ${field('email',l('البريد المهني','Dienstliche E-Mail'),x?.email||'','email')}
 ${field('phone',l('رقم الهاتف (اختياري)','Telefon (optional)'),x?.phone||'','tel').replace(' required>','>')}
 ${submitButton(l('حفظ بيانات التواصل','Kontaktdaten speichern'))}</form></div>`;
}
function directoryStartConversation(x){if(!x)return null;const p=UI.role;
 let c=null;if(p==='parent'&&x.kind==='admin')c=data.conversations.find(z=>z.type==='parent-admin'&&z.parentId===V.parentId&&z.staffId===x.id);
 if(p==='parent'&&x.kind==='teacher')c=data.conversations.find(z=>z.type==='parent'&&z.parentId===V.parentId&&z.teacherId===x.id);
 if(p==='teacher'&&x.kind==='admin')c=data.conversations.find(z=>z.type==='staff-direct'&&z.teacherId===V.teacherId&&z.staffId===x.id);
 if(p==='teacher'&&x.kind==='parent')c=data.conversations.find(z=>z.type==='parent'&&z.teacherId===V.teacherId&&z.parentId===x.id);
 if(p==='admin'&&x.kind==='admin'&&x.id!=='D01')c=data.conversations.find(z=>z.type==='staff-peer'&&z.staffId===x.id&&z.adminSenderId==='D01');
 if(p==='admin'&&x.kind==='teacher')c=data.conversations.find(z=>z.type==='staff-direct'&&z.teacherId===x.id&&z.staffId==='D01');
 if(p==='admin'&&x.kind==='parent')c=data.conversations.find(z=>z.type==='parent-admin'&&z.parentId===x.id&&z.staffId==='D01');
 if(c)return c;
 let detail=null;if(p==='admin'&&x.kind==='admin'&&x.id!=='D01')detail={type:'staff-peer',staffId:x.id,adminSenderId:'D01',roles:['admin']};
 else if(p==='parent'&&x.kind==='admin'||p==='admin'&&x.kind==='parent')detail={type:'parent-admin',parentId:p==='parent'?V.parentId:x.id,staffId:p==='parent'?x.id:'D01',roles:['admin','parent']};
 else if(p==='parent'&&x.kind==='teacher'||p==='teacher'&&x.kind==='parent')detail={type:'parent',parentId:p==='parent'?V.parentId:x.id,teacherId:p==='parent'?x.id:V.teacherId,roles:['parent','teacher']};
 else if(p==='teacher'&&x.kind==='admin'||p==='admin'&&x.kind==='teacher')detail={type:'staff-direct',staffId:p==='teacher'?x.id:'D01',teacherId:p==='teacher'?V.teacherId:x.id,roles:['admin','teacher']};
 else return null;
 c={id:'C'+Date.now()+'-'+Math.floor(Math.random()*10000),...detail,label:E(t(x.name),t(x.name)),msgs:[]};data.conversations.unshift(c);persist();return c;
}
function directoryChatPage(){const c=data.conversations.find(x=>x.id===UI.chatId);if(!directoryChatAllowed(c))return `<div class="screen">${mainHeader(l('الرسائل','Nachrichten'))}<div class="directory-empty">${l('هذه المحادثة غير متاحة','Chat nicht verfügbar')}</div></div>`;
 const title=directoryChatTitle(c);return `<div class="screen"><div class="chat-header"><button class="header-icon-btn clear" data-action="back" aria-label="${l('رجوع','Zurück')}">${I('arrow')}</button>${avatar(title,c.type.includes('staff')||c.type==='parent-admin'?'staff':'')}<div class="who"><div class="name">${esc(title)}</div><div class="subtitle">${esc(directoryChatSubtitle(c))}</div></div></div><div class="chat-messages"><div class="chat-date">${l('المحادثة','Unterhaltung')}</div>${c.msgs.map(m=>{const sent=m.sender?m.sender=== (UI.role==='admin'&&c.type==='parent-admin'?c.staffId:me()):(UI.role==='parent'?!m.mine:UI.role==='admin'?!m.mine:!!m.mine);return `<div class="bubble ${sent?'mine':''}">${esc(t(m.text))}<div class="bubble-meta">${esc(m.time)}</div></div>`}).join('')}</div></div>`;
}
const directoryOldRender=renderContent;
renderContent=function(){switch(UI.screen||UI.tab){case 'messages':return directoryMessagesPage();case 'contact-profile':return directoryContactProfile();case 'directory-contact-form':return directoryEditor();case 'chat':return directoryChatPage();default:return directoryOldRender();}};
const directoryOldAct=act;
act=function(action,el){const id=el?.dataset?.id;
 if(action==='directory-mode'){UI.directoryTab=el?.dataset?.val==='directory'?'directory':'threads';UI.directoryQuery='';render();return}
 if(action==='contact-profile'){if(!directoryPerson(id))return;UI.contactId=id;navigate('contact-profile');return}
 if(action==='contact-message'){const c=directoryStartConversation(directoryPerson(UI.contactId));if(!c)return;UI.chatId=c.id;navigate('chat');return}
 if(action==='directory-edit-contact'){if(UI.role!=='admin'||!directoryPerson(UI.contactId))return;navigate('directory-contact-form');return}
 if(action==='directory-add-staff'){if(UI.role!=='admin')return;UI.contactId=null;navigate('directory-contact-form');return}
 if(action==='open-chat'&&!directoryChatAllowed(data.conversations.find(c=>c.id===id)))return;
 if(action.startsWith('select-role-')){UI.directoryTab='threads';UI.directoryQuery='';UI.contactId=null}
 return directoryOldAct(action,el);
};
document.addEventListener('input',e=>{if(!e.target.matches('[data-directory-search]'))return;
 const pos=e.target.selectionStart;UI.directoryQuery=e.target.value;render();const input=$('[data-directory-search]');if(input){input.focus();input.setSelectionRange(pos,pos)}
});
document.addEventListener('submit',e=>{if(e.target.id!=='directory-contact-form')return;e.preventDefault();e.stopImmediatePropagation();if(UI.role!=='admin'||!e.target.reportValidity())return;
 const form=e.target,v=Object.fromEntries(new FormData(form)),name=String(v.name||'').trim(),email=String(v.email||'').trim().toLowerCase(),phone=String(v.phone||'').trim(),title=String(v.title||'').trim();
 if(!name||!email||(!UI.contactId&&!title))return;
 if(UI.contactId){const x=directoryPerson(UI.contactId);if(!x)return;const target=x.kind==='admin'?data.staffDirectory.find(p=>p.id===x.id):x.kind==='teacher'?data.teachers.find(t=>t.id===x.id):data.parents.find(p=>p.id===x.id);if(!target)return;target.name=E(name,name);target.email=email;target.phone=phone;if(x.kind==='admin')target.title=E(title,title);}
 else {const newId='D'+Date.now();data.staffDirectory.push({id:newId,name:E(name,name),title:E(title,title),email,phone});UI.contactId='admin:'+newId}
 persist();UI.screen='contact-profile';toast(l('تم حفظ بيانات التواصل','Kontakt gespeichert'));
},true);

render();
})();
</script>
</body>
</html>
