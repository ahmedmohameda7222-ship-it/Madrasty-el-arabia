name: Visual polish - isolated production identity, timetable and finance QA
on:
  push:
    branches: ["visual-polish/premium"]
    paths:
      - ".github/workflows/visual-polish-production-local.yml"
      - "qa/visual-polish-production-tls.sh"
      - "qa/visual-polish-production.config.ts"
      - "qa/web/ui-visual-polish-not-found.spec.ts"
      - "qa/web/ui-visual-polish-p10-bank.spec.ts"
      - "qa/web/ui-visual-polish-p09-timetable.spec.ts"
      - "qa/web/ui-visual-polish-p09-calendar.spec.ts"
      - "qa/web/ui-visual-polish-p11-headings.spec.ts"
      - "qa/web/ui-visual-polish-p08-mic.spec.ts"
      - "qa/web/ui-visual-polish-p08-chat.spec.ts"
      - "qa/web/ui-visual-polish-p07-editors.spec.ts"
      - "qa/web/ui-visual-polish-p05-child-actions.spec.ts"
      - "apps/web/src/app/[locale]/not-found.tsx"
      - "qa/support/visual-production-proxy.mjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-p03:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        slice: [core, compact-layout, chat]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.121.0"
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y libnss3-tools
      - name: Start disposable fixture and enable verified transport
        shell: bash
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP"
          echo "LOCALAPPDATA=$RUNNER_TEMP" >> "$GITHUB_ENV"
          pwsh -NoProfile -File qa/start-stack.ps1
          bash -n qa/visual-polish-production-tls.sh
          node --check qa/support/visual-production-proxy.mjs
          bash qa/visual-polish-production-tls.sh
      - name: Build and verify isolated scene journeys against real HTTPS
        env:
          AUDIT_SLICE: ${{ matrix.slice }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:web
          pwsh -NoProfile -File qa/local.ps1 -Serve -Production -ProductionFixtureTls > "$RUNNER_TEMP/madrasty-production-fixture.log" 2>&1 &
          web_pid=$!
          node qa/support/visual-production-proxy.mjs > "$RUNNER_TEMP/madrasty-production-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$web_pid" "$proxy_pid" 2>/dev/null || true' EXIT
          curl --cacert "$NODE_EXTRA_CA_CERTS" -fsS --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 --max-time 10 https://127.0.0.1:4443/api/v1/health
          # Separate fresh fixture stacks preserve the original login-rate limits.
          case "$AUDIT_SLICE" in
            core)
              pnpm exec playwright test --config qa/visual-polish-production.config.ts --browser ${{ matrix.browser }} ui-visual-polish-entry.spec.ts ui-visual-polish-identity.spec.ts ui-visual-polish-not-found.spec.ts ui-visual-polish-p10-bank.spec.ts ui-visual-polish-p09-timetable.spec.ts ui-visual-polish-p11-headings.spec.ts ui-visual-polish-p08-mic.spec.ts ui-visual-polish-p07-editors.spec.ts
              ;;
            compact-layout)
              pnpm exec playwright test --config qa/visual-polish-production.config.ts --browser ${{ matrix.browser }} ui-visual-polish-p09-calendar.spec.ts ui-visual-polish-p05-child-actions.spec.ts
              ;;
            chat)
              pnpm exec playwright test --config qa/visual-polish-production.config.ts --browser ${{ matrix.browser }} ui-visual-polish-p08-chat.spec.ts
              ;;
            *) exit 2 ;;
          esac
      - name: Retain selected synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-production-${{ matrix.slice }}-${{ matrix.browser }}-${{ github.sha }}
          path: |
            qa-artifacts/visual-polish/P03/**/*.png
            qa-artifacts/visual-polish/P10/bank-*/**/bank-*.png
            qa-artifacts/visual-polish/P09/timetable-*/**/timetable-*.png
            qa-artifacts/visual-polish/P09/**/calendar*.png
            qa-artifacts/visual-polish/P11/headings-*/**/*-200.png
            qa-artifacts/visual-polish/P08/microphone-*/**/*.png
            qa-artifacts/visual-polish/P08/chat-*/**/*.png
            qa-artifacts/visual-polish/P08/chat-*/**/geometry.json
            qa-artifacts/visual-polish/P07/editors-*/**/*.png
            qa-artifacts/visual-polish/P07/editors-*/**/geometry.json
            qa-artifacts/visual-polish/P05/child-actions-*/**/*.png
            qa-artifacts/visual-polish/P05/child-actions-*/**/geometry.json
          retention-days: 7
          if-no-files-found: warn

