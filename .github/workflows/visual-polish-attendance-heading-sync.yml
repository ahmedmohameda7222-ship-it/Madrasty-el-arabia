name: P06 attendance heading typography and source registry synchronization
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-attendance-heading-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply exact heading presentation and synchronize coverage registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for name, sha, content in json.loads(r'''[["apps/web/src/app/[locale]/school/[tab]/page.tsx","ecf9888c6da6c95ea4f26d2b80486694fdfc1788","import { presentationParams } from \"@/server/identity/ui-locale\";\nimport { SchoolLink as Link } from \"@/ui/SchoolLink\";\nimport { notFound, redirect } from \"next/navigation\";\nimport { schoolDateSchema, type Locale } from \"@madrasty/contracts\";\nimport { z } from \"zod\";\nimport { SchoolHome } from \"@/features/school/SchoolHome\";\nimport { schoolProfile } from \"@/server/identity/profile\";\nimport { webSchoolSession } from \"@/server/identity/web-session\";\nimport { schoolMenuAccess } from \"@/server/access/capabilities\";\nimport { DailyAttendance } from \"@/features/attendance/DailySheet\";\nimport { Children, Families } from \"@/features/school/Families\";\nimport { InviteWorkspace } from \"@/features/identity/Invitations\";\nimport { dictionary } from \"@/i18n\";\nimport { CommunicationHub } from \"@/features/comms/CommunicationHub\";\nimport { SchoolPublishing } from \"@/features/comms/SchoolPublishing\";\nimport { SessionControls } from \"@/features/identity/SessionControls\";\nimport { MoreGroup } from \"@/ui/MoreGroup\";\n\nconst tabs = [\"home\", \"students\", \"attendance\", \"children\", \"messages\", \"calendar\", \"more\"] as const;\ntype Tab = typeof tabs[number];\n\nexport default async function SchoolPage({ params, searchParams }: {\n  params: Promise<{ locale: Locale; tab: string }>;\n  searchParams: Promise<{ asOf?: string; guardian?: string; student?:string; link?: string; child?: string; class?:string; date?:string; thread?:string; section?:string; month?:string; day?:string; classId?:string; view?:string; item?:string; add?:string; batchId?:string; invite?:string }>;\n}) {\n  const [{ locale, tab }, search, session] = await Promise.all([presentationParams(params), searchParams, webSchoolSession()]);\n  if (!(tabs as readonly string[]).includes(tab)) notFound();\n  if (!session) redirect(`/${locale}/account/sign-in?next=${encodeURIComponent(`/${locale}/school/${tab}`)}`);\n\n  const specific = { admin: \"students\", teacher: \"attendance\", guardian: \"children\" } as const;\n  if (![\"home\", \"messages\", \"calendar\", \"more\", specific[session.activePersona]].includes(tab)) notFound();\n  if (tab===\"messages\" && search.section===\"calendar\" && !search.thread) {\n    const query=new URLSearchParams();\n    for (const key of [\"month\",\"day\",\"classId\",\"view\",\"item\",\"add\"] as const) { const value=search[key]; if(typeof value===\"string\"&&value)query.set(key,value); }\n    redirect(`/${locale}/school/calendar${query.size?\"?\"+query:\"\"}`);\n  }\n  const text = dictionary(locale);\n  const menuKeys = [\"access.manage\",\"school.manage\",\"students.manage\",\"staff.invite\",\"academics.supervise\",\"attendance.supervise\",\"bank.configure\",\"finance.issue\",\"finance.read\",\"finance.post\"] as const;\n  const { capabilities, moderation, stopManager } = tab === \"more\" || tab === \"students\"\n    ? await schoolMenuAccess(session, menuKeys)\n    : { capabilities: [], moderation: false, stopManager: false };\n  const [access, calendar, placement, teacherInvites, academic, attendance, bank, billing, finance, posting] = menuKeys.map(key => capabilities.includes(key));\n  const invites = teacherInvites || placement;\n  const families = tab === \"students\" && placement;\n  if (tab === \"students\" && !families) notFound();\n  const familyAccess = families ? [billing, finance, posting, attendance, academic, stopManager] : [false,false,false,false,false,false];\n  const welcome=tab===\"home\"?await schoolProfile(session).catch(()=>null):null;\n  return (\n    <>\n      {tab!==\"messages\"&&tab!==\"students\"&&<h1 aria-label={tab===\"attendance\"&&locale===\"de\"?text.attendance:undefined}>{tab===\"home\" ? <>{locale===\"ar\"?\"مرحبًا\":\"Hallo\"}{welcome?.displayName&&<>{locale===\"ar\"?\"، \":\", \"}<bdi>{welcome.displayName}</bdi></>}</> : tab===\"calendar\" ? (locale===\"ar\"?\"التقويم\":\"Kalender\") : tab===\"attendance\"&&locale===\"de\"?text.attendance.replace(\"Anwesenheit\",\"An\\u00adwe\\u00adsen\\u00adheit\"):text[tab as Exclude<Tab,\"calendar\">]}</h1>}\n      {tab===\"messages\"&&<CommunicationHub locale={locale} thread={z.uuid().safeParse(search.thread).data} section={search.section}/>}\n      {tab===\"calendar\"&&<SchoolPublishing locale={locale} kind=\"event\" embedded selected={z.uuid().safeParse(search.item).data} create={search.add===\"1\"}/>}\n      {tab === \"home\" && <SchoolHome locale={locale} asOf={schoolDateSchema.safeParse(search.asOf).data} />}\n      {families && <><Families locale={locale} access={{financeIssue:familyAccess[0],financeRead:familyAccess[0]||familyAccess[1]||familyAccess[2],oversight:familyAccess[3]&&familyAccess[4],stops:familyAccess[5]}}/>\n        {(search.batchId || search.invite) && <InviteWorkspace locale={locale} guardians={true}\n          batchId={z.uuid().safeParse(search.batchId).data} invitationId={z.uuid().safeParse(search.invite).data}/>}\n      </>}\n      {tab === \"children\" && <Children locale={locale} initialChild={z.uuid().safeParse(search.child).data} />}\n      {tab === \"attendance\" && session.activePersona === \"teacher\" && <DailyAttendance locale={locale} initialClass={z.uuid().safeParse(search.class).data} initialDate={schoolDateSchema.safeParse(search.date).data} />}\n      {tab === \"more\" && <div className=\"more-index\">\n        {(session.activePersona !== \"admin\" || calendar || academic || attendance) && <MoreGroup group=\"learning\">\n          <summary>{locale === \"ar\" ? \"التعليم والحضور\" : \"Unterricht und Anwesenheit\"}</summary>\n          <div className=\"more-rows\">\n            {session.activePersona===\"admin\" && (academic || attendance) &&\n              <Link className=\"more-row\" href={`/${locale}/school/more/oversight`}>\n                {locale===\"ar\"?\"متابعة الفصول\":\"Klassen im Blick\"}\n              </Link>}\n            {session.activePersona===\"teacher\"&&<Link className=\"more-row\" href={`/${locale}/school/more/grading`}>{locale===\"ar\"?\"تصحيح الواجبات\":\"Hausaufgaben korrigieren\"}</Link>}\n            {session.activePersona===\"teacher\"&&<Link className=\"more-row\" href={`/${locale}/school/more/reports`}>{locale===\"ar\"?\"التقرير الأكاديمي\":\"Lernbericht\"}</Link>}\n            {session.activePersona===\"teacher\"&&<Link className=\"more-row\" href={`/${locale}/school/more/exams`}>{locale===\"ar\"?\"الامتحانات\":\"Prüfungen\"}</Link>}\n            {session.activePersona===\"teacher\"&&<Link className=\"more-row\" href={`/${locale}/school/more/evaluations`}>{locale===\"ar\"?\"التقييمات الدورية\":\"Regelmäßige Beurteilungen\"}</Link>}\n            {session.activePersona===\"teacher\"&&<Link className=\"more-row\" href={`/${locale}/school/more/homework`}>{locale===\"ar\"?\"الواجبات\":\"Hausaufgaben\"}</Link>}\n            {session.activePersona===\"teacher\"&&<Link className=\"more-row\" href={`/${locale}/school/more/academics`}>{locale===\"ar\"?\"الشرح والأنشطة\":\"Unterricht und Aktivitäten\"}</Link>}\n            {session.activePersona===\"teacher\"&&<Link className=\"more-row\" href={`/${locale}/school/more/curriculum`}>{locale===\"ar\"?\"المواد والدروس\":\"Fächer und Unterricht\"}</Link>}\n            {(calendar || academic || teacherInvites) && <Link className=\"more-row\" href={`/${locale}/school/more/assignments`}>{locale === \"ar\" ? \"المدرسون والإدارة\" : \"Lehrkräfte und Verwaltung\"}</Link>}\n            {(session.activePersona !== \"admin\" || calendar || academic) && <Link className=\"more-row\"\n              href={`/${locale}/school/more/timetable`}>{locale === \"ar\" ? \"الجدول الأسبوعي\" : \"Wochenplan\"}</Link>}\n            {session.activePersona===\"teacher\" && <Link className=\"more-row\" href={`/${locale}/school/more/attendance`}>{locale === \"ar\" ? \"مراجعة الحضور\" : \"Anwesenheit prüfen\"}</Link>}\n          </div></MoreGroup>}\n        {(placement || calendar || academic || stopManager || session.activePersona===\"guardian\") && <MoreGroup group=\"admissions\"><summary>{locale===\"ar\"?\"القيد وشؤون الطلبة\":\"Aufnahme und Schulverwaltung\"}</summary><div className=\"more-rows\">\n            {(calendar || placement || academic) && <Link className=\"more-row\" href={`/${locale}/school/more/classes`}>{locale === \"ar\" ? \"الفصول وقيد الطلبة\" : \"Klassen und Einschreibungen\"}</Link>}\n            {calendar && <Link className=\"more-row\" href={`/${locale}/school/more/calendar`}>{locale === \"ar\" ? \"السنة الدراسية والتقويم\" : \"Schuljahr und Kalender\"}</Link>}\n            {(stopManager||session.activePersona===\"guardian\")&&<Link className=\"more-row\" href={`/${locale}/school/more/enrollment-stops`}>{locale===\"ar\"?\"التوقف المؤقت\":\"Teilnahmepausen\"}</Link>}\n          </div>\n        </MoreGroup>}\n        {(finance||billing||posting||bank||session.activePersona===\"guardian\")&&<MoreGroup group=\"finance\">\n          <summary>{locale===\"ar\"?\"الحسابات\":\"Buchhaltung\"}</summary>\n          <div className=\"more-rows\">\n            {(finance||posting||session.activePersona===\"guardian\")&&<Link className=\"more-row\" href={`/${locale}/school/more/finance-reports`}>{session.activePersona===\"guardian\"?(locale===\"ar\"?\"مدفوعاتي\":\"Meine Zahlungen\"):(locale===\"ar\"?\"ملخص الحسابات\":\"Finanzübersicht\")}</Link>}\n            {(finance||billing||posting||session.activePersona===\"guardian\")&&<Link className=\"more-row\" href={`/${locale}/school/more/invoices`}>{locale===\"ar\"?\"الفواتير\":\"Rechnungen\"}</Link>}\n            {(finance||posting)&&<Link className=\"more-row\" href={`/${locale}/school/more/receipts?view=cashbook`}>{locale===\"ar\"?\"الخزنة والبنك\":\"Kasse & Bank\"}</Link>}\n            {(billing||bank)&&<Link className=\"more-row\" href={`/${locale}/school/more/fee-settings`}>{locale===\"ar\"?\"إعدادات الحسابات\":\"Einstellungen\"}</Link>}\n          </div>\n        </MoreGroup>}\n        {(access || moderation) && <MoreGroup group=\"permissions\">\n          <summary>{locale === \"ar\" ? \"الصلاحيات\" : \"Berechtigungen\"}</summary>\n          <div className=\"more-rows\">\n            {access && <Link className=\"more-row\" href={`/${locale}/staff/access`}>{locale === \"ar\" ? \"إدارة الصلاحيات\" : \"Berechtigungen verwalten\"}</Link>}\n            {moderation&&<Link className=\"more-row\" href={`/${locale}/school/more/message-reports`}>{locale===\"ar\"?\"بلاغات الرسائل\":\"Gemeldete Nachrichten\"}</Link>}\n          </div>\n        </MoreGroup>}\n        <MoreGroup group=\"account\">\n          <summary>{locale === \"ar\" ? \"الحساب والجهاز\" : \"Konto und Gerät\"}</summary>\n          <div className=\"more-rows\">\n            <Link className=\"more-row\" href={`/${locale}/account/profile`}>{locale===\"ar\"?\"الملف الشخصي\":\"Profil\"}</Link>\n            <Link className=\"more-row\" href={`/${locale}/account/preferences`}>{locale === \"ar\" ? \"إعدادات التطبيق والإشعارات\" : \"App-Einstellungen und Benachrichtigungen\"}</Link>\n            <Link className=\"more-row\" href={`/${locale}/account/security`}>{locale === \"ar\" ? \"الأمان والاسترجاع\" : \"Sicherheit und Wiederherstellung\"}</Link>\n          </div>\n          <SessionControls locale={locale} session={session} />\n        </MoreGroup>\n      </div>}\n    </>\n  );\n}\n"],["qa/web/ui-visual-polish-p06-attendance.spec.ts","fc858d31b101d00de5a518fb7f522b1eab41b381","import { expect, test } from \"@playwright/test\";\nimport { mkdirSync, writeFileSync } from \"node:fs\";\nimport { schoolFixtures } from \"../fixtures/school\";\nimport { fixtureApi } from \"../support/api\";\nimport { schoolClock } from \"../fixtures/clock\";\nimport { localOrigin } from \"../support/target\";\n\nfor (const scene of [\n  { locale: \"de\", width: 390, theme: \"light\", tally: \"Anwesenheitsliste\" },\n  { locale: \"ar\", width: 320, theme: \"dark\", tally: \"كشف الحضور\" },\n] as const) {\n  test(`P06 configured attendance visual hierarchy ${scene.locale}`, async ({ page, context, browser }) => {\n    const school = schoolFixtures();\n    const folder = `qa-artifacts/visual-polish/P06/${scene.locale}-${scene.width}/${browser.browserType().name()}`;\n    mkdirSync(folder, { recursive: true });\n    await context.tracing.start({ screenshots: true, snapshots: true });\n    try {\n      await school.seed();\n      const token = await school.bearer(\"teacher\", \"teacher\");\n      const date = schoolClock.day;\n      const catalogue = await fixtureApi(school, `/attendance/classes?date=${date}`, { token, persona: \"teacher\" });\n      const classroom = catalogue.payload.data.classes[0];\n      expect(classroom).toBeTruthy();\n      const path = `/attendance/classes/${classroom.id}/days/${date}`;\n      const initial = await fixtureApi(school, path, { token, persona: \"teacher\" });\n      if (initial.payload.data.state === \"unstarted\") {\n        await fixtureApi(school, path + \"/open\", { method: \"POST\", token, persona: \"teacher\", key: `${school.run}.visual-attendance.${date}` });\n      }\n      const sheet = (await fixtureApi(school, path, { token, persona: \"teacher\" })).payload.data;\n      expect(sheet.state).toBe(\"open\");\n      expect(sheet.rows.length).toBeGreaterThan(0);\n      await context.addCookies([{ name: \"madrasty-session\", value: token, url: localOrigin, httpOnly: true, sameSite: \"Lax\" }]);\n      await page.setViewportSize({ width: scene.width, height: 844 });\n      await page.emulateMedia({ colorScheme: scene.theme, reducedMotion: \"reduce\" });\n      const url = `/${scene.locale}/school/attendance?class=${classroom.id}&date=${date}`;\n      expect((await page.goto(url))?.status()).toBe(200);\n      const tally = page.getByRole(\"list\", { name: scene.tally, exact: true });\n      await expect(tally).toBeVisible();\n      const rows = page.locator(\"li.timetable-day\");\n      await expect(rows).toHaveCount(sheet.rows.length);\n      const first = rows.first().getByRole(\"combobox\");\n      await expect(first).toBeEnabled();\n      const values = await tally.locator(\"output\").allTextContents();\n      expect(values).toEqual(Object.values(sheet.counts).map(value => new Intl.NumberFormat(scene.locale).format(Number(value))));\n      await page.evaluate(() => document.fonts.ready.then(() => undefined));\n      const tallyGeometry = await tally.locator(\"output\").first().evaluate(el => ({\n        size: parseFloat(getComputedStyle(el).fontSize),\n        weight: Number(getComputedStyle(el).fontWeight),\n      }));\n      const rowGeometry = await rows.first().evaluate(el => ({\n        inset: parseFloat(getComputedStyle(el).paddingInlineStart),\n        selectorHeight: el.querySelector(\"select\")!.getBoundingClientRect().height,\n      }));\n      const measureReflow = async (state: string) => {\n        const geometry = await page.locator(\".school-content\").evaluate(root => {\n          const box = root.getBoundingClientRect();\n          const overflow = root.scrollWidth - root.clientWidth;\n          const culprits = [...root.querySelectorAll(\"*\")].filter(el => {\n            if (el.classList.contains(\"screen-reader-only\")) return false;\n            const r = el.getBoundingClientRect();\n            return r.width > 0 && (r.left < box.left - 1 || r.right > box.right + 1);\n          }).slice(0, 15).map(el => ({\n            tag: el.tagName, classes: typeof el.className === \"string\" ? el.className : \"\",\n            width: Math.round(el.getBoundingClientRect().width),\n          }));\n          return { overflow, culprits };\n        });\n        if (geometry.overflow > 1) console.log(\"P06 overflow\", JSON.stringify({ locale: scene.locale, state, ...geometry }));\n        expect(geometry.overflow).toBeLessThanOrEqual(1);\n      };\n      const checkFilterSpacing = async (state: string) => {\n        const layout = await page.locator(\".attendance-filters\").evaluate(el => {\n          const parts = Array.from(el.children).map(child => child.getBoundingClientRect()).filter(rect => rect.height > 0);\n          return { gaps: parts.slice(1).map((rect, index) => rect.top - parts[index]!.bottom), count: parts.length };\n        });\n        console.log(\"P11 attendance filter spacing\", JSON.stringify({ locale: scene.locale, state, ...layout }));\n        expect(layout.count).toBeGreaterThanOrEqual(4);\n        for (const gap of layout.gaps) expect(gap).toBeGreaterThanOrEqual(8);\n      };\n      await checkFilterSpacing(\"normal\");\n      await page.screenshot({ path: folder + \"/ready.png\" });\n      await measureReflow(\"normal\");\n      await page.evaluate(() => { document.documentElement.style.fontSize = \"200%\"; });\n      await page.screenshot({ path: folder + \"/ready-text-200.png\" });\n      await measureReflow(\"text-200\");\n      await checkFilterSpacing(\"text-200\");\n      if (scene.locale === \"de\") {\n        const heading = page.getByRole(\"heading\", { name: \"Anwesenheit\", level: 1, exact: true });\n        await expect(heading).toBeVisible();\n        const wrapping = await heading.evaluate(el => {\n          const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);\n          const breaks: number[] = [];\n          let letters = 0, prior: number | undefined;\n          for (let node = walker.nextNode(); node; node = walker.nextNode()) {\n            const text = node.textContent ?? \"\";\n            for (let i = 0; i < text.length; i++) {\n              if (text[i] === \"\\u00ad\") continue;\n              const range = document.createRange();\n              range.setStart(node, i);\n              range.setEnd(node, i + 1);\n              const rect = Array.from(range.getClientRects()).filter(rect => rect.width > 0).at(-1);\n              if (!rect) throw new Error(\"Missing attendance heading glyph geometry\");\n              const top = Math.round(rect.top);\n              if (prior !== undefined && prior !== top) breaks.push(letters);\n              prior = top;\n              letters++;\n            }\n          }\n          return { text: el.textContent?.replaceAll(\"\\u00ad\", \"\"), breaks };\n        });\n        expect(wrapping.text).toBe(\"Anwesenheit\");\n        console.log(\"P06 attendance heading breaks\", JSON.stringify(wrapping));\n        expect(wrapping.breaks.filter(index => ![2, 4, 7].includes(index))).toEqual([]);\n      }\n      writeFileSync(folder + \"/geometry.json\", JSON.stringify({ tallyGeometry, rowGeometry }, null, 2));\n      console.log(\"P06 attendance geometry\", JSON.stringify({ locale: scene.locale, tallyGeometry, rowGeometry }));\n      expect(tallyGeometry.size).toBeGreaterThanOrEqual(20);\n      expect(tallyGeometry.weight).toBeGreaterThanOrEqual(650);\n      expect(rowGeometry.inset).toBeGreaterThanOrEqual(12);\n      expect(rowGeometry.selectorHeight).toBeGreaterThanOrEqual(48);\n    } finally {\n      await context.tracing.stop({ path: folder + \"/trace.zip\" });\n      await school.close();\n    }\n  });\n}\n"]]'''):
              assert subprocess.check_output(["git","hash-object",name], text=True).strip()==sha, "Unexpected source precondition"
              Path(name).write_text(content)
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          git add -- 'apps/web/src/app/[locale]/school/[tab]/page.tsx' qa/web/ui-visual-polish-p06-attendance.spec.ts docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' 'apps/web/src/app/[locale]/school/[tab]/page.tsx' qa/web/ui-visual-polish-p06-attendance.spec.ts docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep German attendance heading syllables readable at enlarged text"
