name: P11 native label measurement and unread badge correction
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-native-label-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply measured label allocation and preserve Material system insets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for name, sha, content in json.loads(r'''[["apps/android/app/src/main/java/de/madrasty/app/ui/SchoolShell.kt","b58569e59107931cc6d941fd49a7b4876285de9f","package de.madrasty.app.ui\n\nimport androidx.activity.compose.BackHandler\nimport androidx.compose.foundation.Image\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.layout.BoxWithConstraints\nimport androidx.compose.foundation.layout.ExperimentalLayoutApi\nimport androidx.compose.foundation.layout.FlowRow\nimport androidx.compose.foundation.layout.fillMaxWidth\nimport androidx.compose.foundation.layout.heightIn\nimport androidx.compose.foundation.layout.width\nimport androidx.compose.foundation.layout.windowInsetsPadding\nimport androidx.compose.foundation.selection.selectable\nimport androidx.compose.foundation.selection.selectableGroup\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material3.Surface\nimport androidx.compose.ui.draw.clip\nimport androidx.compose.ui.platform.LocalDensity\nimport androidx.compose.ui.semantics.Role\nimport androidx.compose.ui.text.AnnotatedString\nimport androidx.compose.ui.text.rememberTextMeasurer\nimport androidx.compose.ui.text.style.TextAlign\nimport androidx.compose.foundation.layout.Arrangement\nimport androidx.compose.foundation.layout.Box\nimport androidx.compose.foundation.layout.Column\nimport androidx.compose.foundation.layout.Row\nimport androidx.compose.foundation.layout.WindowInsets\nimport androidx.compose.foundation.layout.fillMaxSize\nimport androidx.compose.foundation.layout.imePadding\nimport androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.safeDrawing\nimport androidx.compose.foundation.layout.size\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.verticalScroll\nimport androidx.compose.material3.Badge\nimport androidx.compose.material3.NavigationBarDefaults\nimport androidx.compose.material3.TopAppBarDefaults\nimport androidx.compose.material3.ExperimentalMaterial3Api\nimport androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.ModalBottomSheet\nimport androidx.compose.material3.Scaffold\nimport androidx.compose.material3.Text\nimport androidx.compose.material3.TextButton\nimport androidx.compose.runtime.Composable\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.key\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.saveable.rememberSaveable\nimport androidx.compose.runtime.saveable.rememberSaveableStateHolder\nimport androidx.compose.runtime.setValue\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.res.painterResource\nimport androidx.compose.ui.res.stringResource\nimport androidx.compose.ui.semantics.heading\nimport androidx.compose.ui.semantics.contentDescription\nimport androidx.compose.ui.semantics.semantics\nimport androidx.compose.ui.unit.dp\nimport de.madrasty.app.R\n\nenum class Persona { Admin, Teacher, Guardian }\n\ndata class SchoolPartition(val accountId: String, val sessionId: String, val persona: Persona)\ndata class ScopeOption(val id: String, val label: String, val detail: String? = null)\n\nenum class SchoolTab(val label: Int, val icon: Int) {\n    Home(R.string.nav_home, R.drawable.ic_home),\n    Students(R.string.nav_students, R.drawable.ic_people),\n    Attendance(R.string.nav_attendance, R.drawable.ic_attendance),\n    Children(R.string.nav_children, R.drawable.ic_people),\n    Messages(R.string.nav_messages, R.drawable.ic_messages),\n    Calendar(R.string.comms_calendar, R.drawable.ic_calendar),\n    More(R.string.nav_more, R.drawable.ic_more),\n}\n\nprivate fun tabsFor(persona: Persona): List<SchoolTab> {\n    val second = when (persona) {\n        Persona.Admin -> SchoolTab.Students\n        Persona.Teacher -> SchoolTab.Attendance\n        Persona.Guardian -> SchoolTab.Children\n    }\n    return listOf(SchoolTab.Home, second, SchoolTab.Messages, SchoolTab.Calendar, SchoolTab.More)\n}\n\n@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun SchoolShell(\n    actor: SchoolPartition,\n    selected: SchoolTab,\n    changeTab: (SchoolTab) -> Unit,\n    selectedScope: ScopeOption? = null,\n    choices: List<ScopeOption> = emptyList(),\n    selectScope: (String) -> Unit = {},\n    notificationAction: @Composable () -> Unit = {},\n    mayManageStudents: Boolean = true,\n    scrollContent: Boolean = true,\n    floatingAction: @Composable () -> Unit = {},\n    unreadMessages: Int = 0,\n    content: @Composable (SchoolTab) -> Unit,\n) {\n    key(actor.accountId, actor.sessionId, actor.persona) {\n        val tabs = tabsFor(actor.persona).filter { it != SchoolTab.Students || mayManageStudents }\n        val active = selected.takeIf { it in tabs } ?: SchoolTab.Home\n        var pickerVisible by rememberSaveable { mutableStateOf(false) }\n        val states = rememberSaveableStateHolder()\n        BackHandler(enabled = selected != SchoolTab.Home && !pickerVisible) { changeTab(SchoolTab.Home) }\n\n        Scaffold(\n            contentWindowInsets = WindowInsets.safeDrawing,\n            containerColor = MaterialTheme.colorScheme.background,\n            floatingActionButton = floatingAction,\n            topBar = {\n                SchoolShellHeader(active, choices.isNotEmpty(), { pickerVisible = true }, notificationAction)\n            },\n            bottomBar = {\n                SchoolShellNavigation(tabs, active, changeTab, unreadMessages)\n            },\n        ) { insets ->\n            Box(Modifier.fillMaxSize().padding(insets).imePadding()) {\n                states.SaveableStateProvider(active.name) {\n                    val scroll=rememberScrollState()\n                    Column(Modifier.fillMaxSize().then(if(scrollContent)Modifier.verticalScroll(scroll) else Modifier).padding(16.dp),\n                        verticalArrangement = Arrangement.spacedBy(16.dp)) {\n                        selectedScope?.let { Text(isolate(it.label), style = MaterialTheme.typography.bodySmall) }\n                        content(active)\n                    }\n                }\n            }\n        }\n\n        if (pickerVisible) {\n            ModalBottomSheet(onDismissRequest = { pickerVisible = false }) {\n                Column(Modifier.verticalScroll(rememberScrollState()).padding(16.dp)) {\n                    Text(stringResource(R.string.choose), Modifier.semantics { heading() })\n                    TextButton(onClick = { pickerVisible = false }) { Text(stringResource(R.string.close)) }\n                    choices.forEach { option ->\n                        androidx.compose.material3.FilterChip(\n                            selected = option.id == selectedScope?.id,\n                            onClick = { selectScope(option.id); pickerVisible = false },\n                            label = {\n                                Column {\n                                    Text(isolate(option.label))\n                                    option.detail?.let { Text(isolate(it), style = MaterialTheme.typography.bodySmall) }\n                                }\n                            },\n                        )\n                    }\n                }\n            }\n        }\n    }\n}\n\n\n/** Grow with system type instead of forcing the title into a fixed-height app bar. */\n@OptIn(ExperimentalLayoutApi::class, ExperimentalMaterial3Api::class)\n@Composable\nprivate fun SchoolShellHeader(\n    active: SchoolTab,\n    hasChoices: Boolean,\n    openScope: () -> Unit,\n    notificationAction: @Composable () -> Unit,\n) {\n    val branded = active != SchoolTab.Messages && active != SchoolTab.Calendar\n    val title = stringResource(if (branded) R.string.app_name else active.label)\n    val scopeLabel = stringResource(R.string.choose_scope)\n    val titleStyle = MaterialTheme.typography.titleLarge\n    val actionStyle = MaterialTheme.typography.labelLarge\n    val measurer = rememberTextMeasurer()\n    val density = LocalDensity.current\n    val titleNatural = with(density) {\n        measurer.measure(AnnotatedString(title), style = titleStyle, softWrap = false, maxLines = 1).size.width.toDp()\n    } + if (branded) 44.dp else 0.dp\n    val scopeNatural = if (hasChoices) with(density) {\n        measurer.measure(AnnotatedString(scopeLabel), style = actionStyle, softWrap = false, maxLines = 1).size.width.toDp()\n    } + 32.dp else 0.dp\n    Surface(color = MaterialTheme.colorScheme.surface) {\n        BoxWithConstraints(Modifier.fillMaxWidth()\n            .windowInsetsPadding(TopAppBarDefaults.windowInsets)\n            .padding(horizontal = 12.dp, vertical = 4.dp)) {\n            // Reserve both native icon touch targets; an absent optional action\n            // merely leaves room rather than compressing the school name.\n            val actionNatural = 96.dp + scopeNatural\n            val inline = titleNatural + actionNatural + 8.dp <= maxWidth\n            val titleWidth = if (inline) maxWidth - actionNatural - 8.dp else maxWidth\n            val actionsWidth = if (inline) actionNatural else maxWidth\n            FlowRow(\n                modifier = Modifier.fillMaxWidth(),\n                horizontalArrangement = Arrangement.spacedBy(8.dp),\n                verticalArrangement = Arrangement.spacedBy(0.dp),\n            ) {\n                Row(Modifier.width(titleWidth).heightIn(min = 48.dp),\n                    verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                    if (branded) Image(painterResource(R.drawable.school_seal), null, Modifier.size(36.dp))\n                    Text(title, Modifier.weight(1f).semantics { heading() }, style = titleStyle)\n                }\n                FlowRow(Modifier.width(actionsWidth), horizontalArrangement = Arrangement.End,\n                    verticalArrangement = Arrangement.Center) {\n                    notificationAction()\n                    InterfaceSettingsAction()\n                    if (hasChoices) TextButton(onClick = openScope, modifier = Modifier.heightIn(min = 48.dp)) {\n                        Text(scopeLabel, style = actionStyle)\n                    }\n                }\n            }\n        }\n    }\n}\n\n/** Intrinsic label widths determine row breaks. All tabs remain visible and selectable. */\n@Composable\nprivate fun SchoolShellNavigation(\n    tabs: List<SchoolTab>,\n    active: SchoolTab,\n    changeTab: (SchoolTab) -> Unit,\n    unreadMessages: Int,\n) {\n    val labels = tabs.map { stringResource(it.label) }\n    val style = MaterialTheme.typography.labelMedium\n    val measurer = rememberTextMeasurer()\n    val density = LocalDensity.current\n    val labelLayouts = labels.map { label ->\n        measurer.measure(AnnotatedString(label), style = style, softWrap = false, maxLines = 1)\n    }\n    val badgeText = if (unreadMessages > 99) \"99+\" else unreadMessages.toString()\n    val badgeStyle = MaterialTheme.typography.labelSmall\n    val badgeLayout = measurer.measure(AnnotatedString(badgeText), style = badgeStyle, softWrap = false, maxLines = 1)\n    val badgeWidth = with(density) { badgeLayout.size.width.toDp() }\n    val badgeHeight = with(density) { badgeLayout.size.height.toDp() } + 1.dp\n    val minimums = labelLayouts.mapIndexed { index, layout ->\n        with(density) {\n            // The unread chip is a real sibling, not an overlapping glyph\n            // inside a fixed 40x32 clipped icon. Reserve its intrinsic width.\n            val iconWidth = if (tabs[index] == SchoolTab.Messages && unreadMessages > 0)\n                24.dp + 4.dp + badgeWidth + 12.dp + 16.dp + 12.dp\n            else 48.dp\n            (layout.size.width.toDp() + 16.dp).coerceAtLeast(iconWidth).coerceAtLeast(48.dp).value\n        }\n    }\n    Surface(color = MaterialTheme.colorScheme.surfaceContainerLow) {\n        BoxWithConstraints(Modifier.fillMaxWidth()\n            .windowInsetsPadding(NavigationBarDefaults.windowInsets)\n            .padding(horizontal = 4.dp, vertical = 4.dp)) {\n            val rows = mutableListOf<MutableList<Int>>()\n            for (index in tabs.indices) {\n                val last = rows.lastOrNull()\n                if (last == null || last.sumOf { minimums[it].toDouble() } + minimums[index] > maxWidth.value) {\n                    rows.add(mutableListOf(index))\n                } else last.add(index)\n            }\n            // Avoid an isolated final tab when the preceding row can spare one.\n            if (rows.size > 1 && rows.last().size == 1) {\n                val previous = rows[rows.lastIndex - 1]\n                val last = rows.last()\n                if (previous.size >= 3 && minimums[previous.last()] + minimums[last.first()] <= maxWidth.value) {\n                    last.add(0, previous.removeAt(previous.lastIndex))\n                }\n            }\n            Column(Modifier.fillMaxWidth().selectableGroup()) {\n                rows.forEach { indices ->\n                    Row(Modifier.fillMaxWidth()) {\n                        indices.forEach { index ->\n                            val tab = tabs[index]\n                            val selected = active == tab\n                            Column(\n                                Modifier.weight(minimums[index]).heightIn(min = 64.dp)\n                                    .clip(MaterialTheme.shapes.medium)\n                                    .selectable(selected = selected, onClick = { changeTab(tab) }, role = Role.Tab)\n                                    .padding(horizontal = 6.dp, vertical = 4.dp),\n                                horizontalAlignment = Alignment.CenterHorizontally,\n                                verticalArrangement = Arrangement.spacedBy(2.dp, Alignment.CenterVertically),\n                            ) {\n                                val colors = MaterialTheme.colorScheme\n                                val tint = if (selected) colors.onSecondaryContainer else colors.onSurfaceVariant\n                                val indicator = if (selected) colors.secondaryContainer else colors.surfaceContainerLow\n                                if (tab == SchoolTab.Messages && unreadMessages > 0) {\n                                    val unreadLabel = stringResource(R.string.comms_unread_badge, unreadMessages)\n                                    Row(Modifier.heightIn(min = 32.dp)\n                                        .background(indicator, RoundedCornerShape(50))\n                                        .padding(horizontal = 8.dp, vertical = 4.dp),\n                                        horizontalArrangement = Arrangement.spacedBy(4.dp),\n                                        verticalAlignment = Alignment.CenterVertically) {\n                                        SchoolIcon(tab.icon, tint)\n                                        Badge(Modifier.semantics { contentDescription = unreadLabel }) {\n                                            Text(badgeText, Modifier.heightIn(min = badgeHeight), style = badgeStyle,\n                                                softWrap = false, maxLines = 1)\n                                        }\n                                    }\n                                } else {\n                                    Box(Modifier.size(width = 40.dp, height = 32.dp)\n                                        .background(indicator, RoundedCornerShape(50)), contentAlignment = Alignment.Center) {\n                                        SchoolIcon(tab.icon, tint)\n                                    }\n                                }\n                                // Allocate the full measured line, including pixel-rounding headroom.\n                                // Keep the system's actual type size and a centered, single readable label.\n                                val lineHeight = with(density) { labelLayouts[index].size.height.toDp() } + 1.dp\n                                Text(labels[index], Modifier.fillMaxWidth().heightIn(min = lineHeight),\n                                    style = style, color = colors.onSurface, textAlign = TextAlign.Center,\n                                    softWrap = false, maxLines = 1)\n                            }\n                        }\n                    }\n                }\n            }\n        }\n    }\n}\n@Composable\nprivate fun SchoolIcon(icon: Int, tint: androidx.compose.ui.graphics.Color) {\n    androidx.compose.material3.Icon(painterResource(icon), null, Modifier.size(24.dp), tint = tint)\n}\n"],["apps/android/app/src/androidTest/java/de/madrasty/app/ui/FoundationVisualTest.kt","4f9f890c7313c462bed502a12448de4ac5e8f992","package de.madrasty.app.ui\n\nimport android.content.res.Configuration\nimport androidx.compose.material3.MaterialTheme\nimport androidx.compose.material3.Text\nimport androidx.compose.runtime.CompositionLocalProvider\nimport androidx.compose.runtime.SideEffect\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.remember\nimport androidx.compose.runtime.setValue\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.platform.LocalConfiguration\nimport androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalLayoutDirection\nimport androidx.compose.ui.test.assertHeightIsAtLeast\nimport androidx.compose.ui.test.assertWidthIsAtLeast\nimport androidx.compose.ui.test.assertIsSelected\nimport androidx.compose.ui.test.assertIsNotSelected\nimport androidx.compose.ui.test.hasClickAction\nimport androidx.compose.ui.test.hasText\nimport androidx.compose.ui.test.onNodeWithContentDescription\nimport androidx.compose.ui.test.assertIsDisplayed\nimport androidx.compose.ui.test.junit4.v2.createComposeRule\nimport androidx.compose.ui.test.onNodeWithText\nimport androidx.compose.ui.test.performClick\nimport androidx.compose.ui.test.performScrollTo\nimport androidx.compose.ui.semantics.SemanticsActions\nimport androidx.compose.ui.test.performSemanticsAction\nimport androidx.compose.ui.text.TextLayoutResult\nimport androidx.compose.ui.unit.LayoutDirection\nimport androidx.compose.ui.unit.dp\nimport androidx.test.platform.app.InstrumentationRegistry\nimport de.madrasty.app.R\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertTrue\nimport org.junit.Rule\nimport org.junit.Test\nimport java.util.Locale\n\n/** Exercises the actual school shell and hero against local Compose state. */\nclass FoundationVisualTest {\n    @get:Rule val compose = createComposeRule()\n\n    @Test fun adminGermanLight() = verify(\"de\", false, Persona.Admin)\n    @Test fun guardianArabicDark() = verify(\"ar\", true, Persona.Guardian)\n    @Test fun teacherGermanDark() = verify(\"de\", true, Persona.Teacher)\n    @Test fun teacherArabicLight() = verify(\"ar\", false, Persona.Teacher)\n\n    private fun verify(language: String, dark: Boolean, persona: Persona) {\n        val instrumentation = InstrumentationRegistry.getInstrumentation()\n        val context = instrumentation.targetContext\n        InstrumentationRegistry.getArguments().getString(\"visualPolishFontScale\")?.toFloat()?.let { expected ->\n            assertEquals(expected, context.resources.configuration.fontScale, 0.05f)\n        }\n        val baseline = InstrumentationRegistry.getArguments().getString(\"visualPolishBaseline\") == \"true\"\n        val arabic = language == \"ar\"\n        val resources = context.createConfigurationContext(Configuration(context.resources.configuration).apply {\n            setLocale(Locale.forLanguageTag(language))\n        }).resources\n        val title = when (persona) {\n            Persona.Admin -> if (arabic) \"مهام المدرسة\" else \"Aufgaben der Schule\"\n            Persona.Teacher -> if (arabic) \"حصص اليوم\" else \"Unterricht heute\"\n            Persona.Guardian -> if (arabic) \"مدرسة تجريبية\" else \"Meine Kinder\"\n        }\n        val action = when (persona) {\n            Persona.Admin -> if (arabic) \"افتح المهام\" else \"Aufgaben öffnen\"\n            Persona.Teacher -> if (arabic) \"افتح الحضور\" else \"Anwesenheit öffnen\"\n            Persona.Guardian -> if (arabic) \"افتح بيانات الطفل\" else \"Kind ansehen\"\n        }\n        val alternate = if (arabic) \"الفصل الثاني\" else \"Zweite Klasse\"\n        val detail = if (arabic) \"٣ مهام مفتوحة\" else \"3 offene Aufgaben\"\n        val destination = if (arabic) \"عرض تجريبي\" else \"Testansicht\"\n        val prefix = \"${persona.name.lowercase()}-$language-${if (dark) \"dark\" else \"light\"}\"\n        var observedCanvas = Color.Unspecified\n        var observedTab = SchoolTab.Home\n\n        compose.setContent {\n            val current = LocalContext.current\n            val localized = remember(current, language) {\n                current.createConfigurationContext(Configuration(current.resources.configuration).apply {\n                    setLocale(Locale.forLanguageTag(language))\n                })\n            }\n            CompositionLocalProvider(\n                LocalContext provides localized,\n                LocalConfiguration provides localized.resources.configuration,\n                LocalLayoutDirection provides if (arabic) LayoutDirection.Rtl else LayoutDirection.Ltr,\n            ) {\n                SchoolTheme(darkMode = dark) {\n                    val canvas = MaterialTheme.colorScheme.background\n                    var selected by remember { mutableStateOf(SchoolTab.Home) }\n                    SideEffect { observedCanvas = canvas; observedTab = selected }\n                    val choices = listOf(ScopeOption(\"one\", if (arabic) \"الفصل الأول\" else \"Erste Klasse\"), ScopeOption(\"two\", alternate))\n                    var scope by remember { mutableStateOf(choices.first()) }\n                    SchoolShell(\n                        actor = SchoolPartition(\"fixture\", \"fixture\", persona),\n                        selected = selected,\n                        changeTab = { selected = it },\n                        selectedScope = scope,\n                        choices = choices,\n                        unreadMessages = 105,\n                        selectScope = { id -> scope = choices.single { it.id == id } },\n                    ) { tab ->\n                        if (tab == SchoolTab.Home) {\n                            if (persona == Persona.Admin) AdminRoleHero(title, detail, action, listOf(alternate)) { selected = SchoolTab.More }\n                            else RoleHero(persona, title, detail, action) { selected = SchoolTab.More }\n                        } else {\n                            Text(destination)\n                        }\n                    }\n                }\n            }\n        }\n\n        fun capture(scene: String) {\n            compose.waitForIdle()\n            instrumentation.waitForIdleSync()\n            val bitmap = requireNotNull(instrumentation.uiAutomation.takeScreenshot())\n            try {\n                saveVisualEvidence(context, bitmap, \"$prefix-$scene.png\", if (baseline) \"before\" else \"after\")\n            } finally { bitmap.recycle() }\n        }\n\n        compose.onNodeWithText(title).assertIsDisplayed()\n        capture(\"home\")\n        compose.onNodeWithText(resources.getString(R.string.choose_scope)).performClick()\n        compose.onNodeWithText(isolate(alternate)).assertIsDisplayed()\n        capture(\"scope\")\n        compose.onNodeWithText(isolate(alternate)).performClick()\n        compose.onNodeWithText(isolate(alternate)).assertIsDisplayed()\n        val heroAction = compose.onNodeWithText(action).performScrollTo()\n        if (!baseline) heroAction.assertHeightIsAtLeast(48.dp)\n        heroAction.performClick()\n        compose.onNodeWithText(destination).assertIsDisplayed()\n        compose.onNodeWithText(resources.getString(R.string.nav_home)).performClick()\n        compose.onNodeWithText(title).assertIsDisplayed()\n        if (!baseline) {\n            // Accessibility typography must keep complete words readable, not merely\n            // expose the correct semantics on a fragmented/clipped visual label.\n            val second = when (persona) {\n                Persona.Admin -> SchoolTab.Students\n                Persona.Teacher -> SchoolTab.Attendance\n                Persona.Guardian -> SchoolTab.Children\n            }\n            assertWholeWords(resources.getString(R.string.app_name))\n            val tabs = listOf(SchoolTab.Home, second, SchoolTab.Messages, SchoolTab.Calendar, SchoolTab.More)\n            tabs.forEach { assertWholeWords(resources.getString(it.label)) }\n            compose.onNodeWithContentDescription(resources.getString(R.string.comms_unread_badge, 105), useUnmergedTree = true)\n                .assertIsDisplayed()\n            assertWholeWords(\"99+\")\n            val badgeText = compose.onNodeWithText(\"99+\", useUnmergedTree = true).fetchSemanticsNode()\n            assertTrue(\"Unread badge is horizontally clipped\", badgeText.boundsInRoot.width + 1 >= badgeText.size.width)\n            assertTrue(\"Unread badge is vertically clipped\", badgeText.boundsInRoot.height + 1 >= badgeText.size.height)\n            // Reflow must not remove destinations, reduce touch targets or change selection.\n            tabs.forEach { tab ->\n                val item = compose.onNode(hasText(resources.getString(tab.label)) and hasClickAction())\n                item.assertIsDisplayed().assertHeightIsAtLeast(48.dp).assertWidthIsAtLeast(48.dp)\n                item.performClick()\n                item.assertIsSelected()\n                tabs.filter { it != tab }.forEach { other ->\n                    compose.onNode(hasText(resources.getString(other.label)) and hasClickAction()).assertIsNotSelected()\n                }\n                compose.runOnIdle { assertEquals(tab, observedTab) }\n            }\n            compose.onNode(hasText(resources.getString(R.string.nav_home)) and hasClickAction()).performClick()\n            compose.onNodeWithText(title).assertIsDisplayed()\n            compose.runOnIdle {\n                assertEquals(if (dark) Color(0xFF111A18) else Color(0xFFF5F6F2), observedCanvas)\n            }\n        }\n    }\n    private fun assertWholeWords(label: String) {\n        val layouts = mutableListOf<TextLayoutResult>()\n        compose.onNodeWithText(label, useUnmergedTree = true)\n            .performSemanticsAction(SemanticsActions.GetTextLayoutResult) { action ->\n                assertTrue(\"No text layout for $label\", action(layouts))\n            }\n        assertTrue(\"No text layout for $label\", layouts.isNotEmpty())\n        layouts.forEach { layout ->\n            val details = \"size=${layout.size}, paragraph=${layout.multiParagraph.width}x${layout.multiParagraph.height}, widthOverflow=${layout.didOverflowWidth}, heightOverflow=${layout.didOverflowHeight}, lines=${layout.lineCount}\"\n            assertTrue(\"Clipped text: $label ($details)\", !layout.hasVisualOverflow)\n            val text = layout.layoutInput.text.text\n            Regex(\"\\\\S+\").findAll(text).forEach { word ->\n                assertEquals(\n                    \"Word split across lines in $label: ${word.value}\",\n                    layout.getLineForOffset(word.range.first),\n                    layout.getLineForOffset(word.range.last),\n                )\n            }\n        }\n    }\n}\n"]]'''):
              assert subprocess.check_output(["git","hash-object",name], text=True).strip()==sha, "Unexpected source precondition"
