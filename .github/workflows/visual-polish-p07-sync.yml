name: P07 isolated class monitor polish and registry synchronization
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-p07-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply exact P07 CSS replacements and regenerate registries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          file=Path("apps/web/src/features/school/AdminClassMonitor.module.css")
          content=file.read_text()
          for old,new in json.loads(r'''[[".root{max-width:1180px;margin:0 auto;padding:16px 0 38px;display:grid;gap:18px;color:var(--ink)}",".root{max-width:1180px;min-width:0;margin:0 auto;padding:16px 0 38px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;color:var(--ink);overflow-wrap:anywhere}"],[".header{display:grid;gap:7px}",".header{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:7px}"],["border-radius:11px;padding:10px 14px;min-height:44px;font:inherit;font-size:.9rem;font-weight:650;cursor:pointer","border-radius:var(--radius-control);padding:10px 14px;min-height:44px;min-width:0;max-width:100%;font:inherit;font-size:.9rem;font-weight:650;cursor:pointer;overflow-wrap:anywhere;white-space:normal"],[".field{display:grid;gap:7px;font-size:.9rem;font-weight:600;max-width:460px}",".field{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;font-size:.9rem;font-weight:600;max-width:min(460px,100%);min-width:0}"],[".field input,.field select{border:1px solid var(--rule);border-radius:11px;background:var(--card);color:var(--ink);padding:11px 12px;min-height:44px;font:inherit;min-width:0}",".field input,.field select{border:1px solid var(--field-border);border-radius:var(--radius-control);background:var(--card);color:var(--ink);padding:10px 12px;min-height:48px;font:inherit;min-width:0;width:100%;max-width:100%;text-overflow:ellipsis}"],[".classList{display:grid;gap:10px}",".classList{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}"],["border-radius:15px;padding:17px;text-align:start;cursor:pointer;color:var(--ink);font:inherit;min-height:112px","border-radius:var(--radius-card);padding:17px;text-align:start;cursor:pointer;color:var(--ink);font:inherit;min-height:112px;min-width:0;overflow-wrap:anywhere"],[".classHeadline{display:flex;align-items:center;justify-content:space-between;gap:14px}",".classHeadline{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;min-width:0}"],[".classHeadline span{font-size:.83rem;font-weight:650;flex-shrink:0}",".classHeadline span{font-size:.83rem;font-weight:650;color:var(--primary);min-width:0}"],["border-radius:14px;background:var(--card);min-width:0","border-radius:var(--radius-card);background:var(--card);min-width:0"],[".metric strong{font-size:clamp(1.05rem,1.8vw,1.55rem);font-weight:740;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}",".metric strong{font-size:clamp(1.5rem,2.4vw,2rem);font-weight:740;font-variant-numeric:tabular-nums;line-height:1.25;color:var(--primary);overflow-wrap:anywhere}"],[".attendanceSummary{border:1px solid var(--rule);border-radius:14px;padding:15px;background:var(--card);display:grid;gap:13px}",".attendanceSummary{border:1px solid var(--rule);border-radius:var(--radius-card);padding:15px;background:var(--card);display:grid;grid-template-columns:minmax(0,1fr);gap:13px;min-width:0}"],["font-weight:650;border-radius:11px;padding:10px 13px;min-height:44px;cursor:pointer","font-weight:650;border-radius:var(--radius-pill);padding:10px 13px;min-height:44px;min-width:0;max-width:100%;overflow-wrap:anywhere;white-space:normal;cursor:pointer"],[".selected{border-color:var(--ink);background:var(--card)}",".selected{border-color:var(--primary);background:var(--selection);color:var(--selection-ink)}"],["border-radius:16px;background:var(--card);padding:17px;display:grid;gap:14px;min-width:0","border-radius:var(--radius-card);background:var(--card);padding:17px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0"],[".list{display:grid;gap:9px}",".list{display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:9px}"],["border-radius:12px;background:var(--inset);padding:12px","border-radius:var(--radius-inset);background:var(--inset);padding:12px;min-width:0"],[".topic{padding:14px;border:1px solid var(--rule);border-radius:12px;background:var(--inset);display:grid;gap:9px;overflow-wrap:anywhere}",".topic{padding:14px;border:1px solid var(--rule);border-radius:var(--radius-inset);background:var(--inset);display:grid;grid-template-columns:minmax(0,1fr);min-width:0;gap:9px;overflow-wrap:anywhere}"]]'''):
              assert content.count(old)==1, "Unexpected CSS precondition"
              content=content.replace(old,new)
          file.write_text(content)
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          git add -- apps/web/src/features/school/AdminClassMonitor.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/features/school/AdminClassMonitor.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish read-only class monitor hierarchy and text reflow"
          git push origin HEAD:refs/heads/visual-polish/premium
