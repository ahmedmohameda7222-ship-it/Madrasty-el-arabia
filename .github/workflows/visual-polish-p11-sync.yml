name: P11 scoped visual review corrections and registry sync
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-p11-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply exact CSS replacements and regenerate registries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name, changes in json.loads(r'''{"apps/web/src/app/school.css":[[".attendance-filters .auth-form, .attendance-sheet, .attendance-sheet .auth-form,",".attendance-filters { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }\n.attendance-filters > .auth-form { margin-block-start: 0; gap: 8px; }\n.attendance-filters > .plain-button { inline-size: 100%; justify-content: center; }\n.attendance-filters > label { display: grid; gap: 6px; }\n.attendance-filters .auth-form, .attendance-sheet, .attendance-sheet .auth-form,"],["  .school-content { scrollbar-width: thin; }","  /* When text is enlarged, keep every destination and allow whole labels more room.\n     At ordinary mobile text size all five destinations remain on one row. */\n  .school-nav[data-columns=\"3\"], .school-nav[data-columns=\"5\"], .school-nav {\n    grid-template-columns: repeat(auto-fit, minmax(min(100%, 3.5rem), 1fr));\n  }\n  .school-nav a { overflow-wrap: normal; hyphens: auto; min-inline-size: 0; }\n  .school-content { scrollbar-width: thin; }"]],"apps/web/src/features/school/AdminClassMonitor.module.css":[[".sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}",".sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr))}"],[".metrics{grid-template-columns:repeat(2,minmax(0,1fr))}",".metrics{grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr))}"]]}''').items():
              file=Path(name)
              content=file.read_text()
              for old,new in changes:
                  assert content.count(old)==1, "Unexpected CSS precondition"
                  content=content.replace(old,new)
              file.write_text(content)
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          git add -- apps/web/src/app/school.css apps/web/src/features/school/AdminClassMonitor.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/app/school.css apps/web/src/features/school/AdminClassMonitor.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Improve attendance spacing and large-text navigation reflow"
          git push origin HEAD:refs/heads/visual-polish/premium
