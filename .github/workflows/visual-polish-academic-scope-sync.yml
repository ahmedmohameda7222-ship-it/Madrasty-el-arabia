name: Visual polish P07 scope picker source sync
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-academic-scope-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply measured standalone picker polish and regenerate registries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,re,json
          from pathlib import Path
          name="apps/web/src/app/school.css"
          assert subprocess.check_output(["git","hash-object",name],text=True).strip()=="0d67044c0aa31b229cc2a644169360829028b920", "Unexpected source precondition"
          p=Path(name)
          source=p.read_text()
          old="label.auth-card > select { min-inline-size: 0; inline-size: 100%; max-inline-size: 100%; text-overflow: ellipsis; }"
          new="label.auth-card > select { min-block-size: 48px; min-inline-size: 0; inline-size: 100%; max-inline-size: 100%; text-overflow: ellipsis; border: 1px solid var(--field-border); border-radius: var(--radius-control); padding: 8px 12px; background: var(--canvas); color: var(--ink); }"
          assert source.count(old)==1
          p.write_text(source.replace(old,new))
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          registry=json.loads(Path("docs/visual-polish/SCENES.json").read_text())
          p=Path("docs/visual-polish/COVERAGE.md")
          source,n=re.subn(r"Source registry fingerprint: `[0-9a-f]{64}`", "Source registry fingerprint: `"+registry["sourceFingerprint"]+"`",p.read_text())
          assert n==1
          p.write_text(source)
          PY
          git add -- apps/web/src/app/school.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json docs/visual-polish/COVERAGE.md
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/app/school.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json docs/visual-polish/COVERAGE.md | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(visual): give standalone academic scope pickers accessible native touch targets"
          git push origin HEAD:refs/heads/visual-polish/premium
