name: P08 isolated chat material and registry synchronization
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-p08-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply exact P08 CSS replacements and regenerate registries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          file=Path("apps/web/src/app/school.css")
          content=file.read_text()
          for old,new in json.loads(r'''[["border-radius:16px 16px 16px 4px","border-radius:var(--radius-card) var(--radius-card) var(--radius-card) 4px"],["border-radius:16px 16px 4px 16px","border-radius:var(--radius-card) var(--radius-card) 4px var(--radius-card)"],[".comms-message-author,.comms-message-time{font-size:.75rem}",".comms-message-author,.comms-message-time{font-size:.8125rem}"],[".comms-contact-trigger span{font-size:.72rem;",".comms-contact-trigger span{font-size:.8125rem;"]]'''):
              assert content.count(old)==(2 if old.startswith("border-radius") else 1), "Unexpected CSS precondition"
              content=content.replace(old,new)
          file.write_text(content)
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          git add -- apps/web/src/app/school.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/app/school.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish chat bubble geometry and metadata typography"
          git push origin HEAD:refs/heads/visual-polish/premium
