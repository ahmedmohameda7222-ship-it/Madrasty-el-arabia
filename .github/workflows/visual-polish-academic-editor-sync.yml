name: Visual polish P07 academic editor source sync
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-academic-editor-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply measured native field and academic editor hierarchy polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,re,json
          from pathlib import Path
          changes=json.loads("[{\"path\":\"apps/web/src/app/school.css\",\"sha\":\"3e7b60080a984e482d9cf8a7c1000c046ed4f2ab\",\"pairs\":[[\".auth-form select { min-block-size: 44px; min-inline-size: 0; max-inline-size: 100%; inline-size: 100%; box-sizing: border-box; text-overflow: ellipsis; background: var(--canvas); color: var(--ink); }\",\".auth-form :is(select,textarea) { min-block-size: 48px; min-inline-size: 0; max-inline-size: 100%; inline-size: 100%; box-sizing: border-box; border-radius: var(--radius-control); padding: 8px 12px; background: var(--canvas); color: var(--ink); border: 1px solid var(--field-border); }\\n.auth-form select { text-overflow: ellipsis; }\"]]},{\"path\":\"apps/web/src/features/academics/Exams.tsx\",\"sha\":\"a5a28d7449d79f3ef6be86a67a62c97dc9743a64\",\"pairs\":[[\"className=\\\"plain-button\\\" onClick={()=>setCreate(true)}\",\"className={create?\\\"plain-button\\\":\\\"primary-button\\\"} onClick={()=>setCreate(true)}\"]]},{\"path\":\"apps/web/src/features/academics/Evaluations.tsx\",\"sha\":\"a63b24dc7497320287cb0333b4a489a86dc1383d\",\"pairs\":[[\"className=\\\"plain-button\\\" onClick={()=>setNewDraft(true)}\",\"className={newDraft?\\\"plain-button\\\":\\\"primary-button\\\"} onClick={()=>setNewDraft(true)}\"]]},{\"path\":\"apps/web/src/features/academics/Homework.tsx\",\"sha\":\"f9ea52e250188b88dec885b9153717369aa0ff28\",\"pairs\":[[\"className=\\\"plain-button\\\" onClick={()=>setCreate(true)}\",\"className={create?\\\"plain-button\\\":\\\"primary-button\\\"} onClick={()=>setCreate(true)}\"]]},{\"path\":\"apps/web/src/features/academics/TeachingActivity.tsx\",\"sha\":\"8474040d7255574e9e23ee13e5bf832f977a589f\",\"pairs\":[[\"className=\\\"plain-button\\\" onClick={()=>setEditing(\\\"new\\\")}\",\"className={editing?\\\"plain-button\\\":\\\"primary-button\\\"} onClick={()=>setEditing(\\\"new\\\")}\"],[\"className=\\\"plain-button\\\" onClick={()=>setCreating(true)}\",\"className={creating?\\\"plain-button\\\":\\\"primary-button\\\"} onClick={()=>setCreating(true)}\"]]},{\"path\":\"apps/web/src/features/academics/Curriculum.tsx\",\"sha\":\"8a542eae65fb49b7d72afd6fdf972716b2a22b96\",\"pairs\":[[\"className=\\\"plain-button\\\" onClick={()=>setCreateLesson(true)}\",\"className={createLesson?\\\"plain-button\\\":\\\"primary-button\\\"} onClick={()=>setCreateLesson(true)}\"]]}]")
          for change in changes:
              name=change["path"]
              assert subprocess.check_output(["git","hash-object",name],text=True).strip()==change["sha"], "Unexpected source precondition: "+name
              p=Path(name)
              source=p.read_text()
              for old,new in change["pairs"]:
                  assert source.count(old)==1, name
                  source=source.replace(old,new)
              p.write_text(source)
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          registry=json.loads(Path("docs/visual-polish/SCENES.json").read_text())
          p=Path("docs/visual-polish/COVERAGE.md")
          source,n=re.subn(r"Source registry fingerprint: `[0-9a-f]{64}`", "Source registry fingerprint: `"+registry["sourceFingerprint"]+"`",p.read_text())
          assert n==1
          p.write_text(source)
          PY
          git add -- apps/web/src/app/school.css apps/web/src/features/academics/Exams.tsx apps/web/src/features/academics/Evaluations.tsx apps/web/src/features/academics/Homework.tsx apps/web/src/features/academics/TeachingActivity.tsx apps/web/src/features/academics/Curriculum.tsx docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json docs/visual-polish/COVERAGE.md
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/app/school.css apps/web/src/features/academics/Exams.tsx apps/web/src/features/academics/Evaluations.tsx apps/web/src/features/academics/Homework.tsx apps/web/src/features/academics/TeachingActivity.tsx apps/web/src/features/academics/Curriculum.tsx docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json docs/visual-polish/COVERAGE.md | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(visual): unify native form fields and six academic editor entry actions"
          git push origin HEAD:refs/heads/visual-polish/premium
