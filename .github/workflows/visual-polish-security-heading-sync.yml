name: P03 security heading typography and registry synchronization
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-security-heading-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply measured heading break points and regenerate source coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for name, sha, content in json.loads(r'''[["apps/web/src/features/identity/SecurityForms.tsx","ef9be1464e1b3fb53de919170d8e021151f59d22","\"use client\";\n\nimport Link from \"next/link\";\nimport Image from \"next/image\";\nimport { useEffect, useState, type FormEvent } from \"react\";\nimport { z } from \"zod\";\nimport { sessionSchema, type Persona, type Locale } from \"@madrasty/contracts\";\nimport { ApiResponseError, requestApi } from \"@/api/client\";\nimport { dictionary, localizedError } from \"@/i18n\";\nimport { webHeaders } from \"./SessionControls\";\n\nconst labels = {\n  ar: {\n    security: \"أمان الحساب\", reset: \"استعادة كلمة السر\", activate: \"تفعيل حساب الإدارة\", verify: \"التحقق بخطوتين\",\n    email: \"البريد الإلكتروني\", newEmail: \"البريد الإلكتروني الجديد\", newPassword: \"كلمة السر الجديدة\",\n    currentPassword: \"كلمة السر الحالية\", send: \"إرسال رابط\", sent: \"لو الحساب متاح، هيوصلك رابط على البريد الإلكتروني.\",\n    authApp: \"امسح رمز QR بتطبيق المصادقة، ثم أدخل الرمز من ٦ أرقام.\", code: \"رمز تطبيق المصادقة\",\n    qrLabel: \"رمز QR لإعداد التحقق بخطوتين\", manualKey: \"إدخال مفتاح الإعداد يدويًا\",\n    enroll: \"إعداد تطبيق المصادقة\", confirm: \"تأكيد\", signin: \"تسجيل الدخول\", verified: \"تم التحقق\",\n    address: \"تغيير البريد الإلكتروني\", activated: \"الحساب جاهز لتسجيل الدخول\", expired: \"الرابط غير متاح. اطلب رابطًا جديدًا.\",\n  },\n  de: {\n    security: \"Kontosicherheit\", reset: \"Passwort zurücksetzen\", activate: \"Verwaltungskonto aktivieren\", verify: \"Zwei-Faktor-Verifizierung\",\n    email: \"E-Mail-Adresse\", newEmail: \"Neue E-Mail-Adresse\", newPassword: \"Neues Passwort\",\n    currentPassword: \"Aktuelles Passwort\", send: \"Link senden\", sent: \"Falls das Konto verfügbar ist, erhalten Sie einen Link per E-Mail.\",\n    authApp: \"Scannen Sie den QR-Code mit Ihrer Authenticator-App und geben Sie den sechsstelligen Code ein.\", code: \"Authenticator-Code\",\n    qrLabel: \"QR-Code für die Zwei-Faktor-Verifizierung\", manualKey: \"Einrichtungsschlüssel manuell eingeben\",\n    enroll: \"Authenticator einrichten\", confirm: \"Bestätigen\", signin: \"Anmelden\", verified: \"Verifiziert\",\n    address: \"E-Mail-Adresse ändern\", activated: \"Sie können sich jetzt anmelden\", expired: \"Der Link ist ungültig. Fordern Sie einen neuen Link an.\",\n  },\n} as const;\n\nconst factor = z.object({ id: z.uuid(), status: z.enum([\"verified\", \"unverified\"]) });\nconst enrollment = z.object({\n  id: z.uuid(), totp: z.object({ secret: z.string(), qrCode: z.string().startsWith(\"data:image/svg+xml;base64,\") }),\n});\nconst challenge = z.object({ challengeId: z.uuid() });\nconst accepted = z.object({ accepted: z.literal(true) });\n\nfunction message(locale: Locale, error: unknown) {\n  return error instanceof ApiResponseError ? localizedError(locale, error.messageKey) : dictionary(locale)[\"error.unavailable\"];\n}\n\nfunction requestBody(body: unknown, persona?: Persona): RequestInit {\n  return { method: \"POST\", headers: webHeaders(persona), body: JSON.stringify(body) };\n}\n\nexport function RecoveryLink({ locale }: { locale: Locale }) {\n  return <Link className=\"plain-button\" href={`/${locale}/account/security/recover`}>{labels[locale].reset}</Link>;\n}\n\nexport function EmailAction({ locale, action, token }: {\n  locale: Locale;\n  action: \"recover\" | \"email\" | \"activate\";\n  token?: string;\n}) {\n  const text = labels[locale];\n  const [pending, setPending] = useState(false);\n  const [done, setDone] = useState(false);\n  const [failure, setFailure] = useState(\"\");\n  const requesting = action === \"recover\" && !token;\n  const title = { recover: text.reset, email: text.address, activate: text.activate }[action];\n\n  async function submit(event: FormEvent<HTMLFormElement>) {\n    event.preventDefault();\n    const input = new FormData(event.currentTarget);\n    setPending(true);\n    setFailure(\"\");\n    try {\n      if (requesting) {\n        await requestApi(\"/auth/recovery/request\", accepted, requestBody({ email: input.get(\"email\"), locale }));\n      } else {\n        const path = { recover: \"recovery/complete\", email: \"email-change/confirm\", activate: \"bootstrap/complete\" }[action];\n        const response = await fetch(`/api/v1/auth/${path}`, requestBody({\n          challenge: token, ...(action !== \"email\" && { newPassword: input.get(\"password\") }),\n        }));\n        if (!response.ok) throw new ApiResponseError(response.status, \"invalid_link\",\n          response.status >= 500 ? \"error.unavailable\" : \"error.validation\");\n        history.replaceState(null, \"\", location.pathname);\n      }\n      setDone(true);\n    } catch (error) {\n      setFailure(message(locale, error));\n    } finally {\n      setPending(false);\n    }\n  }\n\n  return (\n    <section className=\"auth-card\">\n      <h1>{title}</h1>\n      {done ? (\n        <div className=\"auth-form\">\n          <p role=\"status\">{requesting ? text.sent : action === \"email\" ? text.verified : text.activated}</p>\n          <Link href={`/${locale}/account/sign-in`}>{text.signin}</Link>\n        </div>\n      ) : (token || requesting) ? (\n        <form className=\"auth-form\" method=\"post\" onSubmit={submit} aria-busy={pending}>\n          {requesting && <label>{text.email}<input name=\"email\" type=\"email\" autoComplete=\"email\" required /></label>}\n          {token && action !== \"email\" && <label>{text.newPassword}<input name=\"password\" type=\"password\"\n            autoComplete=\"new-password\" minLength={12} maxLength={128} required /></label>}\n          {failure && <p role=\"alert\">{failure}</p>}\n          <button className=\"primary-button\" disabled={pending}>{requesting ? text.send : text.confirm}</button>\n        </form>\n      ) : <p role=\"alert\">{text.expired}</p>}\n    </section>\n  );\n}\n\nexport function AccountSecurity({ locale, persona, assured }: { locale: Locale; persona: Persona; assured: boolean }) {\n  const text = labels[locale];\n  const [factors, setFactors] = useState<z.infer<typeof factor>[] | null>(null);\n  const [setup, setSetup] = useState<z.infer<typeof enrollment> | null>(null);\n  const [pending, setPending] = useState(false);\n  const [failure, setFailure] = useState(\"\");\n  const [sent, setSent] = useState(false);\n  const candidate = setup?.id ?? factors?.find((item) => item.status === \"verified\")?.id;\n  const [reloadFactors, retryFactors] = useState(0);\n\n  useEffect(() => {\n    if (persona !== \"admin\") return;\n    const controller = new AbortController();\n    requestApi(\"/auth/mfa/factors\", z.array(factor), { signal: controller.signal })\n      .then(({ data }) => setFactors(data))\n      .catch((error) => { if (!controller.signal.aborted) setFailure(message(locale, error)); });\n    return () => controller.abort();\n  }, [persona, reloadFactors]);\n\n  async function run(action: () => Promise<void>) {\n    setPending(true);\n    setFailure(\"\");\n    try { await action(); } catch (error) { setFailure(message(locale, error)); }\n    finally { setPending(false); }\n  }\n\n  async function verify(event: FormEvent<HTMLFormElement>) {\n    event.preventDefault();\n    if (!candidate) return;\n    const code = new FormData(event.currentTarget).get(\"code\");\n    await run(async () => {\n      const { data } = await requestApi(\"/auth/mfa/challenge\", challenge, requestBody({ factorId: candidate }));\n      await requestApi(\"/auth/mfa/verify\", sessionSchema, requestBody({ challengeId: data.challengeId, code }));\n      window.location.replace(`/${locale}/school/home`);\n    });\n  }\n\n  async function changeEmail(event: FormEvent<HTMLFormElement>) {\n    event.preventDefault();\n    const input = new FormData(event.currentTarget);\n    await run(async () => {\n      await requestApi(\"/auth/email-change\", accepted, requestBody({\n        newEmail: input.get(\"email\"), reauthProof: input.get(\"password\"),\n      }, persona));\n      setSent(true);\n    });\n  }\n\n  return (\n    <section className=\"auth-card\">\n      {/* Optional German line-break points are presentation only; keep the exact accessible name. */}\n      <h1 aria-label={text.security}>{locale === \"de\" ? text.security.replace(\"Kontosicherheit\", \"Konto\\u00adsicher\\u00adheit\") : text.security}</h1>\n      {persona === \"admin\" && (\n        <section className=\"auth-form\">\n          <h2>{text.verify}</h2>\n          {assured && <p role=\"status\">{text.verified}</p>}\n          {factors === null && failure && <button className=\"plain-button\" onClick={() => retryFactors(reloadFactors + 1)}>{dictionary(locale).retry}</button>}\n          {!candidate && factors && <button className=\"primary-button\" disabled={pending} onClick={() => void run(async () => {\n            setSetup((await requestApi(\"/auth/mfa/enroll\", enrollment, requestBody({}))).data);\n          })}>{text.enroll}</button>}\n          {setup && <div>\n            <p>{text.authApp}</p>\n            <Image src={setup.totp.qrCode} alt={text.qrLabel} width={240} height={240} unoptimized className=\"auth-qr\" />\n            <details><summary>{text.manualKey}</summary><bdi dir=\"ltr\">{setup.totp.secret}</bdi></details>\n          </div>}\n          {candidate && <form className=\"auth-form\" method=\"post\" onSubmit={verify}>\n            <label>{text.code}<input name=\"code\" dir=\"ltr\" inputMode=\"numeric\" autoComplete=\"one-time-code\" pattern=\"[0-9]{6}\" required /></label>\n            <button className=\"primary-button\" disabled={pending}>{text.confirm}</button>\n          </form>}\n        </section>\n      )}\n      {(persona !== \"admin\" || assured) && <form className=\"auth-form\" method=\"post\" onSubmit={changeEmail}>\n        <h2>{text.address}</h2>\n        <label>{text.newEmail}<input name=\"email\" type=\"email\" dir=\"ltr\" autoComplete=\"email\" required /></label>\n        <label>{text.currentPassword}<input name=\"password\" type=\"password\" autoComplete=\"current-password\" required /></label>\n        <button className=\"primary-button\" disabled={pending || sent}>{text.send}</button>\n        {sent && <p role=\"status\">{text.sent}</p>}\n      </form>}\n      {failure && <p role=\"alert\">{failure}</p>}\n    </section>\n  );\n}\n"],["qa/web/ui-visual-polish-p03-security.spec.ts","678920cc84fc77384149a5a57e4bec3b25538c70","import { expect, test } from \"@playwright/test\";\nimport { mkdirSync, writeFileSync } from \"node:fs\";\nimport { schoolFixtures } from \"../fixtures/school\";\nimport { fixtureEmail, localOrigin } from \"../support/target\";\n\nconst baseline = process.env.VISUAL_POLISH_BASELINE === \"1\";\nconst cases = [\n  { actor: \"guardian-de\", persona: \"guardian\", assurance: \"aal1\", locale: \"de\", width: 390, height: 844, scheme: \"light\" },\n  { actor: \"guardian-de\", persona: \"guardian\", assurance: \"aal1\", locale: \"ar\", width: 320, height: 844, scheme: \"dark\" },\n  { actor: \"teacher\", persona: \"teacher\", assurance: \"aal1\", locale: \"ar\", width: 430, height: 932, scheme: \"light\" },\n  { actor: \"teacher\", persona: \"teacher\", assurance: \"aal1\", locale: \"de\", width: 768, height: 1024, scheme: \"dark\" },\n  { actor: \"admin\", persona: \"admin\", assurance: \"aal2\", locale: \"de\", width: 1280, height: 840, scheme: \"light\" },\n  { actor: \"admin\", persona: \"admin\", assurance: \"aal1\", locale: \"ar\", width: 390, height: 844, scheme: \"dark\" },\n] as const;\n\nfor (const scene of cases) {\n  test(`P03 account security ${scene.persona} ${scene.assurance} ${scene.locale} ${scene.width}`, async ({ page, context, browser }) => {\n    const school = schoolFixtures();\n    const folder = `qa-artifacts/visual-polish/P03/security-${scene.persona}-${scene.assurance}-${scene.locale}-${scene.width}/${browser.browserType().name()}/${baseline ? \"before\" : \"after\"}`;\n    mkdirSync(folder, { recursive: true });\n    try {\n      await school.seed();\n      const bearer = await school.bearer(scene.actor, scene.persona);\n      if (scene.persona === \"admin\" && scene.assurance === \"aal1\") {\n        // Use the real local sign-in to obtain an unverified web session for\n        // an already enrolled synthetic admin. No enrollment secret is captured.\n        const login = await context.request.post(localOrigin + \"/api/v1/auth/sign-in\", {\n          headers: { Origin: localOrigin },\n          data: { email: fixtureEmail(school.run, scene.actor), password: school.password },\n        });\n        expect(login.status(), \"synthetic admin sign-in\").toBe(200);\n      } else {\n        // No form is submitted in these read-only visual cases.\n        await context.addCookies([{ name: \"madrasty-session\", value: bearer, url: localOrigin, httpOnly: true, sameSite: \"Lax\" }]);\n      }\n      await page.setViewportSize({ width: scene.width, height: scene.height });\n      await page.emulateMedia({ colorScheme: scene.scheme, reducedMotion: \"reduce\" });\n      const route = `/${scene.locale}/account/security`;\n      expect((await page.goto(route))?.status()).toBe(200);\n      await expect(page).toHaveURL(localOrigin + route);\n      const card = page.locator(\"main .auth-card\");\n      await expect(card.getByRole(\"heading\", { level: 1, name: scene.locale === \"ar\" ? \"أمان الحساب\" : \"Kontosicherheit\", exact: true })).toBeVisible();\n      const otp = card.locator('input[name=\"code\"]');\n      const email = card.locator('input[name=\"email\"]');\n      const password = card.locator('input[name=\"password\"]');\n      if (scene.persona === \"admin\") {\n        await expect(card.getByRole(\"heading\", { level: 2, name: scene.locale === \"ar\" ? \"التحقق بخطوتين\" : \"Zwei-Faktor-Verifizierung\", exact: true })).toBeVisible();\n        await expect(otp).toBeVisible();\n        await expect(otp).toHaveAttribute(\"autocomplete\", \"one-time-code\");\n        await expect(otp).toHaveAttribute(\"dir\", \"ltr\");\n        await expect(otp).toHaveAttribute(\"inputmode\", \"numeric\");\n        if (scene.assurance === \"aal2\") {\n          await expect(card.getByRole(\"status\")).toHaveText(scene.locale === \"ar\" ? \"تم التحقق\" : \"Verifiziert\");\n        } else {\n          await expect(card.getByRole(\"status\")).toHaveCount(0);\n        }\n      } else {\n        await expect(otp).toHaveCount(0);\n      }\n      if (scene.persona === \"admin\" && scene.assurance === \"aal1\") {\n        await expect(email).toHaveCount(0);\n        await expect(password).toHaveCount(0);\n      } else {\n        await expect(email).toBeVisible();\n        await expect(email).toHaveAttribute(\"autocomplete\", \"email\");\n        await expect(email).toHaveAttribute(\"type\", \"email\");\n        await expect(email).toHaveAttribute(\"dir\", \"ltr\");\n        await expect(password).toBeVisible();\n        await expect(password).toHaveAttribute(\"autocomplete\", \"current-password\");\n        await expect(password).toHaveAttribute(\"type\", \"password\");\n      }\n      await expect(card.getByRole(\"alert\")).toHaveCount(0);\n      await page.evaluate(() => document.fonts.ready.then(() => undefined));\n      const measure = () => card.evaluate(el => {\n        const controls = Array.from(el.querySelectorAll(\"input, button\")).filter(node => node.getClientRects().length > 0);\n        const boxes = controls.map(node => node.getBoundingClientRect());\n        const outer = el.getBoundingClientRect();\n        return {\n          controls: boxes.length,\n          minimumTargetHeight: Math.min(...boxes.map(box => box.height)),\n          horizontalOverflow: Math.max(document.documentElement.scrollWidth - innerWidth, el.scrollWidth - el.clientWidth),\n          controlsWithinCard: boxes.every(box => box.left >= outer.left - 1 && box.right <= outer.right + 1),\n          cardRadius: parseFloat(getComputedStyle(el).borderTopLeftRadius),\n        };\n      });\n      const normal = await measure();\n      await page.screenshot({ path: folder + \"/security.png\" });\n      await page.evaluate(() => { document.documentElement.style.fontSize = \"200%\"; });\n      const large = await measure();\n      await page.screenshot({ path: folder + \"/security-text-200.png\" });\n      if (scene.locale === \"de\") {\n        const heading = card.getByRole(\"heading\", { level: 1, name: \"Kontosicherheit\", exact: true });\n        const wrapping = await heading.evaluate(el => {\n          const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);\n          const breaks: number[] = [];\n          let letters = 0, prior: number | undefined;\n          for (let node = walker.nextNode(); node; node = walker.nextNode()) {\n            const text = node.textContent ?? \"\";\n            for (let i = 0; i < text.length; i++) {\n              if (text[i] === \"\\u00ad\") continue;\n              const range = document.createRange();\n              range.setStart(node, i);\n              range.setEnd(node, i + 1);\n              // Chromium can include the preceding discretionary hyphen as\n              // a separate rectangle for the first letter of the next line.\n              const rect = Array.from(range.getClientRects()).filter(rect => rect.width > 0).at(-1);\n              if (!rect) throw new Error(\"Missing heading glyph geometry\");\n              const top = Math.round(rect.top);\n              if (prior !== undefined && prior !== top) breaks.push(letters);\n              prior = top;\n              letters++;\n            }\n          }\n          return { text: el.textContent?.replaceAll(\"\\u00ad\", \"\"), breaks };\n        });\n        expect(wrapping.text).toBe(\"Kontosicherheit\");\n        console.log(\"P03 security heading breaks\", JSON.stringify({ width: scene.width, ...wrapping }));\n        if (!baseline) expect(wrapping.breaks.filter(index => ![3, 5, 7, 11].includes(index))).toEqual([]);\n      }\n      // A vertically scrolling card is valid at 200%; every existing control\n      // must still be reachable without submitting any security change.\n      for (const control of await card.locator(\"input, button\").all()) {\n        if (await control.isVisible()) {\n          await control.scrollIntoViewIfNeeded();\n          await expect(control).toBeInViewport();\n        }\n      }\n      console.log(\"P03 security geometry\", JSON.stringify({ ...scene, normal, large }));\n      writeFileSync(folder + \"/geometry.json\", JSON.stringify({ ...scene, normal, large }, null, 2));\n      for (const result of [normal, large]) {\n        expect(result.controls).toBeGreaterThan(0);\n        expect(result.minimumTargetHeight).toBeGreaterThanOrEqual(44);\n        expect(result.horizontalOverflow).toBeLessThanOrEqual(1);\n        expect(result.controlsWithinCard).toBe(true);\n      }\n      expect(large.controls).toBe(normal.controls);\n      await expect(page).toHaveURL(localOrigin + route);\n    } finally { await school.close(); }\n  });\n}\n"]]'''):
              assert subprocess.check_output(["git","hash-object",name], text=True).strip()==sha, "Unexpected source precondition"
              Path(name).write_text(content)
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          git add -- apps/web/src/features/identity/SecurityForms.tsx qa/web/ui-visual-polish-p03-security.spec.ts docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/features/identity/SecurityForms.tsx qa/web/ui-visual-polish-p03-security.spec.ts docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep German security heading syllables readable at enlarged text"
          git push origin HEAD:refs/heads/visual-polish/premium
