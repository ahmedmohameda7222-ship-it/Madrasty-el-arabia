name: P10 finance navigation intrinsic reflow and registry synchronization
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-p10-nav-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply measured CSS and synchronize registries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          file=Path("apps/web/src/features/finance/FinanceWorkspace.module.css")
          content=file.read_text()
          for old,new in json.loads(r'''[[".financeNav{display:flex;align-items:center;",".financeNav{display:flex;flex-wrap:wrap;align-items:stretch;"],["justify-content:center;flex:1;min-inline-size:0;min-block-size:44px;padding:.35rem .4rem;border-radius:10px;font-size:.82rem;font-weight:600;text-decoration:none;text-align:center;color:var(--ink);line-height:1.2;overflow-wrap:anywhere}","justify-content:center;flex:1 0 auto;min-inline-size:44px;max-inline-size:100%;min-block-size:44px;padding:.35rem .4rem;border-radius:10px;font-size:.82rem;font-weight:600;text-decoration:none;text-align:center;color:var(--ink);line-height:1.2;white-space:normal;overflow-wrap:normal;word-break:normal}"]]'''):
              assert content.count(old)==1, "Unexpected CSS precondition"
              content=content.replace(old,new)
          file.write_text(content)
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          git add -- apps/web/src/features/finance/FinanceWorkspace.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/features/finance/FinanceWorkspace.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep finance navigation words and touch targets intact at large text"
          git push origin HEAD:refs/heads/visual-polish/premium
