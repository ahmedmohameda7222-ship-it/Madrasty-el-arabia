name: Visual polish - isolated native development QA
on:
  push:
    branches: ["visual-polish/premium"]
    paths:
      - "apps/android/**"
      - ".github/workflows/visual-polish-native-development.yml"
permissions:
  contents: read
concurrency:
  group: visual-polish-native-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: compact-320
            size: 640x1688
            density: 320
          - viewport: matched-393
            size: 1080x2340
            density: 440
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"
      - name: Install Android compile platform and build tools
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" || sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Enable KVM for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test production Compose components and signed-out activity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            chmod +x apps/android/gradlew
            set -euo pipefail
            capture_pngs() {
              local stage="$1"
              local dest="qa-artifacts/native-visual-polish/$stage"
              mkdir -p "$dest"
              for remote in /sdcard/Android/data/de.madrasty.app.prelaunch/files/visual-polish/after /sdcard/Download/madrasty-comms-qa /sdcard/Download/madrasty-family-qa /sdcard/Download/madrasty-finance-qa; do
                if adb shell test -d "$remote"; then adb pull "$remote" "$dest/$(basename "$remote")"; fi
              done
            }
            adb shell settings put system font_scale 1.0
            test "$(adb shell settings get system font_scale | tr -d '\r')" = 1.0
            normal_rc=0
            ./apps/android/gradlew -p apps/android :app:testDebugUnitTest :app:assembleDebug :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.visualPolishFontScale=1.0 --no-daemon --stacktrace || normal_rc=$?
            capture_pngs normal
            adb shell rm -rf /sdcard/Android/data/de.madrasty.app.prelaunch/files/visual-polish/after
            adb shell settings put system font_scale 2.0
            test "$(adb shell settings get system font_scale | tr -d '\r')" = 2.0
            adb shell am force-stop de.madrasty.app.prelaunch
            large_rc=0
            ./apps/android/gradlew -p apps/android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=de.madrasty.app.ui.FoundationVisualTest,de.madrasty.app.identity.SignInVisualTest -Pandroid.testInstrumentationRunnerArguments.visualPolishFontScale=2.0 --no-daemon --stacktrace || large_rc=$?
            mkdir -p qa-artifacts/native-visual-polish/large-text
            if adb shell test -d /sdcard/Android/data/de.madrasty.app.prelaunch/files/visual-polish/after; then
              adb pull /sdcard/Android/data/de.madrasty.app.prelaunch/files/visual-polish/after qa-artifacts/native-visual-polish/large-text/after
            fi
            test "$normal_rc" = 0
            test "$large_rc" = 0
            test "$(find qa-artifacts/native-visual-polish/normal -name '*.png' | wc -l)" -gt 0
            test "$(find qa-artifacts/native-visual-polish/large-text -name '*.png' | wc -l)" -gt 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-synthetic-visual-polish-${{ matrix.viewport }}-${{ github.sha }}
          path: qa-artifacts/native-visual-polish/**/*.png
          retention-days: 7
          if-no-files-found: warn
