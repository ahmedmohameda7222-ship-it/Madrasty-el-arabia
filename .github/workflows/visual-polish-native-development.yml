name: Visual polish - isolated native development QA
# Includes scope sheet UI-language regression and previous typography assertions.
on:
  workflow_dispatch:
  push:
    branches: ["visual-polish/premium"]
    paths:
      - "apps/android/**"
      - "qa/native-visual-polish-hosted.sh"
      - ".github/workflows/visual-polish-native-development.yml"
permissions:
  contents: read
concurrency:
  group: visual-polish-native-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - viewport: compact-320
            size: 640x1688
            density: 320
          - viewport: matched-393
            size: 1080x2340
            density: 440
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: "false"
      - name: Install Android compile platform and build tools
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" || sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Enable KVM for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test production Compose components and signed-out activity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell wm size ${{ matrix.size }}
            adb shell wm density ${{ matrix.density }}
            chmod +x apps/android/gradlew
            bash qa/native-visual-polish-hosted.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-synthetic-visual-polish-${{ matrix.viewport }}-${{ github.sha }}
          path: qa-artifacts/native-visual-polish/**/*.png
          retention-days: 7
          if-no-files-found: warn
