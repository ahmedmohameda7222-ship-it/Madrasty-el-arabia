name: Prelaunch web and contracts
on:
  push:
    branches: ["implementation/prelaunch", "fix/workflow-remediation-2026-11-22", "fix/admin-managed-teachers-only-2026-11-22", "feat/calendar-preview-to-app-2026-11-22", "feat/family-first-direct-staff-accounts-2026-11-23", "feat/staff-dark-workflow-class-subject-2026-11-23", "feat/admin-supervision-readonly-2026-11-23"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prelaunch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned pnpm and workspace dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Check TypeScript
        run: pnpm check:types
      - name: Check dashboard wire states
        run: pnpm exec tsx --test --test-name-pattern="dashboard wire contract" qa/contracts/api.test.ts
      - name: Build web application
        run: pnpm build:web
  dashboard-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set disposable runner workspace
        run: echo "LOCALAPPDATA=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.121.0"
      - name: Install pinned pnpm and workspace dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Prepare disposable synthetic database
        run: pwsh -NoProfile -File qa/start-stack.ps1
      - name: Check first-run setup, queues and protected finance records
        shell: bash
        run: |
          pwsh -NoProfile -File qa/local.ps1 -Serve > "$RUNNER_TEMP/madrasty-qa-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 2 --max-time 15 http://127.0.0.1:4300/api/v1/health
          pnpm exec tsx --env-file-if-exists=qa/.env.local --test --test-name-pattern="unconfigured school" qa/contracts/fixtures.test.ts
          pnpm exec tsx --env-file-if-exists=qa/.env.local --test qa/academics/attendance.test.ts
          pnpm qa:finance
  domain-acceptance:
    if: contains(fromJSON('["refs/heads/fix/workflow-remediation-2026-11-22","refs/heads/fix/admin-managed-teachers-only-2026-11-22","refs/heads/feat/calendar-preview-to-app-2026-11-22","refs/heads/feat/family-first-direct-staff-accounts-2026-11-23","refs/heads/feat/staff-dark-workflow-class-subject-2026-11-23"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Bind the disposable QA workspace
        run: echo "LOCALAPPDATA=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.121.0"
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Provision isolated synthetic Auth and PostgreSQL
        run: pwsh -NoProfile -File qa/start-stack.ps1
      - name: Run domain acceptance suites against disposable server
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File qa/local.ps1 -Serve > "$RUNNER_TEMP/madrasty-acceptance-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 25 --retry-connrefused --retry-delay 2 --max-time 15 http://127.0.0.1:4300/api/v1/health
          failures=0
          for suite in contracts school policy academics communication finance ops recovery-email; do
            echo "::group::qa:$suite"
            if pnpm "qa:$suite"; then
              echo "::notice::qa:$suite passed"
            else
              echo "::error::qa:$suite failed"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          echo "Domain suite failures: $failures"
          test "$failures" -eq 0
  android-debug:
    if: contains(fromJSON('["refs/heads/fix/workflow-remediation-2026-11-22","refs/heads/fix/admin-managed-teachers-only-2026-11-22","refs/heads/feat/calendar-preview-to-app-2026-11-22","refs/heads/feat/family-first-direct-staff-accounts-2026-11-23","refs/heads/feat/staff-dark-workflow-class-subject-2026-11-23"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: Install required Android 37 platform and build tools
        shell: bash
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;37.0.0" || \
            sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Kotlin JVM tests and Android debug package
        shell: bash
        run: |
          chmod +x apps/android/gradlew
          ./apps/android/gradlew -p apps/android :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
