t: 3px solid var(--coral);\n  border-radius: var(--radius-inset);\n  background: var(--inset);\n}\n\n.identity-card .auth-form {\n  grid-template-columns: minmax(0, 1fr);\n  gap: 12px;\n}\n\n.identity-card .auth-form > h3 {\n  margin: 0;\n}\n\n.identity-card .auth-form + .auth-form {\n  border-block-start: 1px solid var(--rule);\n  padding-block-start: 16px;\n}\n\n.identity-card :is(select, textarea) {\n  min-block-size: 48px;\n  min-inline-size: 0;\n  padding: 8px 12px;\n  border: 1px solid var(--field-border);\n  border-radius: var(--radius-control);\n  background: var(--canvas);\n  color: var(--ink);\n}\n\n/* Generic terminal presentation follows the document language and system theme.\n   No resource-specific message or navigation is added to the 404 boundary. */\n.entry-not-found {\n  margin-block-start: max(24px, 8vh);\n  padding: clamp(16px, 5vw, 32px);\n  border: 1px solid var(--rule);\n  border-radius: var(--radius-card);\n  background: var(--card);\n  box-shadow: var(--shadow-raised);\n  min-inline-size: 0;\n  overflow-wrap: anywhere;\n}\n.entry-not-found-code {\n  display: inline-block;\n  margin-block-end: 12px;\n  padding: 6px 12px;\n  border-radius: var(--radius-control);\n  background: var(--inset);\n  color: var(--muted);\n  font-size: .875rem;\n  font-weight: 700;\n}\n.entry-not-found h1 { margin-block-end: 8px; }\n.entry-not-found h1 + p { color: var(--muted); }\n.entry-not-found-ar { display: none; }\nhtml[lang=\"ar\"] .entry-not-found-de { display: none; }\nhtml[lang=\"ar\"] .entry-not-found-ar { display: block; }\n"],["docs/visual-polish/INVENTORY.md","bd6d1916b63990013c86070a26159afdf46b21ae","# Complete presentation source and route inventory (baseline)\nBaseline commit: `b90fab0bec705b4bf25eb8e43f4f6f8eaa6de77a`. Generated from the non-truncated Git tree. Counts refer to files and declared route/page patterns, NOT audited screens or passed tests. A route may render many states. Every record starts OPEN. This inventory is the initial coverage 