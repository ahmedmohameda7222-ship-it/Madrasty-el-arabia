name: P09 isolated calendar polish and registry synchronization
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-p09-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply scoped calendar presentation and regenerate registries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          file=Path("apps/web/src/features/school/Calendar.module.css")
          content=file.read_text()
          assert ".smallButton,.arrowButton { min-height: 35px;" in content
          assert "/* Visual polish: retain the approved calendar palette" not in content
          file.write_text(content+"\n\n/* Visual polish: retain the approved calendar palette and day grid. */\n.yearCard,.statCard,.card,.calendarCard,.dayPanel,.upcomingPanel {\n  border-radius: var(--radius-card);\n}\n.modal { border-radius: var(--radius-sheet); }\n.secondary,.smallButton,.arrowButton,.iconButton,.dangerButton,.removeButton,.textAction {\n  min-block-size: 44px;\n  min-inline-size: 44px;\n}\n.secondary,.smallButton,.dangerButton,.removeButton,.field {\n  border-radius: var(--radius-control);\n}\n.arrowButton,.iconButton {\n  inline-size: 44px;\n  block-size: 44px;\n  border-radius: var(--radius-pill);\n}\n.primary,.saveButton {\n  min-block-size: 48px;\n  border-radius: var(--radius-pill);\n}\n.field { min-block-size: 48px; }\n.headActions,.monthActions,.modalActions { min-inline-size: 0; flex-wrap: wrap; }\n.headActions button,.modalActions button {\n  max-inline-size: 100%; white-space: normal; overflow-wrap: anywhere;\n}\n:global([dir=\"rtl\"]) .root .head h1,\n:global([dir=\"rtl\"]) .root .eyebrow { letter-spacing: normal; }\n")
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          git add -- apps/web/src/features/school/Calendar.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/features/school/Calendar.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish calendar card hierarchy and accessible action targets"
          git push origin HEAD:refs/heads/visual-polish/premium
