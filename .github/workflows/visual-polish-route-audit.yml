name: Visual polish - all-role advertised route survey
on:
  push:
    branches: ["visual-polish/premium"]
    paths:
      - ".github/workflows/visual-polish-route-audit.yml"
      - "qa/visual-polish-route-audit.config.ts"
      - "qa/visual-polish-route-audit/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-survey:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.121.0"
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y libnss3-tools
      - name: Start disposable fixture and enable verified transport
        shell: bash
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP"
          echo "LOCALAPPDATA=$RUNNER_TEMP" >> "$GITHUB_ENV"
          pwsh -NoProfile -File qa/start-stack.ps1
          bash -n qa/visual-polish-production-tls.sh
          node --check qa/support/visual-production-proxy.mjs
          bash qa/visual-polish-production-tls.sh
      - name: Build and survey authorized routes against real HTTPS
        shell: bash
        run: |
          set -euo pipefail
          pnpm build:web
          pwsh -NoProfile -File qa/local.ps1 -Serve -Production -ProductionFixtureTls > "$RUNNER_TEMP/madrasty-production-fixture.log" 2>&1 &
          web_pid=$!
          node qa/support/visual-production-proxy.mjs > "$RUNNER_TEMP/madrasty-production-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$web_pid" "$proxy_pid" 2>/dev/null || true' EXIT
          curl --cacert "$NODE_EXTRA_CA_CERTS" -fsS --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 --max-time 10 https://127.0.0.1:4443/api/v1/health
          pnpm exec playwright test --config qa/visual-polish-route-audit.config.ts --browser ${{ matrix.browser }}
      - name: Retain synthetic route survey images and measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-route-survey-${{ matrix.browser }}-${{ github.sha }}
          path: |
            qa-artifacts/visual-polish/route-survey/**/survey.json
            qa-artifacts/visual-polish/route-survey/**/*-normal.png
            qa-artifacts/visual-polish/route-survey/**/*-text-200.png
          retention-days: 7
          if-no-files-found: warn

