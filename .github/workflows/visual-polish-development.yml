name: Visual polish - isolated development QA
# Bank review contrast and timetable coverage retained in the complete visual suite.
on:
  workflow_dispatch:
  push:
    branches: ["visual-polish/premium"]
    paths:
      - "apps/**"
      - "qa/**"
      - "packages/**"
      - ".github/workflows/visual-polish-development.yml"
permissions:
  contents: read
concurrency:
  group: visual-polish-development-${{ github.ref }}
  cancel-in-progress: false
jobs:
  static:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - run: node --test qa/screenshot-audit-policy.test.mjs qa/qa-overlay-policy.test.mjs qa/finance-mobile-ux.test.mjs
      - run: node --test qa/fixtures/visual-polish-fingerprint.test.mjs
      - run: node --test qa/visual-polish-contrast.test.mjs
      - run: node --test qa/visual-polish-evidence.test.mjs
      - run: node qa/fixtures/visual-polish-registry.mjs --check
      - run: pnpm check:types
      - run: pnpm build:web
  visual-fixture:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      QA_SCREENSHOTS_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.121.0"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Start isolated QA stack
        shell: bash
        run: |
          echo "LOCALAPPDATA=$RUNNER_TEMP" >> "$GITHUB_ENV"
          export LOCALAPPDATA="$RUNNER_TEMP"
          df -h / /var/lib/docker
          docker system df
          if ! pwsh -NoProfile -File qa/start-stack.ps1; then
            # Emit fixed classifications only. The raw local startup log may contain credentials.
            log="$RUNNER_TEMP/MadrastyBuild/qa-supabase/start.log"
            if [ -f "$log" ]; then
              for category in 'no space left' 'address already in use' 'port is already allocated' 'out of memory'; do
                if grep -Fqi "$category" "$log"; then printf 'QA startup matched: %s\n' "$category"; fi
              done
            fi
            df -h / /var/lib/docker
            free -m
            ss -ltn | awk 'NR==1 || $4 ~ /:(4300|55420|55421|55422|55424)$/'
            exit 1
          fi
      - name: Run existing and added visual checks against disposable fixtures (including P04–P11 visual, reflow and contrast candidates)
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File qa/local.ps1 -Serve -Turbopack > "$RUNNER_TEMP/madrasty-visual-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 25 --retry-connrefused --retry-delay 2 --max-time 20 http://127.0.0.1:4300/api/v1/health
          pnpm exec tsx --env-file=qa/.env.local -e 'import {schoolFixtures} from "./qa/fixtures/school"; import {setUpCalendar} from "./qa/fixtures/calendar"; (async()=>{const school=schoolFixtures();try{await school.seed();await setUpCalendar(school,await school.bearer("admin","admin"));}finally{await school.close();}})().catch(error=>{console.error(error.message);process.exitCode=1;})'
          if ! pnpm exec playwright test --config qa/visual-polish.config.ts --browser ${{ matrix.browser }}; then
            echo 'Full suite failed; separately diagnose the original P03 routes on the warmed development runtime. The original failure remains a failed job.'
            pnpm exec playwright test --config qa/visual-polish.config.ts --browser ${{ matrix.browser }} --grep 'public entry|public identity form|guardian settings and profile' || true
            exit 1
          fi
      - name: Retain selected synthetic visual evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-polish-synthetic-geometry-${{ matrix.browser }}-${{ github.sha }}
          path: |
            qa-artifacts/visual-polish/P03/security-*/**/security.png
            qa-artifacts/visual-polish/P03/security-*/**/security-text-200.png
            qa-artifacts/visual-polish/P06/**/ready.png
            qa-artifacts/visual-polish/P06/**/ready-text-200.png
            qa-artifacts/visual-polish/P07/**/class-list.png
            qa-artifacts/visual-polish/P07/**/dashboard.png
            qa-artifacts/visual-polish/P07/**/dashboard-text-200.png
            qa-artifacts/visual-polish/P08/**/chat.png
            qa-artifacts/visual-polish/P09/timetable-*/**/timetable-*.png
            qa-artifacts/visual-polish/P09/**/calendar.png
            qa-artifacts/visual-polish/P09/**/calendar-text-200.png
            qa-artifacts/visual-polish/P10/bank-*/**/bank-*.png
            qa-artifacts/visual-polish/P10/**/overview.png
            qa-artifacts/visual-polish/P10/**/invoice.png
            qa-artifacts/visual-polish/P10/**/invoice-text-200.png
            qa-artifacts/visual-polish/P10/**/payer-invoice.png
          if-no-files-found: warn
          retention-days: 7

# Verify shared intrinsic reflow corrections against the existing original checks.
