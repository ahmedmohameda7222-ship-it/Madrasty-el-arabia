name: One-shot visual registry normalization repair
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-registry-sync.yml"]
permissions:
  contents: read
jobs:
  sync:
    if: github.ref == 'refs/heads/visual-polish/premium'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply verified normalization and regenerate discovery documents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("qa/fixtures/visual-polish-registry.mjs")
          text=p.read_text()
          old="(?:ts|tsx|kt|css|html|md|xml|json|svg|js|mjs)"
          new="(?:ts|tsx|kt|css|html|md|xml|json|svg|js|mjs|webmanifest|csv)"
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          grep -F '"sourceFingerprint": "d88fcba9f90a020609c0982d455b84ef36a3f02722068d54bc1ad7a5b45f50da"' docs/visual-polish/SCENES.json
          grep -F '"sourceFingerprint": "d88fcba9f90a020609c0982d455b84ef36a3f02722068d54bc1ad7a5b45f50da"' docs/visual-polish/ELEMENTS.json
          git diff --stat
          expected=$(printf '%s\n' docs/visual-polish/ELEMENTS.json docs/visual-polish/SCENES.json qa/fixtures/visual-polish-registry.mjs | sort)
          actual=$(git diff --name-only | sort)
          test "$actual" = "$expected"
          git add -- docs/visual-polish/ELEMENTS.json docs/visual-polish/SCENES.json qa/fixtures/visual-polish-registry.mjs
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "fix(qa): normalize registry fingerprint across checkouts"
          git push origin HEAD:refs/heads/visual-polish/premium
