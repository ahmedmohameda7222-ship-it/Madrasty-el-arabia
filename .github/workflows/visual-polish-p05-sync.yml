name: P05 isolated staff CSS and registry synchronization
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-p05-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply exact P05 staff CSS replacements and regenerate discovery registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          file = Path("apps/web/src/features/school/StaffWorkspace.module.css")
          content = file.read_text()
          replacements = json.loads(r'''[[".primary, .secondary, .smallButton { min-height:44px; border-radius:12px; border:1px solid transparent; padding:10px 17px; font:inherit; font-weight:640; cursor:pointer; text-decoration:none; text-align:center; }",".primary, .secondary, .smallButton { min-height:44px; border-radius:var(--radius-control); border:1px solid transparent; padding:10px 17px; font:inherit; font-weight:640; cursor:pointer; text-decoration:none; text-align:center; max-inline-size:100%; overflow-wrap:anywhere; }"],[".primary {background:#366f69;color:#fff;border-color:#477d77}",".primary {min-height:48px;border-radius:var(--radius-pill);background:var(--primary);color:var(--on-primary);border-color:transparent}"],[".primary:hover {background:#417e77}",".primary:hover {background:color-mix(in srgb,var(--primary) 92%,var(--on-primary))}"],["font-size:.86rem;min-height:38px;padding:6px 11px;","font-size:.86rem;min-height:44px;padding:6px 11px;"],[".input,.select {width:100%;min-height:46px;border:1px solid var(--rule);background:var(--canvas);color:var(--ink);padding:10px 13px;border-radius:12px;font:inherit; }",".input,.select {width:100%;min-width:0;min-height:48px;border:1px solid var(--field-border);background:var(--canvas);color:var(--ink);padding:10px 13px;border-radius:var(--radius-control);font:inherit; }"],["outline:2px solid #599b91;outline-offset:2px","outline:2px solid var(--primary);outline-offset:2px"],["border-radius:19px;padding:20px;min-width:0;","border-radius:var(--radius-card);padding:20px;min-width:0;"],[".personMeta {font-size:.82rem;color:var(--muted)}",".personMeta {font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}"],[".cardTitle {font-size:1.03rem;font-weight:680;margin:0;letter-spacing:-.006em}",".cardTitle {font-size:1.03rem;font-weight:680;margin:0;letter-spacing:-.006em}\n.title:lang(ar), .cardTitle:lang(ar) {letter-spacing:normal}"],[".details summary {cursor:pointer;font-weight:600}",".details summary {cursor:pointer;font-weight:600;min-block-size:44px;padding-block:10px;overflow-wrap:anywhere}"]]''')
          for old, new in replacements:
              assert content.count(old) == 1, "Unexpected CSS precondition"
              content = content.replace(old, new)
          file.write_text(content)
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          git add -- apps/web/src/features/school/StaffWorkspace.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/features/school/StaffWorkspace.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish staff workspace and provision controls with shared tokens"
          git push origin HEAD:refs/heads/visual-polish/premium
