name: P04 isolated source and registry synchronization
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-p04-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply exact P04 CSS replacements and regenerate discovery registry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          file = Path("apps/web/src/app/school.css")
          content = file.read_text()
          replacements = json.loads(r'''[[".more-group summary {font-weight:700;cursor:pointer;list-style:none}",".more-group summary {font-weight:700;font-size:1.125rem;line-height:1.45;cursor:pointer;list-style:none;overflow-wrap:anywhere}"],[".more-row {border-block-start:1px solid var(--rule);text-decoration:none;color:inherit}",".more-row {border-block-start:1px solid var(--rule);text-decoration:none;color:inherit;overflow-wrap:anywhere}"],[".home-dashboard-card > :is(p, .group-list) { margin-block-end: 8px; }",".home-dashboard-card > :is(p, .group-list) { margin-block-end: 8px; }\n.home-dashboard-card > .plain-button {\n  min-block-size: 48px; border-radius: var(--radius-pill); padding-inline: 20px;\n  max-inline-size: 100%; overflow-wrap: anywhere;\n}\n.home-dashboard-card .group-row {\n  display: grid; grid-template-columns: minmax(0, 1fr) 10px;\n  row-gap: 3px; align-items: center; padding-block: 10px;\n  text-decoration: none; overflow-wrap: anywhere;\n}\n.home-dashboard-card .group-row > bdi { font-weight: 650; }\n.home-dashboard-card .group-row small { grid-column: 1; color: var(--muted); }\n.home-dashboard-card .group-row::after {\n  content: \"\"; grid-column: 2; grid-row: 1 / span 2;\n  inline-size: 7px; block-size: 7px;\n  border-inline-end: 2px solid var(--primary); border-block-start: 2px solid var(--primary);\n  transform: rotate(45deg);\n}\n[dir=\"rtl\"] .home-dashboard-card .group-row::after { transform: rotate(-45deg); }\n.home-dashboard-card .group-row:focus-visible { outline-offset: -3px; }\n.home-dashboard-card .timetable-session {\n  display: grid; grid-template-columns: minmax(0, 1fr);\n  gap: 4px; padding: 10px 16px; overflow-wrap: anywhere;\n}\n.home-dashboard-card .timetable-session > bdi:first-child {\n  color: var(--muted); font-variant-numeric: tabular-nums; font-size: .875rem;\n}\n.home-dashboard-card .timetable-session > bdi:nth-child(2) { font-weight: 650; }"]]''')
          for old, new in replacements:
              assert content.count(old) == 1, "Unexpected CSS precondition"
              content = content.replace(old, new)
          file.write_text(content)
          PY
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          git add -- apps/web/src/app/school.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/app/school.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish P04 dashboard and More visual hierarchy"
          git push origin HEAD:refs/heads/visual-polish/premium
