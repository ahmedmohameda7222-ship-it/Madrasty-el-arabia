name: Visual polish - original domain acceptance
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-domain-development.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  domain-acceptance:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Bind the disposable QA workspace
        run: echo "LOCALAPPDATA=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.121.0"
      - name: Install pinned dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Provision isolated synthetic Auth and PostgreSQL
        run: pwsh -NoProfile -File qa/start-stack.ps1
      - name: Run domain acceptance suites against disposable server
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File qa/local.ps1 -Serve > "$RUNNER_TEMP/madrasty-acceptance-web.log" 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 25 --retry-connrefused --retry-delay 2 --max-time 15 http://127.0.0.1:4300/api/v1/health
          failures=0
          for suite in contracts school policy academics communication finance ops recovery-email; do
            echo "::group::qa:$suite"
            if pnpm "qa:$suite"; then
              echo "::notice::qa:$suite passed"
            else
              echo "::error::qa:$suite failed"
              failures=$((failures+1))
            fi
            echo "::endgroup::"
          done
          echo "Domain suite failures: $failures"
          test "$failures" -eq 0
      - name: Show sanitized domain API diagnostics on failure
        if: failure()
        shell: bash
        run: grep -E 'API request failed|Finance PDF stage' "$RUNNER_TEMP/madrasty-acceptance-web.log" || true
