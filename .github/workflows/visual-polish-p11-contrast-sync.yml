name: P11 measured calendar contrast and registry synchronization
on:
  push:
    branches: ["visual-polish/premium"]
    paths: [".github/workflows/visual-polish-p11-contrast-sync.yml"]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.ref == 'refs/heads/visual-polish/premium'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Confirm baseline contrast failure
        run: |
          if node --test qa/visual-polish-contrast.test.mjs; then
            echo "Expected measured baseline contrast failure was not reproduced"
            exit 1
          fi
      - run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Apply exact CSS and verify contrast, then synchronize registries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name, changes in json.loads(r'''{"apps/web/src/features/school/Calendar.module.css":[["--c-muted: #72847d;","--c-muted: #536a61;"],["--c-accent: #12836a;","--c-accent: #08705b;"],["--c-danger: #b85249;","--c-danger: #a53e36;"],[".field { width: 100%; min-width: 0; min-height: 42px; border: 1px solid var(--c-border);",".field { width: 100%; min-width: 0; min-height: 42px; border: 1px solid var(--field-border);"]],"apps/web/src/app/school.css":[[".school-content > h1 { overflow-wrap: anywhere; }",".school-content > h1 { overflow-wrap: anywhere; }\nhtml[lang=\"de\"] .school-content > h1 { hyphens: auto; }"]],"apps/web/src/features/school/AdminClassMonitor.module.css":[[".header p{font-size:.9rem;",":global(html[lang=\"de\"]) .header h1{hyphens:auto}\n.header p{font-size:.9rem;"]]}''').items():
              file=Path(name)
              content=file.read_text()
              for old,new in changes:
                  assert content.count(old)==1, "Unexpected CSS precondition"
                  content=content.replace(old,new)
              file.write_text(content)
          PY
          node --test qa/visual-polish-contrast.test.mjs
          node qa/fixtures/visual-polish-registry.mjs
          node qa/fixtures/visual-polish-registry.mjs --check
          git add -- apps/web/src/features/school/Calendar.module.css apps/web/src/app/school.css apps/web/src/features/school/AdminClassMonitor.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' apps/web/src/features/school/Calendar.module.css apps/web/src/app/school.css apps/web/src/features/school/AdminClassMonitor.module.css docs/visual-polish/SCENES.json docs/visual-polish/ELEMENTS.json | sort)"
          test "$actual" = "$expected"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Improve calendar light-text contrast and German heading wrapping"
          git push origin HEAD:refs/heads/visual-polish/premium
