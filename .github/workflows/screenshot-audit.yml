name: Isolated UI screenshot retry (failed routes only)
# Rerun only on explicit dispatch; code fixes must not silently repeat the costly screenshot pass.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ui-retry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshot-retry:
    name: retry-${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [admin-de, teacher-de, guardian-ar, guardian-de]
    env:
      QA_SCREENSHOTS_ONLY: "1"
      QA_AUDIT_RETRY_TARGETS: qa-artifacts/retry-targets.json
      QA_AUDIT_VERIFIED_DENIALS: qa-artifacts/verified-denials.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.121.0"
      - name: Install pinned workspace dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Test QA failure classification and retry selection
        run: node --test qa/screenshot-audit-policy.test.mjs qa/screenshot-retry-targets.test.mjs
      - name: Download saved admin and teacher results (do not recapture successful pages)
        uses: actions/download-artifact@v4
        with:
          name: madrasty-ui-audit-screenshots
          run-id: 44878617957
          github-token: ${{ github.token }}
          path: qa-artifacts/previous-admin-teacher
      - name: Download saved guardian results (do not recapture successful pages)
        uses: actions/download-artifact@v4
        with:
          name: madrasty-ui-audit-guardian-screenshots
          run-id: 44881108800
          github-token: ${{ github.token }}
          path: qa-artifacts/previous-guardian
      - name: Generate exact retry list from archived manifests
        run: |
          node qa/screenshot-retry-targets.mjs qa-artifacts/retry-targets.json             qa-artifacts/previous-admin-teacher/screenshots/*/manifest.json             qa-artifacts/previous-guardian/screenshots/*/manifest.json
          node -e 'const t=require("./qa-artifacts/retry-targets.json"); const n=Object.values(t).flat().length; if(n!==112) throw new Error("Expected 108 archived failures plus 4 mobile regression views; got "+n); console.log("Targeted attempts:",n)'
      - name: Install headless Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated synthetic Supabase
        shell: bash
        run: |
          echo "LOCALAPPDATA=$RUNNER_TEMP" >> "$GITHUB_ENV"
          export LOCALAPPDATA="$RUNNER_TEMP"
          pwsh -NoProfile -File qa/start-stack.ps1
      - name: Start Next.js fixture web server
        shell: bash
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP"
          pwsh -NoProfile -File qa/local.ps1 -Serve > "$RUNNER_TEMP/madrasty-screenshot-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/madrasty-screenshot-server.pid"
          curl -fsS --retry 25 --retry-connrefused --retry-delay 2 --max-time 20 http://127.0.0.1:4300/api/v1/health
      - name: Capture only the selected retry group
        shell: bash
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP"
          case "${{ matrix.suite }}" in
            admin-de) pattern="Screenshots: admin / de" ;;
            teacher-de) pattern="Screenshots: teacher / de" ;;
            guardian-ar) pattern="Screenshots: guardian / ar" ;;
            guardian-de) pattern="Screenshots: guardian / de" ;;
            *) echo "Unsupported suite" >&2; exit 1 ;;
          esac
          pnpm exec playwright test --config qa/screenshot-audit.config.ts --grep "$pattern"
      - name: Preserve local server diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p qa-artifacts/server
          if [ -f "$RUNNER_TEMP/madrasty-screenshot-server.log" ]; then
            cp "$RUNNER_TEMP/madrasty-screenshot-server.log" qa-artifacts/server/next-server.log
          else
            echo "Server log was not created" > qa-artifacts/server/next-server.log
          fi
          if curl -fsS --max-time 8 http://127.0.0.1:4300/api/v1/health > qa-artifacts/server/last-health.json; then
            echo "Local server still healthy"
          else
            printf '%s\n' '{"status":"unreachable"}' > qa-artifacts/server/last-health.json
          fi
      - name: Upload only retried screenshots, manifests, and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madrasty-ui-audit-retry-${{ matrix.suite }}
          path: |
            qa-artifacts/screenshots/
            qa-artifacts/retry-targets.json
            qa-artifacts/verified-denials.json
            qa-artifacts/playwright-results.json
            qa-artifacts/test-results/
            qa-artifacts/server/
          if-no-files-found: warn
          retention-days: 7
