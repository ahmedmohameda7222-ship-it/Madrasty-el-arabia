name: Isolated UI screenshot audit
on:
  push:
    branches:
      - audit/playwright-screenshots-2026-11-21
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshot-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      QA_SCREENSHOTS_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: supabase/setup-cli@v1
        with:
          version: "2.121.0"
      - name: Install pinned workspace dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Install headless Chromium with Linux dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated fixture Supabase (not the live school)
        shell: bash
        run: |
          echo "LOCALAPPDATA=$RUNNER_TEMP" >> "$GITHUB_ENV"
          export LOCALAPPDATA="$RUNNER_TEMP"
          pwsh -NoProfile -File qa/start-stack.ps1
      - name: Start local Next.js server with synthetic fixture bindings
        shell: bash
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP"
          pwsh -NoProfile -File qa/local.ps1 -Serve > "$RUNNER_TEMP/madrasty-screenshot-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/madrasty-screenshot-server.pid"
          curl -fsS --retry 25 --retry-connrefused --retry-delay 2 --max-time 20 http://127.0.0.1:4300/api/v1/health
      # The admin/teacher captures are preserved in artifact 14697767436
      # of run 44878617957; intentionally do not re-run those 4 suites.
      - name: Capture guardian pages only (Arabic and German)
        shell: bash
        run: |
          export LOCALAPPDATA="$RUNNER_TEMP"
          set +e
          pnpm exec playwright test --config qa/screenshot-audit.config.ts --grep "Screenshots: guardian"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Guardian screenshot suite failed with exit code $status"
            curl -fsS --max-time 8 http://127.0.0.1:4300/api/v1/health || echo "Local QA web server unavailable during failure inspection"
          fi
          exit "$status"
      - name: Preserve local server diagnostics, even after a failed test
        if: always()
        shell: bash
        run: |
          mkdir -p qa-artifacts/server
          if [ -f "$RUNNER_TEMP/madrasty-screenshot-server.log" ]; then
            cp "$RUNNER_TEMP/madrasty-screenshot-server.log" qa-artifacts/server/next-server.log
            echo "Server diagnostics retained in artifact (synthetic local QA only)."
          else
            echo "Server log was not created" > qa-artifacts/server/next-server.log
          fi
          if curl -fsS --max-time 8 http://127.0.0.1:4300/api/v1/health > qa-artifacts/server/last-health.json; then
            echo "Final local server health: reachable"
          else
            echo "Final local server health: unreachable"
            printf '%s\n' '{"status":"unreachable"}' > qa-artifacts/server/last-health.json
          fi
      - name: Upload guardian-only screenshots and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madrasty-ui-audit-guardian-screenshots
          path: |
            qa-artifacts/screenshots/
            qa-artifacts/playwright-results.json
            qa-artifacts/test-results/
            qa-artifacts/server/
          if-no-files-found: warn
          retention-days: 7
