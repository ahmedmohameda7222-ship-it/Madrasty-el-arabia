components:
  securitySchemes:
    nativeBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webSession:
      type: apiKey
      in: cookie
      name: __Host-madrasty-session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 2048 }
  schemas:
    Persona:
      type: string
      enum: [admin, teacher, guardian]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, messageKey, requestId]
          properties:
            code: { type: string, minLength: 1 }
            messageKey: { type: string, minLength: 1 }
            requestId: { type: string, format: uuid }
            fields:
              type: object
              additionalProperties: { type: string }
  responses:
    Internal:
      description: An unexpected failure occurred.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: internal
              messageKey: error.internal
              requestId: 8be4af5c-9498-4b42-88b0-5ae5b85e7ea2
    Session:
      description: Active school session. Web sign-in and refresh also set HttpOnly cookies.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [accountId, sessionId, personas, activePersona, assurance, expiresAt]
                properties:
                  accountId: { type: string, format: uuid }
                  sessionId: { type: string, format: uuid }
                  personas:
                    type: array
                    items: { $ref: '#/components/schemas/Persona' }
                  activePersona: { $ref: '#/components/schemas/Persona' }
                  assurance: { type: string, enum: [aal1, aal2] }
                  expiresAt: { type: string, format: date-time }
          example:
            data:
              accountId: 07f9999d-5dc2-479d-9c18-bf524b0fd11e
              sessionId: 2d71a427-2ffa-4740-bfa4-308f34973fd0
              personas: [teacher, guardian]
              activePersona: guardian
              assurance: aal1
              expiresAt: '2026-11-19T22:00:00.000Z'
    AuthError:
      description: Authentication, input, authorization or availability failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: unauthenticated
              messageKey: error.unauthenticated
              requestId: 8be4af5c-9498-4b42-88b0-5ae5b85e7ea2
