openapi: 3.1.0
info:
  title: Madrasty El Arabia API
  version: 1.0.0
  description: >
    The v1 contract is additive. Breaking changes require a versioned route.
    Clients ignore unknown response properties and handle unknown error keys generically.
servers:
  - url: /api/v1
x-madrasty-generated-models: [SchoolResourceKind, SchoolResourceLink, AndroidClientVersions]
x-madrasty-generated-operations: [resolveSchoolResourceLink, getClientVersions]
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read the public API version
      responses:
        '200':
          description: API handler ready
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, apiVersion]
                    properties:
                      status: { const: ok }
                      apiVersion: { const: v1 }
              example: { data: { status: ok, apiVersion: v1 } }
        '500':
          $ref: '#/components/responses/Internal'
  /auth/config:
    get:
      operationId: getNativeAuthConfig
      responses:
        '200':
          description: Public Auth settings for the school origin
          content:
            application/json:
              example: { data: { origin: 'https://project.supabase.co', publishableKey: 'sb_publishable_example' } }
        '503':
          $ref: '#/components/responses/AuthError'
  /auth/sign-in:
    post:
      operationId: signInWeb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/AuthError'
  /auth/session:
    get:
      operationId: getSession
      security: [{ webSession: [] }, { nativeBearer: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/AuthError'
    post:
      operationId: refreshWebSession
      description: Same-origin refresh using the HttpOnly refresh cookie and the CSRF header.
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/AuthError'
  /auth/persona:
    post:
      operationId: switchPersona
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - name: X-School-Persona
          in: header
          required: true
          schema: { $ref: '#/components/schemas/Persona' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [persona]
              properties:
                persona: { $ref: '#/components/schemas/Persona' }
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/AuthError'
  /auth/sign-out:
    post:
      operationId: signOut
      security: [{ webSession: [] }, { nativeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allDevices]
              properties:
                allDevices: { type: boolean }
      responses:
        '204':
          description: School session access revoked
        default:
          $ref: '#/components/responses/AuthError'
  /auth/revocation-ticket:
    post:
      operationId: issueNativeRevocationTicket
      security: [{ nativeBearer: [] }]
      responses:
        '200':
          description: Short-scope credential allowing session revocation only
          content:
            application/json:
              example: { data: { ticket: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' } }
        default:
          $ref: '#/components/responses/AuthError'
  /auth/revoke:
    post:
      operationId: reconcileNativeSignOut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, allDevices]
              properties:
                ticket: { type: string, pattern: '^[a-f0-9]{64}$' }
                allDevices: { type: boolean }
      responses:
        '204':
          description: School session access revoked
        default:
          $ref: '#/components/responses/AuthError'
  /auth/recovery/request:
    post:
      operationId: requestRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["email","locale"],"properties":{"email":{"type":"string","format":"email"},"locale":{"type":"string","enum":["ar","de"]}}}
      responses:
        '202':
          description: Accepted and scoped response
          content:
            application/json:
              example: {"data":{"accepted":true}}
        default:
          $ref: '#/components/responses/AuthError'
  /auth/recovery/complete:
    post:
      operationId: completeRecovery
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["challenge","newPassword"],"properties":{"challenge":{"type":"string"},"newPassword":{"type":"string","minLength":12,"maxLength":128}}}
      responses:
        '204':
          description: Completed
        default:
          $ref: '#/components/responses/AuthError'
  /auth/bootstrap/complete:
    post:
      operationId: completeInitialActivation
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["challenge","newPassword"],"properties":{"challenge":{"type":"string"},"newPassword":{"type":"string","minLength":12,"maxLength":128}}}
      responses:
        '204':
          description: Completed
        default:
          $ref: '#/components/responses/AuthError'
  /auth/email-change:
    post:
      operationId: requestEmailChange
      security: [{ webSession: [] }, { nativeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["newEmail","reauthProof"],"properties":{"newEmail":{"type":"string","format":"email"},"reauthProof":{"type":"string"}}}
      responses:
        '202':
          description: Accepted and scoped response
          content:
            application/json:
              example: {"data":{"accepted":true}}
        default:
          $ref: '#/components/responses/AuthError'
  /auth/email-change/confirm:
    post:
      operationId: confirmEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["challenge"],"properties":{"challenge":{"type":"string"}}}
      responses:
        '204':
          description: Completed
        default:
          $ref: '#/components/responses/AuthError'
  /auth/mfa/factors:
    get:
      operationId: listMfaFactors
      security: [{ webSession: [] }, { nativeBearer: [] }]
      responses:
        '200':
          description: Accepted and scoped response
          content:
            application/json:
              example: {"data":[{"id":"2d71a427-2ffa-4740-bfa4-308f34973fd0","factor_type":"totp","status":"verified","friendly_name":"Authenticator"}]}
        default:
          $ref: '#/components/responses/AuthError'
  /auth/mfa/enroll:
    post:
      operationId: enrollMfa
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","properties":{}}
      responses:
        '201':
          description: Accepted and scoped response
          content:
            application/json:
              example: {"data":{"id":"2d71a427-2ffa-4740-bfa4-308f34973fd0","totp":{"secret":"EXAMPLE","uri":"otpauth://totp/example","qrCode":"data:image/svg+xml;base64,PHN2Zy8+"}}}
        default:
          $ref: '#/components/responses/AuthError'
  /auth/mfa/challenge:
    post:
      operationId: createMfaChallenge
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["factorId"],"properties":{"factorId":{"type":"string","format":"uuid"}}}
      responses:
        '201':
          description: Accepted and scoped response
          content:
            application/json:
              example: {"data":{"challengeId":"2d71a427-2ffa-4740-bfa4-308f34973fd0"}}
        default:
          $ref: '#/components/responses/AuthError'
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["challengeId","code"],"properties":{"challengeId":{"type":"string","format":"uuid"},"code":{"type":"string","pattern":"^[0-9]{6}$"}}}
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/AuthError'
  /auth/capabilities:
    get:
      operationId: listCurrentCapabilities
      security: [{ webSession: [] }, { nativeBearer: [] }]
      responses:
        '200':
          description: Accepted and scoped response
          content:
            application/json:
              example: {"data":["school.manage"]}
        default:
          $ref: '#/components/responses/AuthError'
  /staff/access-targets:
    get:
      operationId: listAccessTargets
      security: [{ webSession: [] }, { nativeBearer: [] }]
      responses:
        '200':
          description: Accepted and scoped response
          content:
            application/json:
              example: {"data":[{"accountId":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","email":"teacher@example.invalid"}]}
        default:
          $ref: '#/components/responses/AuthError'
  /staff/{id}/grants:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getStaffGrants
      security: [{ webSession: [] }, { nativeBearer: [] }]
      responses:
        '200':
          description: Accepted and scoped response
          content:
            application/json:
              example: {"data":{"accountId":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","email":"teacher@example.invalid","verifiedMfa":false,"revision":1,"personas":["teacher"],"capabilities":[],"inboxAssignments":[]}}
        default:
          $ref: '#/components/responses/AuthError'
    patch:
      operationId: replaceStaffGrants
      security: [{ webSession: [] }, { nativeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["revision","personas","capabilities","inboxAssignments"],"properties":{"revision":{"type":"integer","minimum":1},"personas":{"type":"array","items":{"type":"string","enum":["admin","teacher","guardian"]}},"capabilities":{"type":"array","items":{"type":"object","required":["key","validFrom","validUntil"],"properties":{"key":{"type":"string","enum":["access.manage","school.manage","students.manage","applications.manage","attendance.supervise","academics.supervise","comms.publish","finance.read","finance.issue","finance.post","finance.export","bank.configure"]},"validFrom":{"type":"string","format":"date-time"},"validUntil":{"type":["string","null"],"format":"date-time"}}}},"inboxAssignments":{"type":"array","items":{"type":"object","required":["key","validFrom","validUntil"],"properties":{"key":{"type":"string","enum":["student_affairs","accounts"]},"validFrom":{"type":"string","format":"date-time"},"validUntil":{"type":["string","null"],"format":"date-time"}}}}}}
      responses:
        '200':
          description: Accepted and scoped response
          content:
            application/json:
              example: {"data":{"accountId":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","email":"teacher@example.invalid","verifiedMfa":false,"revision":2,"personas":["teacher"],"capabilities":[],"inboxAssignments":[]}}
        default:
          $ref: '#/components/responses/AuthError'
  /staff/{id}/deactivate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: deactivateStaff
      security: [{ webSession: [] }, { nativeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["scope","reason","revision"],"properties":{"scope":{"type":"string","enum":["staff","account"]},"reason":{"type":"string","minLength":4,"maxLength":400},"revision":{"type":"integer","minimum":1}}}
      responses:
        '200':
          description: Accepted and scoped response
          content:
            application/json:
              example: {"data":{"revision":3}}
        default:
          $ref: '#/components/responses/AuthError'
  /school/settings:
    get:
      operationId: getSchoolSettings
      security: [{ webSession: [] }, { nativeBearer: [] }]
      responses:
        '200':
          description: Authorized school calendar result
          content:
            application/json:
              example: {"data":{"timezone":"Europe/Berlin","nameAr":"مدرسة تجريبية","nameDe":"Beispielschule","currency":"EUR","dueDay":1,"revision":1}}
        default:
          $ref: '#/components/responses/AuthError'
    patch:
      operationId: putSchoolSettings
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["timezone","nameAr","nameDe","currency","dueDay","revision"],"properties":{"timezone":{"type":"string"},"nameAr":{"type":"string"},"nameDe":{"type":"string"},"currency":{"type":"string","pattern":"^[A-Z]{3}$"},"dueDay":{"type":"integer","minimum":1,"maximum":31},"revision":{"type":"integer","minimum":0}}}
      responses:
        '200':
          description: Authorized school calendar result
          content:
            application/json:
              example: {"data":{"timezone":"Europe/Berlin","nameAr":"مدرسة تجريبية","nameDe":"Beispielschule","currency":"EUR","dueDay":1,"revision":1}}
        default:
          $ref: '#/components/responses/AuthError'
  /school/years:
    get:
      operationId: getSchoolYears
      security: [{ webSession: [] }, { nativeBearer: [] }]
      responses:
        '200':
          description: Authorized school calendar result
          content:
            application/json:
              example: {"data":[{"id":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","startsOn":"2026-08-01","endsExclusive":"2027-08-01","state":"active","teachingWeekdays":[1,2,3,4,5],"revision":1}]}
        default:
          $ref: '#/components/responses/AuthError'
    post:
      operationId: createSchoolYear
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["startsOn","endsExclusive","state","teachingWeekdays"],"properties":{"startsOn":{"type":"string","format":"date"},"endsExclusive":{"type":"string","format":"date"},"state":{"type":"string","enum":["draft","active","closed"]},"teachingWeekdays":{"type":"array","minItems":1,"maxItems":7,"uniqueItems":true,"items":{"type":"integer","minimum":1,"maximum":7}}}}
      responses:
        '201':
          description: Authorized school calendar result
          content:
            application/json:
              example: {"data":{"id":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","startsOn":"2026-08-01","endsExclusive":"2027-08-01","state":"active","teachingWeekdays":[1,2,3,4,5],"revision":1}}
        '200':
          description: Replayed authorized creation
          content:
            application/json:
              example: {"data":{"id":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","startsOn":"2026-08-01","endsExclusive":"2027-08-01","state":"active","teachingWeekdays":[1,2,3,4,5],"revision":1}}
        default:
          $ref: '#/components/responses/AuthError'
  /school/years/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateSchoolYear
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["startsOn","endsExclusive","state","teachingWeekdays","revision"],"properties":{"startsOn":{"type":"string","format":"date"},"endsExclusive":{"type":"string","format":"date"},"state":{"type":"string","enum":["draft","active","closed"]},"teachingWeekdays":{"type":"array","minItems":1,"maxItems":7,"uniqueItems":true,"items":{"type":"integer","minimum":1,"maximum":7}},"revision":{"type":"integer","minimum":0}}}
      responses:
        '200':
          description: Authorized school calendar result
          content:
            application/json:
              example: {"data":{"id":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","startsOn":"2026-08-01","endsExclusive":"2027-08-01","state":"active","teachingWeekdays":[1,2,3,4,5],"revision":1}}
        default:
          $ref: '#/components/responses/AuthError'
  /school/years/{id}/days:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listSchoolDayExceptions
      security: [{ webSession: [] }, { nativeBearer: [] }]
      responses:
        '200':
          description: Authorized school calendar result
          content:
            application/json:
              example: {"data":[{"id":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","yearId":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","schoolDate":"2026-11-19","classId":null,"teaching":false,"reason":"Calendar exception","revision":1}]}
        default:
          $ref: '#/components/responses/AuthError'
  /school/years/{id}/days/{date}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: date, in: path, required: true, schema: { type: string, format: date } }
    put:
      operationId: upsertSchoolDayException
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {"type":"object","required":["teaching","reason","revision"],"properties":{"classId":{"type":["string","null"],"format":"uuid"},"teaching":{"type":"boolean"},"reason":{"type":"string","maxLength":400},"revision":{"type":"integer","minimum":0}}}
      responses:
        '200':
          description: Authorized school calendar result
          content:
            application/json:
              example: {"data":{"id":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","yearId":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","schoolDate":"2026-11-19","classId":null,"teaching":false,"reason":"Calendar exception","revision":1}}
        default:
          $ref: '#/components/responses/AuthError'
    delete:
      operationId: deleteSchoolDayException
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [revision], properties: {classId: {type: [string, 'null'], format: uuid}, revision: {type: integer, minimum: 0}}}
      responses:
        '200':
          description: School-day override removed; original weekly calendar applies
          content:
            application/json:
              example: {"data":{"id":"07f9999d-5dc2-479d-9c18-bf524b0fd11e","deleted":true}}
        default:
          $ref: '#/components/responses/AuthError'
  /school/oversight:
    get:
      operationId: listAdminClassOversight
      summary: Read-only per-class attendance and academic monitoring for authorized administrators
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: School-local date, defaults to today
      responses:
        '200':
          description: Class-level aggregates with no student identifying data, restricted by the administrator's capabilities
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [date, classes]
                    properties:
                      date: { type: string, format: date }
                      classes:
                        type: array
                        items:
                          type: object
                          required: [classId, yearId, classCode, classNameAr, classNameDe, teacherName, attendanceState, unmarkedCount, teachingEntries, activeHomework, upcomingExams, markedExamResults]
                          properties:
                            classId: { type: string, format: uuid }
                            yearId: { type: string, format: uuid }
                            classCode: { type: string }
                            classNameAr: { type: string }
                            classNameDe: { type: string }
                            teacherName: { type: [string, 'null'] }
                            attendanceState: { type: [string, 'null'], enum: [not_started, open, approved, null] }
                            unmarkedCount: { type: [integer, 'null'], minimum: 0 }
                            teachingEntries: { type: [integer, 'null'], minimum: 0 }
                            activeHomework: { type: [integer, 'null'], minimum: 0 }
                            upcomingExams: { type: [integer, 'null'], minimum: 0 }
                            markedExamResults: { type: [integer, 'null'], minimum: 0 }
        default:
          $ref: '#/components/responses/AuthError'
  /school/families:
    post:
      operationId: createFamilyWithChildren
      summary: Create guardians and at least one child transactionally, with optional class per child
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guardians, children]
              properties:
                guardians:
                  type: array
                  minItems: 1
                  maxItems: 2
                  items:
                    type: object
                    required: [displayName, contactEmail, contactPhone, correspondenceLocale]
                    properties:
                      displayName: { type: string, minLength: 1, maxLength: 200 }
                      contactEmail: { type: [string, 'null'], format: email }
                      contactPhone: { type: [string, 'null'] }
                      correspondenceLocale: { type: string, enum: [ar, de] }
                children:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items:
                    type: object
                    required: [displayName]
                    properties:
                      displayName: { type: string, minLength: 1, maxLength: 200 }
                      classId: { type: [string, 'null'], format: uuid, description: Optional }
      responses:
        '201':
          description: Family, guardian identifiers, and children created atomically
          content:
            application/json:
              example: { data: { guardianIds: [2d71a427-2ffa-4740-bfa4-308f34973fd0], children: [{ id: 07f9999d-5dc2-479d-9c18-bf524b0fd11e, studentNumber: MA-000001, displayName: Omar, state: active, revision: 1 }] } }
        '200':
          description: Same idempotent request replayed
        default:
          $ref: '#/components/responses/AuthError'
  /school/families/{id}/children:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addChildToExistingFamily
      summary: Add a child to an existing family, with optional class
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [displayName], properties: { displayName: { type: string }, classId: { type: [string, 'null'], format: uuid } } }
      responses:
        '201':
          description: Child linked to the selected guardian
        '200':
          description: Replayed request
        default:
          $ref: '#/components/responses/AuthError'
  /school/guardians/{id}/invitations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listGuardianInvitationsInFamily
      summary: Display parent invitation status in the family record
      security: [{ webSession: [] }, { nativeBearer: [] }]
      responses:
        '200':
          description: Recent guardian-only invitations
        default:
          $ref: '#/components/responses/AuthError'
  /staff/provision:
    post:
      operationId: provisionDirectStaffAccount
      summary: Create Lehrkraft or Hauptadmin-authorized Admin account without an invitation
      security: [{ webSession: [] }, { nativeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, displayName, email, password]
              properties:
                role: { type: string, enum: [teacher, admin] }
                displayName: { type: string, minLength: 1 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12, writeOnly: true }
                workPhone: { type: [string, 'null'] }
                correspondenceLocale: { type: string, enum: [ar, de] }
                capabilities: { type: array, items: { type: string }, uniqueItems: true }
      responses:
        '201':
          description: Ready-to-login Auth and staff account identifiers
        default:
          $ref: '#/components/responses/AuthError'
  /school/students:
    get:
      operationId: listStudents
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
