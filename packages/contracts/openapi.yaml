    AccountPreferences:
      type: object
      required: [uiLocale, correspondenceLocale, theme, revision]
      properties:
        uiLocale: { type: string, enum: [ar, de] }
        correspondenceLocale: { type: string, enum: [ar, de] }
        theme: { type: string, enum: [system, light, dark] }
        revision: { type: integer, minimum: 0 }
    DirectoryId:
      anyOf:
        - { type: string, format: uuid }
        - { type: string, enum: [student_affairs, accounts] }
    DirectoryContact:
      type: object
      required: [id, displayName, titleAr, titleDe, role, workEmail, workPhone, contexts, target]
      properties:
        id: { $ref: '#/components/schemas/DirectoryId' }
        displayName: { type: [string, 'null'] }
        titleAr: { type: string }
        titleDe: { type: string }
        role: { type: string, enum: [teacher, admin, principal, deputy, office, guardian] }
        directThreadId: { type: [string, 'null'], format: uuid }
        workEmail: { type: [string, 'null'], format: email }
        workPhone: { type: [string, 'null'] }
        contexts:
          type: array
          items:
            type: object
            required: [id, nameAr, nameDe]
            properties:
              id: { type: string, format: uuid }
              nameAr: { type: string }
              nameDe: { type: string }
        target:
          oneOf:
            - type: object
              required: [kind, id]
              properties:
                kind: { const: person }
                id: { type: string, format: uuid }
            - type: object
              required: [kind, id]
              properties:
                kind: { const: office }
                id: { type: string, enum: [student_affairs, accounts] }
    Persona:
      type: string
      enum: [admin, teacher, guardian]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, messageKey, requestId]
          properties:
            code: { type: string, minLength: 1 }
            messageKey: { type: string, minLength: 1 }
            requestId: { type: string, format: uuid }
            fields:
              type: object
              additionalProperties: { type: string }
  responses:
    Internal:
      description: An unexpected failure occurred.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: internal
              messageKey: error.internal
              requestId: 8be4af5c-9498-4b42-88b0-5ae5b85e7ea2
    Session:
      description: Active school session. Web sign-in and refresh also set HttpOnly cookies.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [accountId, sessionId, personas, activePersona, assurance, expiresAt]
                properties:
                  accountId: { type: string, format: uuid }
                  sessionId: { type: string, format: uuid }
                  personas:
                    type: array
                    items: { $ref: '#/components/schemas/Persona' }
                  activePersona: { $ref: '#/components/schemas/Persona' }
                  assurance: { type: string, enum: [aal1, aal2] }
                  expiresAt: { type: string, format: date-time }
          example:
            data:
              accountId: 07f9999d-5dc2-479d-9c18-bf524b0fd11e
              sessionId: 2d71a427-2ffa-4740-bfa4-308f34973fd0
              personas: [teacher, guardian]
              activePersona: guardian
              assurance: aal1
              expiresAt: '2026-11-19T22:00:00.000Z'
    AuthError:
      description: Authentication, input, authorization or availability failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: unauthenticated
              messageKey: error.unauthenticated
              requestId: 8be4af5c-9498-4b42-88b0-5ae5b85e7ea2
