openapi: 3.1.0
info:
  title: Madrasty El Arabia API
  version: 1.0.0
  description: >
    The v1 contract is additive. Breaking changes require a versioned route.
    Clients ignore unknown response properties and handle unknown error keys generically.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Read the public API version
      responses:
        '200':
          description: API handler ready
          headers:
            X-Request-Id:
              schema: { type: string, format: uuid }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, apiVersion]
                    properties:
                      status: { const: ok }
                      apiVersion: { const: v1 }
              example: { data: { status: ok, apiVersion: v1 } }
        '500':
          $ref: '#/components/responses/Internal'
  /auth/config:
    get:
      operationId: getNativeAuthConfig
      responses:
        '200':
          description: Public Auth settings for the school origin
          content:
            application/json:
              example: { data: { origin: 'https://project.supabase.co', publishableKey: 'sb_publishable_example' } }
        '503':
          $ref: '#/components/responses/AuthError'
  /auth/sign-in:
    post:
      operationId: signInWeb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 1024 }
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/AuthError'
  /auth/session:
    get:
      operationId: getSession
      security: [{ webSession: [] }, { nativeBearer: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/AuthError'
    post:
      operationId: refreshWebSession
      description: Same-origin refresh using the HttpOnly refresh cookie and the CSRF header.
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/AuthError'
  /auth/persona:
    post:
      operationId: switchPersona
      security: [{ webSession: [] }, { nativeBearer: [] }]
      parameters:
        - name: X-School-Persona
          in: header
          required: true
          schema: { $ref: '#/components/schemas/Persona' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [persona]
              properties:
                persona: { $ref: '#/components/schemas/Persona' }
      responses:
        '200':
          $ref: '#/components/responses/Session'
        default:
          $ref: '#/components/responses/AuthError'
  /auth/sign-out:
    post:
      operationId: signOut
      security: [{ webSession: [] }, { nativeBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allDevices]
              properties:
                allDevices: { type: boolean }
      responses:
        '204':
          description: School session access revoked
        default:
          $ref: '#/components/responses/AuthError'
  /auth/revocation-ticket:
    post:
      operationId: issueNativeRevocationTicket
      security: [{ nativeBearer: [] }]
      responses:
        '200':
          description: Short-scope credential allowing session revocation only
          content:
            application/json:
              example: { data: { ticket: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' } }
        default:
          $ref: '#/components/responses/AuthError'
  /auth/revoke:
    post:
      operationId: reconcileNativeSignOut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket, allDevices]
              properties:
                ticket: { type: string, pattern: '^[a-f0-9]{64}
  securitySchemes:
    nativeBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webSession:
      type: apiKey
      in: cookie
      name: __Host-madrasty-session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 2048 }
  schemas:
    Persona:
      type: string
      enum: [admin, teacher, guardian]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, messageKey, requestId]
          properties:
            code: { type: string, minLength: 1 }
            messageKey: { type: string, minLength: 1 }
            requestId: { type: string, format: uuid }
            fields:
              type: object
              additionalProperties: { type: string }
  responses:
    Internal:
      description: An unexpected failure occurred.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: internal
              messageKey: error.internal
              requestId: 8be4af5c-9498-4b42-88b0-5ae5b85e7ea2

 }
                allDevices: { type: boolean }
      responses:
        '204':
          description: School session access revoked
        default:
          $ref: '#/components/responses/AuthError'
components:
  securitySchemes:
    nativeBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webSession:
      type: apiKey
      in: cookie
      name: __Host-madrasty-session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 2048 }
  schemas:
    Persona:
      type: string
      enum: [admin, teacher, guardian]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, messageKey, requestId]
          properties:
            code: { type: string, minLength: 1 }
            messageKey: { type: string, minLength: 1 }
            requestId: { type: string, format: uuid }
            fields:
              type: object
              additionalProperties: { type: string }
  responses:
    Internal:
      description: An unexpected failure occurred.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: internal
              messageKey: error.internal
              requestId: 8be4af5c-9498-4b42-88b0-5ae5b85e7ea2
    Session:
      description: Active school session. Web sign-in and refresh also set HttpOnly cookies.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [accountId, sessionId, personas, activePersona, assurance, expiresAt]
                properties:
                  accountId: { type: string, format: uuid }
                  sessionId: { type: string, format: uuid }
                  personas:
                    type: array
                    items: { $ref: '#/components/schemas/Persona' }
                  activePersona: { $ref: '#/components/schemas/Persona' }
                  assurance: { type: string, enum: [aal1, aal2] }
                  expiresAt: { type: string, format: date-time }
          example:
            data:
              accountId: 07f9999d-5dc2-479d-9c18-bf524b0fd11e
              sessionId: 2d71a427-2ffa-4740-bfa4-308f34973fd0
              personas: [teacher, guardian]
              activePersona: guardian
              assurance: aal1
              expiresAt: '2026-11-19T22:00:00.000Z'
    AuthError:
      description: Authentication, input, authorization or availability failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: unauthenticated
              messageKey: error.unauthenticated
              requestId: 8be4af5c-9498-4b42-88b0-5ae5b85e7ea2
