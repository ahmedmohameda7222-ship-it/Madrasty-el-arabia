components:
  securitySchemes:
    schoolWorker:
      type: http
      scheme: bearer
    nativeBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    webSession:
      type: apiKey
      in: cookie
      name: __Host-madrasty-session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._~-]{1,128}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 2048 }
  schemas:
    AccountProfile:
      type: object
      required: [displayName, guardian, children]
      properties:
        displayName: {type: [string, 'null']}
        guardian:
          type: [object, 'null']
          required: [revision, birthDate, phone, emergencyAddress]
          properties:
            revision: {type: integer, minimum: 1}
            birthDate: {type: [string, 'null'], format: date}
            phone: {type: [string, 'null'], maxLength: 48}
            emergencyAddress: {type: [string, 'null'], maxLength: 500}
        children:
          type: array
          items:
            type: object
            required: [id, displayName, birthDate, age, revision]
            properties:
              id: {type: string, format: uuid}
              displayName: {type: string}
              birthDate: {type: [string, 'null'], format: date}
              age: {type: [integer, 'null'], minimum: 0}
              revision: {type: integer, minimum: 1}
    AccountProfilePatch:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, revision, birthDate, phone, emergencyAddress]
          properties:
            kind: {const: guardian}
            revision: {type: integer, minimum: 1}
            birthDate: {type: [string, 'null'], format: date}
            phone: {type: [string, 'null'], maxLength: 48}
            emergencyAddress: {type: [string, 'null'], maxLength: 500}
        - type: object
          additionalProperties: false
          required: [kind, id, revision, birthDate, displayName]
          properties:
            kind: {const: child}
            id: {type: string, format: uuid}
            revision: {type: integer, minimum: 1}
            birthDate: {type: [string, 'null'], format: date}
            displayName: {type: string, minLength: 1, maxLength: 200}
