    SchoolWorkQueueKey:
      type: string
      enum: [guardian_links, family_imports, class_assignments, bounced_invites, unapproved_attendance, noncontinuation_requests, settlement_review]
    SchoolWorkQueues:
      oneOf:
        - type: object
          required: [asOf, today, timezone, queues]
          properties:
            asOf: { type: string, format: date }
            today: { type: string, format: date }
            timezone: { type: string }
            setupRequired: { const: false }
            overview:
              type: object
              required: [students, classes, teachers, mayPublish, mayIssue]
              properties:
                students: { type: [integer, 'null'], minimum: 0 }
                classes: { type: [integer, 'null'], minimum: 0 }
                teachers: { type: [integer, 'null'], minimum: 0 }
                mayPublish: { type: boolean }
                mayIssue: { type: boolean }
                schoolDays:
                  type: object
                  required: [last, next]
                  properties:
                    last: { type: [string, 'null'], format: date }
                    next: { type: [string, 'null'], format: date }
                maySchedule: { type: boolean }
                mayMonitor: { type: boolean }
                attendance:
                  type: [object, 'null']
                  required: [date, expectedClasses, approvedClasses, present, late, absent]
                  properties:
                    date: { type: string, format: date }
                    expectedClasses: { type: integer, minimum: 0 }
                    approvedClasses: { type: integer, minimum: 0 }
                    present: { type: integer, minimum: 0 }
                    late: { type: integer, minimum: 0 }
                    absent: { type: integer, minimum: 0 }
                finance:
                  type: object
                  required: [month, currency, cash, bank]
                  properties:
                    month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
                    currency: { type: string, minLength: 3, maxLength: 3 }
                    cash: { type: integer, minimum: 0 }
                    bank: { type: integer, minimum: 0 }
            queues:
              type: array
              items:
                type: object
                required: [key, route, filters, state]
                properties:
                  key: { $ref: '#/components/schemas/SchoolWorkQueueKey' }
                  route: { type: string }
                  filters: { type: object, required: [asOf], properties: { asOf: { type: string, format: date } } }
                  state: { type: string, enum: [ready, unavailable] }
                  count: { type: integer, minimum: 0 }
        - type: object
          required: [asOf, today, timezone, setupRequired, mayConfigure, queues]
          properties:
            asOf: { type: 'null' }
            today: { type: 'null' }
            timezone: { type: 'null' }
            setupRequired: { const: true }
            mayConfigure: { type: boolean }
            queues: { type: array, maxItems: 0 }
    SchoolWorkQueueItem:
      type: object
      required: [id, titleAr, titleDe, detailAr, detailDe, target]
      properties:
        id: { type: string, format: uuid }
        titleAr: { type: string }
        titleDe: { type: string }
        detailAr: { type: string }
        detailDe: { type: string }
        target:
          oneOf:
            - {type: object, required: [kind, invitationId], properties: {kind: {const: bounced_invite}, invitationId: {type: string, format: uuid}}}
            - {type: object, required: [kind, classId, date], properties: {kind: {const: attendance_sheet}, classId: {type: string, format: uuid}, date: {type: string, format: date}}}
            - {type: object, required: [kind, requestId], properties: {kind: {const: enrollment_stop}, requestId: {type: string, format: uuid}}}
            - {type: object, required: [kind, receiptId], properties: {kind: {const: receipt_match}, receiptId: {type: string, format: uuid}}}
            - type: object
              required: [kind, guardianId, linkId]
              properties:
                kind: { const: guardian_link }
                guardianId: { type: string, format: uuid }
                linkId: { type: string, format: uuid }
            - type: object
              required: [kind, jobId]
              properties:
                kind: { const: family_import }
                jobId: { type: string, format: uuid }
            - type: object
              required: [kind, classId, yearId]
              properties:
                kind: { const: class_assignment }
                classId: { type: string, format: uuid }
                yearId: { type: string, format: uuid }
